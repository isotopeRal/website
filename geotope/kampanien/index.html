<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="W. Deecke, Geologischer Führer durch Campanien (1901): 200 Lokalitäten auf der Karte, mit heutigem Zustand, Originaltext und ISPRA-Geologie.">
<title>Deeckes Kampanien-Führer heute</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: wie Begers und Becks Führer und die Geotopkarte Sachsen – links ein Karteikarten-Panel (Filter, Liste, Steckbrief), rechts die Karte; auf dem Handy untereinander. */
:root{
  --bg:#eef0eb; --panel:#fafbf8; --fg:#1c2320; --muted:#5a645e; --line:#d6dbd2; --line-strong:#b9c0b4;
  --accent:#1d5a60; --accent-fg:#ffffff; --accent-soft:#dbe9e8; --warn:#8a5a00; --warn-soft:#f6ecd6;
  --map-bg:#e4e7df; --grid:#aab2a3; --grid-fill:rgba(29,90,96,.07); --halo:#ffffff; --city:#3a423d;
  --c-aufschluss:#9a3b5a; --c-relief:#55792a; --c-geohist:#a8740e; --c-quelle:#2668b0; --c-hoehle:#4c4459; --c-none:#868c85;
  --r1:#b0425e; --r2:#2f6fa8; --r3:#c07a12; --r4:#5d8a2e; --r5:#7b4ea0; --r6:#a0522d; --r7:#1f8a85; --r8:#868c85;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-ui:"Barlow Semi Condensed",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --panel:#181e1b; --fg:#e4eae5; --muted:#9aa69e; --line:#2a332e; --line-strong:#3c4741;
  --accent:#73b9be; --accent-fg:#0d1513; --accent-soft:#1d3335; --warn:#e6b450; --warn-soft:#33291a;
  --map-bg:#0f1312; --grid:#3a453f; --grid-fill:rgba(115,185,190,.07); --halo:#0c100e; --city:#c9d2cb;
  --c-aufschluss:#e57f9c; --c-relief:#9ccb5c; --c-geohist:#e5b44f; --c-quelle:#6eaaf0; --c-hoehle:#bcb0d0; --c-none:#8f978f;
  --r1:#e7809a; --r2:#71aee6; --r3:#e8b257; --r4:#a2cf68; --r5:#bb95e0; --r6:#de9468; --r7:#5fcfc8; --r8:#8f978f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --panel:#181e1b; --fg:#e4eae5; --muted:#9aa69e; --line:#2a332e; --line-strong:#3c4741;
  --accent:#73b9be; --accent-fg:#0d1513; --accent-soft:#1d3335; --warn:#e6b450; --warn-soft:#33291a;
  --map-bg:#0f1312; --grid:#3a453f; --grid-fill:rgba(115,185,190,.07); --halo:#0c100e; --city:#c9d2cb;
  --c-aufschluss:#e57f9c; --c-relief:#9ccb5c; --c-geohist:#e5b44f; --c-quelle:#6eaaf0; --c-hoehle:#bcb0d0; --c-none:#8f978f;
  --r1:#e7809a; --r2:#71aee6; --r3:#e8b257; --r4:#a2cf68; --r5:#bb95e0; --r6:#de9468; --r7:#5fcfc8; --r8:#8f978f;
  color-scheme:dark}

/* Eigener Standort */
:root{--me:#1667d9; --me-fill:rgba(22,103,217,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--me:#5ea4ff; --me-fill:rgba(94,164,255,.14)}}
:root[data-theme="dark"]{--me:#5ea4ff; --me-fill:rgba(94,164,255,.14)}
.leaflet-bar a.locbtn{display:flex;align-items:center;justify-content:center}
.leaflet-bar a.locbtn svg{width:18px;height:18px}
.leaflet-bar a.locbtn.on{color:var(--me)}
.leaflet-bar a.locbtn.wait svg{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.leaflet-bar a.locbtn.wait svg{animation:none}}
.nearrow{display:flex;align-items:center;gap:8px;font-size:14px}
.nearrow label{color:var(--fg);white-space:nowrap}
.nearrow select{width:auto;flex:1}
.locmsg{padding-block:8px;font-size:13px;line-height:1.4;color:var(--fg);background:var(--warn-soft);border-bottom:1px solid var(--line)}
.locmsg.ok{background:var(--accent-soft)}
.dist{font:500 12px var(--f-mono);color:var(--me);padding-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.distline{font-size:14px;color:var(--me);margin:4px 0 0;font-weight:600}

/* ---------- Leaflet-Grundstile (inline, da externe Stylesheets blockiert sind) ---------- */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;outline-offset:1px}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-tile::selection{background:transparent}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-shadow-pane img,.leaflet-container .leaflet-tile-pane img,.leaflet-container img.leaflet-image-layer,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:none}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-tile{filter:inherit;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-box{width:0;height:0;box-sizing:border-box;z-index:800;border:2px dotted var(--accent);background:var(--grid-fill)}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:visiblePainted;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}
.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}
.leaflet-zoom-animated{transform-origin:0 0}
svg.leaflet-zoom-animated{will-change:transform}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:grab}
.leaflet-crosshair,.leaflet-crosshair .leaflet-interactive{cursor:crosshair}
.leaflet-dragging .leaflet-grab,.leaflet-dragging .leaflet-grab .leaflet-interactive,.leaflet-dragging .leaflet-marker-draggable{cursor:grabbing}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-image-layer.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:visiblePainted;pointer-events:auto}
.leaflet-container{background:var(--map-bg);font-family:var(--f-ui);font-size:13px}
.leaflet-container a{color:var(--accent)}
.leaflet-bar{box-shadow:0 1px 4px rgba(0,0,0,.25);border-radius:6px;border:1px solid var(--line-strong);overflow:hidden}
.leaflet-bar a{background:var(--panel);color:var(--fg);border-bottom:1px solid var(--line);width:32px;height:32px;line-height:32px;display:block;text-align:center;text-decoration:none}
.leaflet-bar a:last-child{border-bottom:none}
.leaflet-bar a:hover{background:var(--accent-soft)}
.leaflet-bar a.leaflet-disabled{cursor:default;color:var(--muted);opacity:.5}
.leaflet-control-zoom-in,.leaflet-control-zoom-out{font:600 20px/32px var(--f-mono)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent);margin:0;padding:1px 6px;color:var(--muted);font-size:11px;line-height:1.4;border-top-left-radius:4px}
.leaflet-control-attribution a{color:var(--accent)}
.leaflet-attribution-flag{display:none!important}
.leaflet-control-scale-line{border:1.5px solid var(--muted);border-top:none;line-height:1.1;padding:2px 5px 1px;white-space:nowrap;box-sizing:border-box;background:color-mix(in srgb,var(--panel) 80%,transparent);color:var(--fg);font:500 11px var(--f-mono)}
.leaflet-tooltip{position:absolute;padding:4px 8px;background:var(--panel);border:1px solid var(--line-strong);border-radius:4px;color:var(--fg);white-space:nowrap;-webkit-user-select:none;user-select:none;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.18);font:600 13px/1.25 var(--f-display)}
.leaflet-tooltip-top{margin-top:-8px}.leaflet-tooltip-bottom{margin-top:8px}.leaflet-tooltip-left{margin-left:-8px}.leaflet-tooltip-right{margin-left:8px}
.leaflet-tooltip small{display:block;font:400 11.5px/1.3 var(--f-ui);color:var(--muted)}

/* ---------- App ---------- */
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:minmax(320px,380px) 1fr;}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-right:1px solid var(--line);position:relative}
.panel-scroll{overflow:auto;flex:1;min-height:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
#map{min-width:0;min-height:0;height:100%}

.head{padding-block:18px 12px;border-bottom:1px solid var(--line)}
.eyebrow{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 30px/1 var(--f-display);margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.head p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.4}

.filters{padding-block:14px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search input{width:100%;box-sizing:border-box;font:500 15px var(--f-ui);padding:9px 34px 9px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--fg)}
.search input:focus-visible,select:focus-visible,button:focus-visible,.chip:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;width:26px;height:26px;border-radius:4px}
.lbl{font:600 11px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 13.5px/1 var(--f-ui);padding:6px 9px 6px 7px;border:1px solid var(--line-strong);border-radius:999px;background:transparent;color:var(--fg);cursor:pointer;user-select:none}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px var(--halo)}
.chip .n{font:500 11.5px var(--f-mono);color:var(--muted)}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.selrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.selrow > div{min-width:0}
select{width:100%;font:500 14px var(--f-ui);padding:7px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg);color:var(--fg);min-width:0;text-overflow:ellipsis}
.toggles{display:grid;gap:6px;font-size:14px}
.toggles label{display:flex;gap:8px;align-items:center;cursor:pointer}
.toggles input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.toggles .hint{color:var(--muted);font-size:12.5px}

.resbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.count{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.count b{color:var(--fg);font-weight:500}
.btn{font:600 13px var(--f-ui);padding:6px 10px;border-radius:6px;border:1px solid var(--line-strong);background:transparent;color:var(--fg);cursor:pointer}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:start;padding:9px 16px 9px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:var(--accent-soft)}
.item[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.item .dot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--c)}
.item .dot.approx{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.item .t{font:600 15px/1.25 var(--f-display);min-width:0;overflow-wrap:anywhere}
.item .s{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.3}
.item .nr{font:500 11px var(--f-mono);color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;color:var(--muted);text-align:center;line-height:1.5}
.more{display:block;margin:12px auto 18px}

/* Steckbrief */
.detail{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;z-index:5}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.dbody{overflow:auto;flex:1;min-height:0;padding-block:16px 28px}
.dtype{display:inline-flex;align-items:center;gap:7px;font:600 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.dtype .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.dbody h2{font:700 27px/1.05 var(--f-display);margin:8px 0 4px;text-wrap:balance;overflow-wrap:anywhere}
.alt{color:var(--muted);font-style:italic;font-family:var(--f-body);margin:0 0 6px}
.place{font-size:14.5px;color:var(--muted);margin:0}
.notice{margin-top:12px;padding:9px 11px;border-radius:6px;background:var(--warn-soft);color:var(--fg);font-size:13.5px;line-height:1.4;border-left:3px solid var(--warn)}
.sec{margin-top:20px}
.sec h3{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.prose{font:400 15.5px/1.55 var(--f-body);margin:0 0 10px;white-space:pre-line;max-width:65ch}
dl.kv{display:grid;grid-template-columns:minmax(96px,34%) 1fr;gap:5px 12px;margin:0;font-size:14px;line-height:1.4}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere;white-space:pre-line}
.mono{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font:600 12px/1 var(--f-mono);padding:4px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-right:6px;vertical-align:1px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.links a{font:600 13.5px var(--f-ui);color:var(--accent);text-decoration:none;border:1px solid var(--line-strong);padding:6px 10px;border-radius:6px}
.links a:hover{background:var(--accent-soft)}
.official{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border:1px solid var(--accent);border-radius:8px;text-decoration:none;color:var(--fg);background:var(--accent-soft)}
.official:hover{filter:brightness(.97)}
.official b{display:block;font:600 15px/1.2 var(--f-display);color:var(--accent)}
.official span{font-size:12.5px;color:var(--muted)}
.official i{font-style:normal;margin-left:auto;color:var(--accent);font-size:18px}
.tag{display:inline-block;font:600 10px/1 var(--f-mono);letter-spacing:.05em;padding:3px 5px;border-radius:3px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:2px}

/* Kartensteuerung */
.mapbox{background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.16);color:var(--fg);font-family:var(--f-ui)}
.basemap{padding:8px;display:grid;gap:6px;width:190px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.seg button{font:600 12.5px var(--f-ui);padding:6px 4px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.basemap label{display:flex;gap:7px;align-items:center;font-size:13px;cursor:pointer}
.basemap input{accent-color:var(--accent);margin:0}
.basemap .note{font-size:11.5px;line-height:1.35;color:var(--muted)}
.basemap .colorby{display:grid;gap:4px}
.legend{padding:8px 10px;max-width:230px;font-size:12.5px}
.basemap details>summary{font:600 11px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:2px 0}
.basemap details>summary::-webkit-details-marker{display:none}
.basemap details>summary::after{content:"▾";font-size:12px}
.basemap details:not([open])>summary::after{content:"▸"}
.basemap .basebody{display:grid;gap:6px;margin-top:8px}
.basemap .oprow{font-size:12.5px;gap:8px}
.basemap .oprow input{flex:1;min-width:0;accent-color:var(--accent)}
.geoinfo{padding:7px 10px;max-width:min(270px,62vw);font-size:13px;line-height:1.35}
.geoinfo .ttl{font:600 10.5px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.geoinfo .gi b{font:600 14px/1.25 var(--f-display)}
.geoinfo .gi small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sq{display:inline-block;width:14px;height:11px;flex:none;border-radius:2px;border:1px solid rgba(0,0,0,.25);margin-right:6px;vertical-align:-1px}
.geoleg{max-height:42vh;overflow:auto;width:250px;max-width:250px}
.geoleg summary{font:600 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.geoleg .grp{font:600 10.5px/1.2 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:9px 0 3px}
.geoleg .row{display:flex;align-items:flex-start;gap:0;font-size:12px;line-height:1.3;margin:3px 0}
.geoleg .row .sq{margin-top:1px}
.legend .row{display:flex;align-items:center;gap:7px;line-height:1.55}
.legend .sw{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 0 1.5px var(--halo)}
.legend .sw.ring{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted);outline:1px dashed var(--muted);outline-offset:-1px}
.legend .n{margin-left:auto;font:500 11px var(--f-mono);color:var(--muted);padding-left:8px}
.legend .ttl{font:600 11px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.city{font:600 12px/1 var(--f-display);color:var(--city);white-space:nowrap;text-shadow:0 0 3px var(--map-bg),0 0 3px var(--map-bg),0 0 2px var(--map-bg)}
.city.t1{font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.city.t2{font-size:13px}
.city.peak{font-weight:500;font-style:italic}
.city i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--city);margin-right:4px;vertical-align:2px}

ine ausgeführt. Zum Studium desselben eignen sich am besten die Anbrüche unterhalb des Vomero am westlichen Ende des Corso Vittorio Emanuele oder die Einschnitte des Posillipo nahe seinem Ende, sei es an der Strada Nuova, sei es am Meer bei Marochiaro. Unter diesem gelben Tuff soll nach Abich am Posillipo der Piperno anstehen, und in der That ist bei den verschiedenen Tunnelbauten ein derartiges Gestein im Rione Amedeo angetroffen. Ausserdem hat man unter dem Tuff (Montesanto) die Breccien wieder gefunden, welche in der Gegend von Pianura das Liegende bilden (vergl. S. 33) und zwar mit denselben Obsidianen und Leucitophyren. […]","sp":61,"u1":["Depositidi spiaggia attuale e recente","g2","Holozän","Napoli","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"],"u2":["Escavato di canali per bonifica","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":6,"k":3,"r":"Neapel – Camaldoli – Pianura","s":61,"t":"K","b":"Einschnitte am Ende des Posillipo, an der Strada Nuova und am Meer bei Marechiaro","n":"Marechiaro, Posillipo","z":"Steile Tuffküste; Fischerdorf und Badeplätze","zg":"frei","sg":"Parco Sommerso di Gaiola (vor der Küste)","g":"Gelbtuff und jüngere Tuffe des Posillipo (u. a. Tuffkegel von Trentaremi)","l":"genau","la":40.7949,"lo":14.1928,"c":"Napoli (NA)","ex":"Cumae in das Meer leiten soll, wurden in diesem Gesteine ausgeführt. Zum Studium desselben eignen sich am besten die Anbrüche unterhalb des Vomero am westlichen Ende des Corso Vittorio Emanuele oder die Einschnitte des Posillipo nahe seinem Ende, sei es an der Strada Nuova, sei es am Meer bei Marochiaro. Unter diesem gelben Tuff soll nach Abich am Posillipo der Piperno anstehen, und in der That ist bei den verschiedenen Tunnelbauten ein derartiges Gestein im Rione Amedeo angetroffen. Ausserdem hat man unter dem Tuff (Montesanto) die Breccien wieder gefunden, welche in der Gegend von Pianura das Liegende bilden (vergl. S. 33) und zwar mit denselben Obsidianen und Leucitophyren. […]","sp":61},{"id":7,"k":3,"r":"Neapel – Camaldoli – Pianura","s":61,"t":"A","b":"Trachyt in Blöcken, schwer aufzufinden in den Gärten unterhalb der Kirche S. Maria del Pianto an der Ostseite der Stadt","n":"Santa Maria del Pianto, Poggioreale","z":"Schon 1901 kaum aufgeschlossen; heute im Friedhofs- und Siedlungsgebiet","zg":"unklar","sg":"–","g":"Trachytischer Lavadom unter dem Gelbtuff (Caldera-Rand der Campi Flegrei)","l":"geschätzt","la":40.8652,"lo":14.2856,"c":"Napoli (NA)","ex":"[…] Der eine Gang wurde als eine zweitheilige Gesteinsmasse mit 380 und 110 m Dicke bei unterirdischen Bauten am Abhang des Vomero entdeckt, es ist ein bis 12°/, Sodalith führender Hornblendetrachyt, von Johnston- Lavis und Freda eingehend beschrieben. Das andere Vorkommen kann man mit Schwierigkeit in den Gärten unterhalb der Kirche Sta. Maria del Pianto, an der Ostseite der Stadt bei dem Kirchhofe aufsuchen. Früher muss es besser erschlossen gewesen sein; es wird als ein in Blöcken oder Kugeln abgesonderter Trachyt von dunkler Farbe, schlackiger Structur mit viel Tuffeinschlüssen geschildert. Die Decke des gelben Tuffs sind lose Aschen und Bimssteintuffe, der Tufo bigio der “Campi Flegrei. […]","sp":61,"u1":["Depositi alluvionali","b","Holozän","Napoli","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"],"u2":["Discariche","Holozän","Anthropogene Aufschüttung","#b2aaa0"]},{"id":8,"k":3,"r":"Neapel – Camaldoli – Pianura","s":62,"t":"A","b":"Lose Aschen und Bimssteintuffe (Tufo bigio) über dem gelben Tuff, gut am Corso Vittorio Emanuele bei der Funicolare und oben am Vomero","n":"Corso Vittorio Emanuele an der Funicolare di Chiaia","z":"Bebaut; Standseilbahn in Betrieb","zg":"frei","sg":"–","g":"Jüngere Bims- und Aschenlagen der Campi Flegrei (nach dem Gelbtuff, jünger als 15 000 Jahre)","l":"geschätzt","la":40.8379,"lo":14.2363,"c":"Napoli (NA)","ex":"gewesen sein; es wird als ein in Blöcken oder Kugeln abgesonderter Trachyt von dunkler Farbe, schlackiger Structur mit viel Tuffeinschlüssen geschildert. Die Decke des gelben Tuffs sind lose Aschen und Bimssteintuffe, der Tufo bigio der “Campi Flegrei. Man sieht denselben überall auf len Höhen gut erschlossen, u. A. am Corso Vittorio Emanuele bei der Funicolare, oben auf dem Vomero, über den Tunneln des Posillipo und in dem Einschnitt der Strada Nuova di Posillipo gerade bevor sich die Aussicht auf die Ebene von Bagnoli eröffnet. […]","sp":62,"u1":["Tufi di castel dell'ovo","OVO","Oberpleistozän","Napoli","Pyroklastite, Holozän","#f09660"],"u2":["Prodotti piroclastici indifferenziati","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":9,"k":3,"r":"Neapel – Camaldoli – Pianura","s":62,"t":"F","b":"Schwache Eisensäuerlinge am Ende des Pizzofalcone und eine Schwefelquelle bei S. Lucia, 18–20 °C","n":"Mineralquellen von Santa Lucia und Chiatamone","z":"Die öffentlichen Quellen („acqua ferrata“, „acqua suffregna“) wurden 1973 nach der Cholera geschlossen","zg":"geschlossen","sg":"–","g":"Mineralisiertes Grundwasser aus dem Gelbtuff","l":"geschätzt","la":40.83,"lo":14.2479,"c":"Napoli (NA)","ex":"[…] Man sieht denselben überall auf len Höhen gut erschlossen, u. A. am Corso Vittorio Emanuele bei der Funicolare, oben auf dem Vomero, über den Tunneln des Posillipo und in dem Einschnitt der Strada Nuova di Posillipo gerade bevor sich die Aussicht auf die Ebene von Bagnoli eröffnet. Aus dem gelben Tuff entspringen am Ende des Pizzofalcone schwache Eisensäuerlinge und bei Sta. Lucia eine schwefelhaltige Quelle, alle mit etwas erhöhter Temperatur zwischen 18 und 20°C. […]","sp":62,"u1":["Area non rilevabile","","","Napoli","Nicht kartierbar (bebaut)","#d6d6d2"],"u2":["Discariche","Holozän","Anthropogene Aufschüttung","#b2aaa0"]},{"id":10,"k":3,"r":"Neapel – Camaldoli – Pianura","s":62,"t":"S","b":"Überblicksweg: Corso hinauf, Via Tasso zum Vomero, Blick auf den Golf","n":"Via Tasso, Vomero","z":"Wohnstraße mit Ausblicken","zg":"frei","sg":"–","g":"Steilrand der Gelbtuff-Caldera","l":"geschätzt","la":40.838,"lo":14.2232,"c":"Napoli (NA)","ex":"[…] Aus dem gelben Tuff entspringen am Ende des Pizzofalcone schwache Eisensäuerlinge und bei Sta. Lucia eine schwefelhaltige Quelle, alle mit etwas erhöhter Temperatur zwischen 18 und 20°C. Wer die geologischen Verhältnisse Neapels rasch überblicken will, beginne mit einem Besuch der Steinbrüche am unteren Ende des Corso, gehe diesen hinauf bis zur Via Tasso, folge derselben bis zur Höhe des Vomero, wo sich bei den Windungen der Strasse rückwärts ein Blick auf den Golf eröffnet. […]","sp":62,"u1":["Successione di depositi piroclastici giallastri","TGNa","Oberpleistozän","Napoli","Neapolitanischer Gelbtuff (15 000 J.)","#e8c448"],"u2":["Serie comprensiva","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":11,"k":3,"r":"Neapel – Camaldoli – Pianura","s":62,"t":"S","b":"Weg auf der Höhe des Posillipo: Überblick über Camaldoli, Astroni, Solfatara, Monte Nuovo, Baia, Miseno und Ischia","n":"Parco Virgiliano (Parco della Rimembranza), Capo Posillipo","z":"Öffentlicher Park mit Aussichtsterrassen","zg":"frei","sg":"–","g":"Gelbtuff des Posillipo-Rückens","l":"genau","la":40.798,"lo":14.184,"c":"Napoli (NA)","ex":"[…] Wer die geologischen Verhältnisse Neapels rasch überblicken will, beginne mit einem Besuch der Steinbrüche am unteren Ende des Corso, gehe diesen hinauf bis zur Via Tasso, folge derselben bis zur Höhe des Vomero, wo sich bei den Windungen der Strasse rückwärts ein Blick auf den Golf eröffnet. Der Weg auf der Höhe des Posillipo nach dessen Spitze hin gewährt bei wiederholten Durchblicken eine treffliche Uebersicht über den Steilabsturz des Camaldoli-Berges, die Astroni, den Campiglione, die weissen Hügel der Solfatara, den Te ni Mte. Nuovo, Bajae, Cap Miseno und Ischia; ferner zeigt er den Steilabsturz des Posillipo gegen Bagnoli und Fuorigrotta, die an einen Meeresboden erinnernde Ebene zu seinen Füssen und die vor dem Strande sich erhebende Insel Nisida, deren Krater allerdings verdeckt ist. […]","sp":62,"u1":["Subsintema di agnano-soccavo","VEF11","Holozän","Procida","Quartäre Abfolge (Sintem, gemischte Ablagerungen)","#e2c496"],"u2":["Serie comprensiva","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":12,"k":3,"r":"Neapel – Camaldoli – Pianura","s":63,"t":"A","b":"Einschnitt der Strada Nuova di Posillipo vor dem Blick auf Bagnoli: Grenze von gelbem Tuff und lockerem Bimssteintuff","n":"Via Posillipo / Discesa Coroglio","z":"Straßenböschungen, teils vermauert","zg":"frei","sg":"–","g":"Gelbtuff (NYT), überlagert von jüngeren Bims- und Aschenlagen","l":"geschätzt","la":40.8002,"lo":14.1808,"c":"Napoli (NA)","ex":"Te ni Mte. Nuovo, Bajae, Cap Miseno und Ischia; ferner zeigt er den Steilabsturz des Posillipo gegen Bagnoli und Fuorigrotta, die an einen Meeresboden erinnernde Ebene zu seinen Füssen und die vor dem Strande sich erhebende Insel Nisida, deren Krater allerdings verdeckt ist. Am unteren Ende des Posillipoweges werden in dem erwähnten Einschnitte die beiden Tuffe und ihre Berührungsflächen sichtbar. Von Bagnoli kann man mit einer der Bahnen zurück- ‘fahren und kommt dabei an dem kleinen Eruptionskegel der Montagnola di Sta. Teresa vorbei, der gerade dem Eingang zum Lago d’Agnano gegenüberliegt, aber ausser sanidinreichen Trachytbomben nichts Besonderes bietet. […]","sp":63,"u1":["Tufo giallo napoletano","TGN","Oberpleistozän","Napoli","Neapolitanischer Gelbtuff (15 000 J.)","#e8c448"],"u2":["Serie comprensiva","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":13,"k":3,"r":"Neapel – Camaldoli – Pianura","s":63,"t":"V","b":"Insel Nisida vor dem Strand, ein Krater, dessen Inneres verdeckt ist","n":"Isola di Nisida","z":"Durch einen Damm mit dem Festland verbunden; Jugendstrafanstalt, nicht frei zugänglich","zg":"geschlossen","sg":"Area Marina Protetta Parco Sommerso di Gaiola (Umfeld)","g":"Tuffkegel aus der jüngeren Ausbruchsphase der Campi Flegrei, im Süden vom Meer geöffnet","l":"genau","la":40.7958,"lo":14.162,"c":"Napoli (NA)","ex":"Te ni Mte. Nuovo, Bajae, Cap Miseno und Ischia; ferner zeigt er den Steilabsturz des Posillipo gegen Bagnoli und Fuorigrotta, die an einen Meeresboden erinnernde Ebene zu seinen Füssen und die vor dem Strande sich erhebende Insel Nisida, deren Krater allerdings verdeckt ist. Am unteren Ende des Posillipoweges werden in dem erwähnten Einschnitte die beiden Tuffe und ihre Berührungsflächen sichtbar. Von Bagnoli kann man mit einer der Bahnen zurück- ‘fahren und kommt dabei an dem kleinen Eruptionskegel der Montagnola di Sta. Teresa vorbei, der gerade dem Eingang zum Lago d’Agnano gegenüberliegt, aber ausser sanidinreichen Trachytbomben nichts Besonderes bietet. […]","sp":63,"u1":["Tufo di nisida","TNI","Holozän","Procida","Pyroklastite, Holozän","#f09660"],"u2":["Tufo giallo di capo miseno e di nisida","Holozän","Neapolitanischer Gelbtuff (15 000 J.)","#e8c448"]},{"id":14,"k":3,"r":"Neapel – Camaldoli – Pianura","s":63,"t":"V","b":"Kleiner Eruptionskegel der Montagnola di S. Teresa gegenüber dem Eingang zum Lago d'Agnano, mit Sanidin-Trachytbomben","n":"Hügel bei Bagnoli gegenüber dem Agnano-Eingang (heutiger Name unklar)","z":"Vermutlich überbaut; Lage geschätzt","zg":"unklar","sg":"–","g":"Kleiner Schlackenkegel der Campi Flegrei","l":"geschätzt","la":40.8195,"lo":14.169,"c":"Napoli (NA)","ex":"[…] Am unteren Ende des Posillipoweges werden in dem erwähnten Einschnitte die beiden Tuffe und ihre Berührungsflächen sichtbar. Von Bagnoli kann man mit einer der Bahnen zurück- ‘fahren und kommt dabei an dem kleinen Eruptionskegel der Montagnola di Sta. Teresa vorbei, der gerade dem Eingang zum Lago d’Agnano gegenüberliegt, aber ausser sanidinreichen Trachytbomben nichts Besonderes bietet. Diese Excursion nimmt einen halben Tag in Anspruch. Ebenso viel Zeit erfordert der Besuch von Camaldoli und der Gegend von Pianura. Der Weg von Neapel zum Kloster ist in allen Reisehandbüchern ausführlich geschildert. […]","sp":63,"u1":["Litosoma di astroni","ATN","Holozän","Napoli","Pyroklastite, Holozän","#f09660"],"u2":["Prodotti piroclastici dell'astroni","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":15,"k":3,"r":"Neapel – Camaldoli – Pianura","s":63,"t":"S","b":"Kloster Camaldoli: das Rondell im Klostergarten gibt den vollständigsten Überblick über die Campi Flegrei; am Weg Gelbtuff und Bimssteintuff mit Erosionsrinnen","n":"Eremo dei Camaldoli, 458 m","z":"Kloster (Brigittinnen) mit Aussichtsterrasse; Park ringsum","zg":"eingeschränkt","sg":"Parco Metropolitano delle Colline di Napoli","g":"Höchster Punkt des Caldera-Randes der Campi Flegrei: Kampanischer Ignimbrit unter Gelbtuff","l":"genau","la":40.8584,"lo":14.1934,"c":"Napoli (NA)","ex":"[…] Diese Excursion nimmt einen halben Tag in Anspruch. Ebenso viel Zeit erfordert der Besuch von Camaldoli und der Gegend von Pianura. Der Weg von Neapel zum Kloster ist in allen Reisehandbüchern ausführlich geschildert. Jenseits der Schlucht von Archetiello tritt in den Hohlwegen gelber Tuff hervor, dann gelangt man bald wieder in den lockeren Bimssteintuff, der die gesammte Oberfläche bedeckt. Der Regen schwemmt die kleinen hellen Bimssteine oft zu !/, m dicken Lagen zusammen. Das Herabschleppen von Reisig, das Gehen von Menschen und Thieren haben gemeinsam mit dem Regen in diesen Tuffen Rinnen gegraben, die sich allmählich zu Schluchten vertieften. […]","sp":63,"u1":["Subsintema di agnano-soccavo","VEF11","Holozän","Napoli","Quartäre Abfolge (Sintem, gemischte Ablagerungen)","#e2c496"],"u2":["Prodotti piroclastici indifferenziati","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":16,"k":3,"r":"Neapel – Camaldoli – Pianura","s":64,"t":"V","b":"Fast kreisförmiger Kraterboden von Pianura (2 × 3 km) mit Piperno am Fuß und mächtigen Breccien am Steilrand; später ein verschwundenes Maar","n":"Senke von Pianura, Neapel","z":"Großstädtisch bebaut","zg":"frei","sg":"–","g":"Teil der Caldera des Kampanischen Ignimbrits; kein eigener Krater im heutigen Sinn","l":"genau","la":40.86,"lo":14.176,"c":"Napoli (NA)","ex":"[…] Das Rondell im Klostergarten gewährt den vollständigsten Ueberblick der Campi Flegrei, deren einzelne Krater sich mittelst der Karte leicht herausfinden lassen. Gerade unterhalb breitet sich der beinahe kreisförmige Kraterboden von Pianura (2 km N.—S., 3 km 0.—W.) aus, dem auf der anderen Seite des Spornes die ‘Senke von Soccavo zwischen letzterem und dem Vomero entspricht. Doch ist es zweifelhaft, ob diese auch einen Krater darstellt. Dass aber der weite Trichter von Pianura als solcher zu gelten hat, ergiebt sich aus der Gestalt des Berges, aus der Piperno-Lava an seinem Fusse und aus den mächtigen Breccien, welche längs des Steilrandes an mehreren Punkten erschlossen sind. […]","sp":64,"u1":["Litosoma di astroni","ATN","Holozän","Napoli","Pyroklastite, Holozän","#f09660"],"u2":["Escavato di canali per bonifica","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":17,"k":3,"r":"Neapel – Camaldoli – Pianura","s":64,"t":"A","b":"Z. T. unterirdische Steinbrüche auf Piperno südlich von Pianura; darüber die „Museum-Breccie“ von Johnston-Lavis","n":"Cave di Piperno, Pianura (Masseria del Monte)","z":"Abbau eingestellt; Höhlen und Brüche teils verfallen, teils als Lager genutzt","zg":"eingeschränkt","sg":"–","g":"Piperno und Breccia Museo: verschweißte, gröbste Fazies des Kampanischen Ignimbrits (ca. 39 800 Jahre)","l":"geschätzt","la":40.8535,"lo":14.1815,"c":"Napoli (NA)","ex":"[…] Man folge daher dem Wege von Camaldoli nach Nazaret und steige nach Pianura hinunter. Südlich des Ortes sind am Fusse des Berges die z. Th. unterirdischen Steinbrüche auf Piperno eröffnet, von dem überall Stücke und Blöcke verstreut sind. Das Gestein ist grau, dunkel geflammt, porös, tuffartig. Es wird jetzt ziemlich allgemein als ein Trachyt angesehen und muss dann als Sodalith führender Augittrachyt mit Fluidaloder sog. Eutaxitstructur bezeichnet werden. Die helleren und dunkleren Partieen haben trotz des verschiedenen Habitus mineralogisch die gleiche Zusammensetzung. […]","sp":64,"u1":["Litosoma di astroni","ATN","Holozän","Napoli","Pyroklastite, Holozän","#f09660"],"u2":["Prodotti di dilavamento","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":18,"k":3,"r":"Neapel – Camaldoli – Pianura","s":64,"t":"A","b":"Pfade Camaldolilli–Soccavo und Nazaret–Pianura: das für Kampanien wichtige Profil am Steilrand","n":"Steilhang des Camaldoli-Rückens, Soccavo","z":"Steile Wege, z. T. verwachsen","zg":"eingeschränkt","sg":"Parco Metropolitano delle Colline di Napoli","g":"Profil: Piperno – Breccia Museo – Gelbtuff – Bimsasche","l":"geschätzt","la":40.852,"lo":14.19,"c":"Napoli (NA)","ex":"[…] Dass aber der weite Trichter von Pianura als solcher zu gelten hat, ergiebt sich aus der Gestalt des Berges, aus der Piperno-Lava an seinem Fusse und aus den mächtigen Breccien, welche längs des Steilrandes an mehreren Punkten erschlossen sind. Sowohl der Pfad von Camaldolilli nach Soccavo, als auch der von Nazaret nach Pianura, beides steile, etwas unbequeme Fuss- oder Maulthierwege, zeigen mit kleinen Abweichungen das Profil, welches, wie oben S. 33 gesagt, für die Geologie Campaniens von Wichtigkeit ist. Man folge daher dem Wege von Camaldoli nach Nazaret und steige nach Pianura hinunter. […]","sp":64,"u1":["Deposito di versante","a","Holozän","Napoli","Hangschutt, Rutschmassen","#ecdeba"],"u2":["Pozzolana","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":19,"k":3,"r":"Neapel – Camaldoli – Pianura","s":66,"t":"A","b":"Am Fuß des Camaldoli-Sporns mächtige Bomben- und Tufflagen in Wasserrissen; sie stauten einst einen See im Krater von Pianura","n":"Fuß des Camaldoli-Sporns zwischen Pianura und Soccavo","z":"Bebaut; Lage geschätzt","zg":"unklar","sg":"–","g":"Proximale Ablagerungen der Campi Flegrei","l":"geschätzt","la":40.851,"lo":14.182,"c":"Napoli (NA)","ex":"ner Sees, des Monte di Procida, der Insel Procida auf ältere basische Eruptionen in den Phlegräischen Feldern schliessen, von denen wir bisher nur durch diese Trümmer Kenntniss haben. — Von Pianura lassen sich bei genügender Zeit Astroni und Lago d’Agnano besuchen, sonst gehe man nach Fuorigrotta oder über Soccavo nach Archetiello zurück. Am Fusse des Camaldoli-Spornes sind in den Wasserrissen und z. Th. dicht an der Strasse mächtige Bomben- und Tufflagen aufgeschlossen. Diese Bänke haben lange Zeit den Abfluss der Regenwässer aus dem Pianura-Krater verhindert, wodurch sich in dem letzteren ein See bildete. […]","sp":66,"u1":["Litosoma di astroni","ATN","Holozän","Napoli","Pyroklastite, Holozän","#f09660"],"u2":["Prodotti di dilavamento","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":20,"k":3,"r":"Lago d’Agnano – Astroni – Fossa Lupara – Cigliano","s":67,"t":"A","b":"Einschnitte im Bimssteintuff an der Straße von der Station Agnano nach Norden: Pisolithtuff mit erbsengroßen Aschenkugeln","n":"Via Agnano Astroni, Agnano","z":"Straßenböschungen","zg":"frei","sg":"Parco Regionale dei Campi Flegrei","g":"Akkretionäre Lapilli in Ablagerungen pyroklastischer Dichteströme","l":"geschätzt","la":40.8255,"lo":14.164,"c":"Napoli (NA)","ex":"Man fährt mit dem Tram oder der Bahn nach der Station Agnano und folgt der nach Norden abbiegenden Chaussee, welche durch Einschnitte in dem Bimssteintuff führt, wobei sich in dessen mächtigen Aschenlagen mehrfach Gelegenheit bietet, die eigenthümliche Bildung des sog. Pisolithtuffes zu beobachten. Derselbe ist eine weit verbreitete Erscheinung. In manchen bimssteinarmen Lagen stecken nämlich zahlreiche erbsen-, seltener bohnengrosse, concentrisch schalige, aus dem feinen Aschenmaterial bestehende Kugeln. Die einfachste Deutung derselben ist die als Concretionsbildungen in dem feucht niedergefallenen Tuffe, in dem durch leichte Zersetzung eine Verkittung eintrat. […]","sp":67,"u1":["Litosoma di astroni","ATN","Holozän","Napoli","Pyroklastite, Holozän","#f09660"],"u2":["Prodotti piroclastici dell'astroni","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":21,"k":3,"r":"Lago d’Agnano – Astroni – Fossa Lupara – Cigliano","s":67,"t":"V","b":"Wall des Agnano-Kraters aus Tuff, Bims und Gelbtuff mit Trachytblöcken; ebener Boden 2 × 1,5 km, See 1870 durch einen Stollen nach Bagnoli entwässert","n":"Conca di Agnano (Ippodromo, Terme di Agnano)","z":"Ehemaliger Seeboden mit Pferderennbahn und Thermen","zg":"frei","sg":"Parco Regionale dei Campi Flegrei","g":"Einbruchskessel der Agnano-Monte-Spina-Eruption (ca. 4 500 Jahre), größter Ausbruch der jüngsten Phase","l":"genau","la":40.8335,"lo":14.1705,"c":"Napoli (NA)","ex":"[…] Da sie übrigens auch in feiner Vesuvasche vorkommen, dürfte es sich um eine Eigenthümlichkeit des vulkanischen Staubes handeln, von dem Johnston-Lavis annahm, dass er sich um Regentropfen oder Wasserblischen zusammenballe und dadurch die kuglige Structur empfange. Weiterhin passirt man in einem Einschnitte den Wall des Agnano-Kraters, der sich aus Tuffund Bimssteinlagen, sowie aus gelbem Tuff mit vielen Trachytblöcken zusammensetzt. Der Krater- B* boden ist ein ebenes, von niedrigen Wällen umrahmtes Becken mit 2 km N.—S.- und 1!/, km O.—W.-Erstreckung. Im Westen ist der jüngere Astroni-Vulkan auf den Rand aufgesetzt und in den Kraterboden vorgeschoben. […]","sp":67,"u1":["Depositi lacustri e palustri","e","Holozän","Napoli","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"],"u2":["Sabbie e limi di colmata","Holozän","Anthropogene Aufschüttung","#b2aaa0"]},{"id":22,"k":3,"r":"Lago d’Agnano – Astroni – Fossa Lupara – Cigliano","s":68,"t":"F","b":"Warme Dämpfe der Stufe di S. Germano (65–90 °C) am Eingang des Kraters","n":"Stufe di San Germano, Terme di Agnano","z":"Teil der Thermenanlage von Agnano","zg":"eingeschränkt","sg":"Parco Regionale dei Campi Flegrei","g":"Fumarolen am Rand der Agnano-Senke","l":"geschätzt","la":40.827,"lo":14.1708,"c":"Napoli (NA)","ex":"[…] Solange Wasser den Boden bedeckte, sah man durch dasselbe an mehreren Stellen Gase aufsteigen, die gelegentlich sogar zu kleinen Sprudeln wurden. Dass in der Umgebung solche Gase entweichen, zeigen die warmen Dämpfe (65 — 90 °C.) der Stufe di S. Germano am Eingange des Kraters, deren Besuch nicht lohnt, und die Kohlensäurequellen der berühmten Hundsgrotte (grotta del cane). In dieser kellerartigen Anlage strömt aus der Tiefe warme (20— 29°C.) Kohlensäure, die sich langsam über die Thürschwelle ins Freie ergiesst. […]","sp":68,"u1":["Coltre eluvio-colluviale","b2","Holozän","Napoli","Hangschutt, Rutschmassen","#ecdeba"],"u2":["Alterazione fumarolica dei prodotti della solfatara","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":23,"k":3,"r":"Lago d’Agnano – Astroni – Fossa Lupara – Cigliano","s":68,"t":"F","b":"Hundsgrotte (Grotta del Cane): warme Kohlensäure fließt über die Schwelle; dazu die Grotta dell'Ammoniaco mit 32 °C","n":"Grotta del Cane, Agnano","z":"Seit Jahrzehnten geschlossen, nur gelegentlich bei Sonderführungen geöffnet","zg":"geschlossen","sg":"Parco Regionale dei Campi Flegrei","g":"Mofette: CO₂-Austritt aus dem Hydrothermalsystem der Campi Flegrei","l":"geschätzt","la":40.8277,"lo":14.1696,"c":"Napoli (NA)","ex":"[…] Solange Wasser den Boden bedeckte, sah man durch dasselbe an mehreren Stellen Gase aufsteigen, die gelegentlich sogar zu kleinen Sprudeln wurden. Dass in der Umgebung solche Gase entweichen, zeigen die warmen Dämpfe (65 — 90 °C.) der Stufe di S. Germano am Eingange des Kraters, deren Besuch nicht lohnt, und die Kohlensäurequellen der berühmten Hundsgrotte (grotta del cane). In dieser kellerartigen Anlage strömt aus der Tiefe warme (20— 29°C.) Kohlensäure, die sich langsam über die Thürschwelle ins Freie ergiesst. […]","sp":68,"u1":["Depositi lacustri e palustri","e","Holozän","Napoli","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"],"u2":["Alterazione fumarolica dei prodotti della solfatara","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":24,"k":3,"r":"Lago d’Agnano – Astroni – Fossa Lupara – Cigliano","s":69,"t":"V","b":"Monte Spina an der Westseite: pipernoartige Trachytlava, ringsum Auswürflinge (Sanidinite u. a.)","n":"Monte Spina, Agnano","z":"Bewaldeter Hang, Lage geschätzt","zg":"unklar","sg":"Parco Regionale dei Campi Flegrei","g":"Namengebend für die Agnano-Monte-Spina-Eruption (ca. 4 500 Jahre)","l":"geschätzt","la":40.8318,"lo":14.16,"c":"Napoli (NA)","ex":"[…] In der Nähe existirt noch eine zweite Grotte (dell’ Ammoniaco) mit 32° warmer Mofette. An der Westseite, */, km vom Eingang, erhebt sich der Monte Spina, wahrscheinlich ein Erguss des Agnano-Vulkanes. Es ist eine pipernoartige Trachytlava, schlackig, sodalithreich, mit Biotit und kleinen Quarzkrystallen in den Hohlräumen. Rings um den Monte Spina stecken im Tuffe und liegen lose auf dem Boden verstreut allerlei Silikatblöcke (Sanidinite, Magnetit-, Augit- Gesteine etc.), die Auswürflinge des Agnano-Kraters sind. . Der Weg längs des Walles führt schliesslich langsam ansteigend zu den Astroni (vgl. Fig. 4). […]","sp":69,"u1":["Coltre eluvio-colluviale","b2","Holozän","Napoli","Hangschutt, Rutschmassen","#ecdeba"],"u2":["Alterazione fumarolica dei prodotti della solfatara","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":25,"k":3,"r":"Lago d’Agnano – Astroni – Fossa Lupara – Cigliano","s":69,"t":"V","b":"Astroni: prachtvoll erhaltener Explosionskrater (2 × 1,5 km, 281 m), Trachytpfropfen und Teich am Boden; königliches Wildgehege, nur mit Einlasskarte","n":"Cratere degli Astroni","z":"Naturschutzgebiet mit Wald und Kraterseen; Führungen und Öffnungstage","zg":"eingeschränkt","sg":"Riserva Naturale Statale Cratere degli Astroni (WWF-Oase)","g":"Tuffring der Astroni-Eruptionen (ca. 4 200 Jahre) mit Lavadomen am Kraterboden","l":"genau","la":40.8398,"lo":14.1588,"c":"Napoli (NA)","ex":"[…] Rings um den Monte Spina stecken im Tuffe und liegen lose auf dem Boden verstreut allerlei Silikatblöcke (Sanidinite, Magnetit-, Augit- Gesteine etc.), die Auswürflinge des Agnano-Kraters sind. . Der Weg längs des Walles führt schliesslich langsam ansteigend zu den Astroni (vgl. Fig. 4). […]","sp":69,"u1":["Litosoma di astroni","ATN","Holozän","Napoli","Pyroklastite, Holozän","#f09660"],"u2":["Prodotti piroclastici dell'astroni","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":26,"k":3,"r":"Lago d’Agnano – Astroni – Fossa Lupara – Cigliano","s":70,"t":"V","b":"Fossa Lupara: niedriger, bewaldeter Doppelkrater an der großen Straßenkehre, mit Spalte und Trachytgang; Schlacken durch Fumarolen zersetzt","n":"Fossa Lupara, Pozzuoli","z":"Kleiner Krater, Lage geschätzt","zg":"unklar","sg":"Parco Regionale dei Campi Flegrei","g":"Kleiner Krater der jüngsten Ausbruchsphase (ca. 4 000 Jahre)","l":"geschätzt","la":40.844,"lo":14.1385,"c":"Pozzuoli (NA)","ex":"[…] Von den Astroni wende man sich direct am Thore nordwärts und erreicht nach 1!/ km die Hauptstrasse. Folgt man derselben westwärts, so stösst man bei dem grossen Strassenknick auf einen ziemlich complicirten, aber niedrigen Krater, die Fossa Lupara (Fig. 6). Mehrere Wege führen in dies bewaldete System von Ausbruchspunkten, das durch arena ARE SR vr iS SÒ x N IN N ED Ni RE RORK","sp":70,"u1":["Litosoma di astroni","ATN","Holozän","Napoli","Pyroklastite, Holozän","#f09660"],"u2":["Prodotti piroclastici dell'astroni","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":27,"k":3,"r":"Lago d’Agnano – Astroni – Fossa Lupara – Cigliano","s":72,"t":"V","b":"Die Hauptstraße läuft am Fuß des Monte Viticella entlang","n":"Monte Viticella, Pozzuoli","z":"Lage geschätzt","zg":"unklar","sg":"Parco Regionale dei Campi Flegrei","g":"Tuffhügel am Nordrand der Caldera","l":"geschätzt","la":40.8485,"lo":14.129,"c":"Pozzuoli (NA)","ex":"[…] An vielen Stellen erweisen sie sich als zersetzt, gebräunt oder röthlich gefärbt, was auf Fumarolenwirkung zurückgeht. Die Hauptstrasse führt am Fusse des Monte Viticella entlang bis zur Vereinigung mit der von Pozzuoli kommenden campanischen Chaussee. Beide treffen sich am Fusse eines halbkreisförmigen, steil gegen Süden, langsamer gegen Norden abgedachten Hügels, der Montagna Spaccata, welchen die campanische Strasse durchschneidet. Der Hohlweg dürfte eine römische Anlage sein, worauf die Mauerreste in Retikulatwerk hinweisen. Der Hügelkranz ist ein zerstörter Krater, von dessen Eruptionen die Schlackenlagen am unteren Drittel der Wand herrühren. […]","sp":72,"u1":["Litosoma di astroni","ATN","Holozän","Napoli","Pyroklastite, Holozän","#f09660"],"u2":["Prodotti piroclastici del sistema craterico di cigliano","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":28,"k":3,"r":"Lago d’Agnano – Astroni – Fossa Lupara – Cigliano","s":72,"t":"H","b":"Montagna Spaccata: halbkreisförmiger, zerstörter Krater; die römische Straße durchschneidet ihn im Hohlweg mit Netzmauerwerk; Schlacken werden als Schotter abgebaut","n":"Montagna Spaccata (Via Montagna Spaccata)","z":"Antiker Straßeneinschnitt der Via Campana, heute Autostraße","zg":"frei","sg":"Parco Regionale dei Campi Flegrei","g":"Tuffkegel aus der ersten Phase nach dem Gelbtuff (ca. 12 000 Jahre)","l":"genau","la":40.854,"lo":14.1205,"c":"Pozzuoli (NA)","ex":"[…] Die Hauptstrasse führt am Fusse des Monte Viticella entlang bis zur Vereinigung mit der von Pozzuoli kommenden campanischen Chaussee. Beide treffen sich am Fusse eines halbkreisförmigen, steil gegen Süden, langsamer gegen Norden abgedachten Hügels, der Montagna Spaccata, welchen die campanische Strasse durchschneidet. Der Hohlweg dürfte eine römische Anlage sein, worauf die Mauerreste in Retikulatwerk hinweisen. Der Hügelkranz ist ein zerstörter Krater, von dessen Eruptionen die Schlackenlagen am unteren Drittel der Wand herrühren. Die Basis ist gelber Tuff, der sich in rothgebrannten Blöcken auch in der Schlackenschicht findet. Diese wird als Schottermaterial ausgebeutet. […]","sp":72,"u1":["Coltre eluvio-colluviale","b2","Holozän","Napoli","Hangschutt, Rutschmassen","#ecdeba"],"u2":["Prodotti piroclastici indifferenziati","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":29,"k":3,"r":"Lago d’Agnano – Astroni – Fossa Lupara – Cigliano","s":73,"t":"V","b":"Piano di Quarto: weite Ebene 5 × 3,5 km, Riesenkrater oder vom Meer eingeebnetes Einsturzbecken","n":"Ebene von Quarto","z":"Stadt Quarto und Landwirtschaft","zg":"frei","sg":"–","g":"Senke am Nordrand der Caldera des Kampanischen Ignimbrits","l":"genau","la":40.8785,"lo":14.14,"c":"Quarto (NA)","ex":"[…] Diese wird als Schottermaterial ausgebeutet. Nördlich der Montagna Spaccata breitet sich eine weite Ebene, das Piano di Quarto, aus. Seine Maasse sind 5 km in der 0O.—W.- und 31), in der N.—S.-Richtung. Ob es ein riesiger Krater oder ein durch das Meer eingeebnetes Einsturzbecken ist, bleibt eine offene Frage. Es kann auch sein, dass die Wälle um diese Ebene genetisch gar nicht ‘zu derselben gehören, sondern zu den verschiedenen südlichen, später entstandenen Vulkankegeln (Pianura, Montagna Spaccata und mehreren undeutlichen Eruptionsstellen zwischen dem Piano und Cumae). […]","sp":73,"u1":["Subsintema di contrada romana","VEF12","Holozän","Napoli","Quartäre Abfolge (Sintem, gemischte Ablagerungen)","#e2c496"],"u2":["Escavato di canali per bonifica","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":30,"k":3,"r":"Lago d’Agnano – Astroni – Fossa Lupara – Cigliano","s":73,"t":"V","b":"Campiglione mit Monte Gauro (Corvaro, 329 m) und Monte Barbaro (319 m): prachtvoller Explosionstrichter aus Gelbtuff mit Bims, Boden als Acker","n":"Monte Gauro / Monte Barbaro, Krater Campiglione","z":"Kraterboden landwirtschaftlich genutzt","zg":"frei","sg":"Parco Regionale dei Campi Flegrei","g":"Großer Tuffkegel aus der ersten Phase nach dem Gelbtuff (ca. 12 000 Jahre)","l":"genau","la":40.8508,"lo":14.106,"c":"Pozzuoli (NA)","ex":"[…] Es kann auch sein, dass die Wälle um diese Ebene genetisch gar nicht ‘zu derselben gehören, sondern zu den verschiedenen südlichen, später entstandenen Vulkankegeln (Pianura, Montagna Spaccata und mehreren undeutlichen Eruptionsstellen zwischen dem Piano und Cumae). Die campanische Strasse läuft beinahe direct südlich über den ebenen, alten Meeresboden, der die beiden Krater des Campiglione und Cigliano trägt. Der Campiglione mit seinen Rändern Monte Gauro (329 m) oder Corvaro und Monte Barbaro (319 m) ist ein prachtvoller 1!/, qkm messender Explosionstrichter, dessen Wandungen aus festem, gelbem Tuff mit weissen Bimssteinen aufgebaut sind. […]","sp":73,"u1":["Coltre eluvio-colluviale","b2","Holozän","Napoli","Hangschutt, Rutschmassen","#ecdeba"],"u2":["Escavato di canali per bonifica","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":31,"k":3,"r":"Lago d’Agnano – Astroni – Fossa Lupara – Cigliano","s":74,"t":"V","b":"Cigliano: spitzer, kleiner Krater mit hoch gelegenem Boden","n":"Krater Cigliano, Pozzuoli","z":"Lage geschätzt","zg":"unklar","sg":"Parco Regionale dei Campi Flegrei","g":"Kleiner Tuffkegel der Campi Flegrei","l":"geschätzt","la":40.841,"lo":14.1185,"c":"Pozzuoli (NA)","ex":"weise steht er auf einem älteren Ausbruchskegel; ausserdem sind die SW.- und S.-Seite stark von dem Meere benagt. Auch der Cigliano lohnt den Besuch nicht. Spitzer und erheblich kleiner besitzt er einen hochgelegenen, kaum 1/,, qkm grossen elliptischen Kraterboden. An seinem Fusse führt die alte römische Via Cumana entlang, deren Ränder von antiken Gräberruinen eingefasst sind. Bei Pozzuoli bricht die 60 m hohe Terrasse steil zur See ab, und von dem Platze vor dem Hospital geniesst man einen herrlichen Blick auf den Golf von Pozzuoli und seine vorgelagerten Inseln. […]","sp":74,"u1":["Litosoma di astroni","ATN","Holozän","Napoli","Pyroklastite, Holozän","#f09660"],"u2":["Prodotti piroclastici indifferenziati","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":32,"k":3,"r":"Lago d’Agnano – Astroni – Fossa Lupara – Cigliano","s":74,"t":"S","b":"Römische Via Campana mit Gräberruinen; bei Pozzuoli bricht die 60-m-Terrasse ab, Blick vom Platz vor dem Hospital","n":"Terrasse La Starza mit der Nekropole der Via Campana","z":"Teils ausgegrabene römische Gräberstraße","zg":"eingeschränkt","sg":"Parco Archeologico dei Campi Flegrei","g":"Marine Terrasse La Starza: vor etwa 5 000 Jahren durch Hebung (Bradyseismos) trockengefallen","l":"geschätzt","la":40.8335,"lo":14.115,"c":"Pozzuoli (NA)","ex":"[…] Spitzer und erheblich kleiner besitzt er einen hochgelegenen, kaum 1/,, qkm grossen elliptischen Kraterboden. An seinem Fusse führt die alte römische Via Cumana entlang, deren Ränder von antiken Gräberruinen eingefasst sind. Bei Pozzuoli bricht die 60 m hohe Terrasse steil zur See ab, und von dem Platze vor dem Hospital geniesst man einen herrlichen Blick auf den Golf von Pozzuoli und seine vorgelagerten Inseln. Solfatara, Monte Nuovo, Bajae, Cumae, Lago d’Averno, Die Strasse von Bagnoli nach Pozzuoli läuft hart am Meeresufer und am Fusse der Tuff- und Trachythügel entlang, welche mit einem der bekanntesten Krater der Campi Flegrei, mit der Solfatara, in Beziehung stehen. […]","sp":74,"u1":["Litosoma di monte nuovo","MVU","Holozän","Napoli","Pyroklastite, Holozän","#f09660"],"u2":["Scorie stratificate di varia provenienza","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":33,"k":3,"r":"Solfatara – Monte Nuovo – Bajae – Cumae – Lago d’Averno","s":74,"t":"F","b":"Thermen am Ufer zwischen Bagnoli und Pozzuoli (Bagni Patamia, della Pietra, Subveni Homini, Pisanica), schon von den Römern genutzt","n":"Küste Bagnoli–Pozzuoli (via Napoli)","z":"Die alten Bäder sind größtenteils verschwunden; dahinter das Industriebrachland von Bagnoli","zg":"frei","sg":"–","g":"Thermalwässer des Solfatara-Hydrothermalsystems","l":"geschätzt","la":40.8155,"lo":14.152,"c":"Pozzuoli (NA)","ex":"[…] Der Uferstreifen ist so schmal, dass die Ferrovia Cumana sich mittels Tunneln ihren Weg bahnt. Die Namen Bagnoli und Pozzuoli (Puteoli im Alterthum) deuten auf die vielen warmen Quellen hin, die am Fusse der Solfatara zu Tage treten. Es sind Thermen von gemässigter Temperatur mit einem stetigen Gehalt an schweflig- und schwefelsauren Salzen und Schwefelws % wasserstoff. Man hat auch beim Tunnelbau Dampfquellen und warme Wasser angetroffen. Längs","sp":74},{"id":34,"k":3,"r":"Solfatara – Monte Nuovo – Bajae – Cumae – Lago d’Averno","s":76,"t":"A","b":"Monte Dolce: ältester Teil der Küste, Rest eines Tuffkegels; darüber marine Sande, Schlacken und Trachyt des Monte Olibano (Profil nach Guiscardi)","n":"Küstenprofil unter dem Monte Olibano","z":"Lage geschätzt","zg":"unklar","sg":"Parco Regionale dei Campi Flegrei","g":"Älterer Tuffkegel, überlagert vom Lavadom des Monte Olibano","l":"geschätzt","la":40.8185,"lo":14.15,"c":"Pozzuoli (NA)","ex":"[…] Oft erkennt man an benachbarten Ruinen, dass diese Quellen schon den Römern zu gleichem Zwecke dienten. Sobald die Strasse den flachen Sandstrand verlässt, gelangt sie an den Fuss des Mte. Dolce (Fig. 8). Dieser ist nach den Untersuchungen Guiscardi’s der älteste Theil der Küste und gehört zu einem fast verschwundenen alten Tuffkegel. Derselbe sprang in die See vor und wurde von den Wellen benagt; dann, wie das beigegebene Profil zeigt (Fig. 12), wurden gerollte Tuffblöcke des Monte Dolce überdeckt von einer Schicht marinen Sandes und bilden gegen Osten die Basis des Monte Olibano. […]","sp":76,"u1":["Deposito di versante","a","Holozän","Napoli","Hangschutt, Rutschmassen","#ecdeba"],"u2":["Tufo","Holozän","Neapolitanischer Gelbtuff (15 000 J.)","#e8c448"]},{"id":35,"k":3,"r":"Solfatara – Monte Nuovo – Bajae – Cumae – Lago d’Averno","s":76,"t":"A","b":"Monte Olibano: säulig abgesonderter Trachyt, der als Zunge ins Meer floss; in großen Brüchen von Sträflingen abgebaut","n":"Monte Olibano (Accademia Aeronautica), Pozzuoli","z":"Alte Brüche; auf dem Berg die Luftwaffenakademie, nicht zugänglich","zg":"geschlossen","sg":"Militärgelände","g":"Trachytischer Lavadom der jüngsten Phase (ca. 4 000 Jahre)","l":"genau","la":40.822,"lo":14.144,"c":"Pozzuoli (NA)","ex":"[…] Dieser ist nach den Untersuchungen Guiscardi’s der älteste Theil der Küste und gehört zu einem fast verschwundenen alten Tuffkegel. Derselbe sprang in die See vor und wurde von den Wellen benagt; dann, wie das beigegebene Profil zeigt (Fig. 12), wurden gerollte Tuffblöcke des Monte Dolce überdeckt von einer Schicht marinen Sandes und bilden gegen Osten die Basis des Monte Olibano. Ueber dem Sande folgen Schichten trachytischer Schlacken, allerlei Auswürflinge, und schliesslich mächtiger, säulenförmig abgesonderter Trachyt. […]","sp":76,"u1":["Piroclastiti di agnano-monte spina","GNP","Holozän","Napoli","Pyroklastite, Holozän","#f09660"],"u2":["Tufo","Holozän","Neapolitanischer Gelbtuff (15 000 J.)","#e8c448"]},{"id":36,"k":3,"r":"Solfatara – Monte Nuovo – Bajae – Cumae – Lago d’Averno","s":78,"t":"F","b":"Solfatara (Forum Vulcani): geschlossener Krater, Bocca grande mit 70–80 °C heißen Fumarolen, Schwefel, Realgar, Alaune; Trachytgang, weiß zersetzter Tuff; Experiment mit dem fallenden Stein","n":"Cratere della Solfatara","z":"Seit dem tödlichen Unfall vom 12. September 2017 für Besucher geschlossen; ein Termin für die Wiedereröffnung steht nicht fest (Stand Herbst 2026)","zg":"geschlossen","sg":"Parco Regionale dei Campi Flegrei","g":"Maar-Tuffring (ca. 4 200 Jahre) über dem aktiven Hydrothermalsystem; Fumarolen heute bis über 160 °C (Bocca Grande)","l":"genau","la":40.827,"lo":14.1393,"c":"Pozzuoli (NA)","ex":"[…] Rosenbusch rechnet ihn zum Ponzatypus seiner Trachytfamilie; Zirkel giebt zwischen den Feldspathleisten der Grundmasse bräunlich globulitisches Glas und auf den Klüften Sodalith, Augit und braune Hornblende an, die Breislackitform zeigt. Von Pozzuoli, das auf einem Tufffelsen steht, gelangt man nach der Solfatara hinauf (Fig. 7 u. 9). Sie ist ein geschlossener Krater mit ebenem Boden, an dessen Wänden an vielen Stellen heisse, schwefelhaltige Wasserdämpfe entweichen. Deshalb hiess dieser eingeschlossene ebene Raum bei den Römern Forum Vulcani. Die Form nähert sich einem Kreise mit 250 m Radius. […]","sp":78,"u1":["Coltre eluvio-colluviale","b2","Holozän","Napoli","Hangschutt, Rutschmassen","#ecdeba"],"u2":["Alterazione fumarolica dei prodotti della solfatara","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":37,"k":3,"r":"Solfatara – Monte Nuovo – Bajae – Cumae – Lago d’Averno","s":82,"t":"F","b":"Colli Leucogei: weiße, zersetzte Hänge östlich der Solfatara mit Dampfquellen; Thermen der Acqua Pisciarelli","n":"Pisciarelli, Agnano/Pozzuoli","z":"Stark aktive Fumarolen und Schlammtöpfe; Fumarolenfeld mit wachsender Gasabgabe, abgesperrt","zg":"geschlossen","sg":"Parco Regionale dei Campi Flegrei","g":"Hydrothermale Alteration (Argillisierung) am Ostrand der Solfatara; Gas- und Wärmefluss seit 2005 stark gestiegen","l":"genau","la":40.8295,"lo":14.147,"c":"Pozzuoli (NA)","ex":"diese Gehänge den Namen der Colli Leucogei, der weissen Hügel, tragen; denn wie im Krater selbst tritt das erdige helle Gestein zu Tage, weil an den Stellen der Fumarolen Pflanzenwuchs nicht gedeiht. Mineralwasser und kleinere Dampfquellen, die besonders bei Winterkälte sichtbar sind, lassen sich in den Colli Leucogei überall constatiren. Die Thermen dienen zu höchst primitiven Bädern (Acqua Pisciarelli). Auch in der Solfatara sind Bäder vorhanden, seitdem die früher betriebene Gewinnung von Schwefel und Alaun aufgehört hat. […]","sp":82,"u1":["Litosoma di astroni","ATN","Holozän","Napoli","Pyroklastite, Holozän","#f09660"],"u2":["Prodotti piroclastici dell'astroni","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":38,"k":3,"r":"Solfatara – Monte Nuovo – Bajae – Cumae – Lago d’Averno","s":82,"t":"H","b":"Sog. Serapistempel: römischer Bau mit drei aufrechten Säulen, von Bohrmuscheln (Lithodomus) bis 5,70 m über dem Meer angebohrt; Beleg für Senkung und Hebung","n":"Macellum (Serapeo) di Pozzuoli","z":"Ausgrabung mitten in der Stadt, von außen gut einsehbar; durch die Hebung seit 2005 ist der Boden wieder trocken","zg":"eingeschränkt","sg":"Parco Archeologico dei Campi Flegrei","g":"Klassischer Pegel des Bradyseismos: Absenkung seit der Römerzeit, Hebungsphasen 1969–72, 1982–84 und seit 2005. Stand August 2026: Hebung rund 1 cm pro Monat, am Rione Terra etwa 30 cm allein seit Januar 2025; stärkstes Beben der Krise Md 4,7 am 31. Juli 2026; Warnstufe Gelb","l":"genau","la":40.8257,"lo":14.1207,"c":"Pozzuoli (NA)","ex":"[…] Schlägt derselbe auf den Boden, klingt es dumpf, nicht aber, weil der Boden hohl, sondern weil der Tuff so erdig und locker ist. Nach dem Abstieg von der Solfatara besuche man den sog. Serapistempel (Fig. 10). Derselbe ist seit dem vorigen Jahrhundert Gegenstand der verschiedensten Speculationen und fiir die Geologie von der grössten Wichtigkeit gewesen. Es handelt sich um ein römisches Gebäude, das für einen Tempel er- klärt wurde, weil Säulen aus Cipollin und eine Büste des Serapis dort gefunden sind. Andere Archäologen haben es als Macellum (Markthalle oder Schlachthaus) angesehen. […]","sp":82,"u1":["Coltre eluvio-colluviale","b2","Holozän","Napoli","Hangschutt, Rutschmassen","#ecdeba"],"u2":["Sabbie e limi di colmata","Holozän","Anthropogene Aufschüttung","#b2aaa0"]},{"id":39,"k":3,"r":"Solfatara – Monte Nuovo – Bajae – Cumae – Lago d’Averno","s":88,"t":"A","b":"Steilrand der Starza mit den Ruinen der Villa di Cicerone; am Fuß fossilreiche marine Bimssteintuffe, inzwischen vom Bahndamm verdeckt; Säulen im Meer vor dem Cantiere Armstrong","n":"Steilrand La Starza an der Via Domitiana, Pozzuoli","z":"Kliff hinter Bahn und Straße; Gelände der früheren Werft heute Gewerbe- und Hafenfläche","zg":"frei","sg":"Parco Regionale dei Campi Flegrei","g":"Gehobene marine Ablagerungen der Terrasse La Starza (Hebung der Caldera-Mitte)","l":"geschätzt","la":40.8288,"lo":14.106,"c":"Pozzuoli (NA)","ex":"[…] Dagegen spricht der Befund bei den Ausgrabungsarbeiten, die Stellung der Säulen und die auf dem Schutte liegenden, halb in denselben eingegrabenen und daher nur halb angebohrten Trommeln!) (Fig. 11). Fährt man am Weststrande von Pozzuoli entlang, so hat man rechts den Steilrand der „Starza“ mit den Ruinen der sog. Villa di Cicerone. Am Fusse derselben standen vor einigen Jahren mächtige, sehr fossilreiche marine Bimssteintuffe an, die jetzt durch den Bahndamm theilweise maskirt sind; links salı man vor dem Bau des Cantiere Armstrong zahlreiche Säulenstümpfe und Substructionen aus dem Meere aufragen. […]","sp":88},{"id":40,"k":3,"r":"Solfatara – Monte Nuovo – Bajae – Cumae – Lago d’Averno","s":88,"t":"H","b":"Alter Hafendamm von Pozzuoli (Ponte di Caligola) mit Verschiebungsmarken","n":"Molo Caligoliano (Hafenmole), Pozzuoli","z":"Römische Pfeiler im heutigen Hafendamm verbaut","zg":"frei","sg":"–","g":"Bradyseismos: Pfeiler mit Bohrmuschel-Spuren","l":"geschätzt","la":40.82,"lo":14.119,"c":"Pozzuoli (NA)","ex":"[…] Am Fusse derselben standen vor einigen Jahren mächtige, sehr fossilreiche marine Bimssteintuffe an, die jetzt durch den Bahndamm theilweise maskirt sind; links salı man vor dem Bau des Cantiere Armstrong zahlreiche Säulenstümpfe und Substructionen aus dem Meere aufragen. Auch an dem alten Hafendamm von Pozzuoli, dem in grossen Bruchstücken in den Golf vorspringenden Ponte di Caligola, sollen deutliche Verschiebungsmarken sichtbar sein. […]","sp":88},{"id":41,"k":3,"r":"Solfatara – Monte Nuovo – Bajae – Cumae – Lago d’Averno","s":88,"t":"V","b":"Monte Nuovo, 1538 unter Erdbeben aufgeschüttet, 140 m hoch; Krater bis fast auf Meeresniveau, aus losen Schlacken und älterem Tuff","n":"Monte Nuovo","z":"Bewaldeter Kegel; Kraterpfad offen","zg":"frei","sg":"Oasi Naturalistica Monte Nuovo","g":"Jüngster Ausbruch der Campi Flegrei (29. Sept.–6. Okt. 1538), Trachyt-Phonolith","l":"genau","la":40.8358,"lo":14.0878,"c":"Pozzuoli (NA)","ex":"[…] Auch an dem alten Hafendamm von Pozzuoli, dem in grossen Bruchstücken in den Golf vorspringenden Ponte di Caligola, sollen deutliche Verschiebungsmarken sichtbar sein. Man nähert sich dem jüngsten Krater der Campi Flegrei, dem 1538 unter Erdbeben und heftigen Explosionen aufgethürmten Monte Nuovo. 1) Wer sich für diese geologisch interessante Frage des Serapeums interessirt, findet in Suess, Das Antlitz der Erde, Bd. 2, Abschnitt 9, und in dem Aufsatz von Brauns die wichtigste Litteratur auszugsweise wiedergegeben. Bemerkt sei noch, dass auch Goethe sich mit diesem Problem beschäftigte. […]","sp":88,"u1":["Coltre eluvio-colluviale","b2","Holozän","Napoli","Hangschutt, Rutschmassen","#ecdeba"],"u2":["Prodotti di dilavamento","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":42,"k":3,"r":"Solfatara – Monte Nuovo – Bajae – Cumae – Lago d’Averno","s":90,"t":"K","b":"Lago Lucrino: dürftiger Rest einer größeren Bucht (Lacus Lucrinus), deren Damm (Via Herculea) unter den Meeresspiegel sank","n":"Lago Lucrino","z":"Kleine Strandlagune zwischen Monte Nuovo und Baia","zg":"frei","sg":"Parco Regionale dei Campi Flegrei","g":"Lagune, 1538 durch den Monte Nuovo verkleinert; römischer Portus Iulius heute unter Wasser","l":"genau","la":40.8285,"lo":14.0815,"c":"Pozzuoli (NA)","ex":"[…] Von der Trockenlegung des Strandes bei Pozzuoli war schon die Rede. Aus dem Bericht del Nero’s geht aber hervor, dass am Südfusse des Mte. Nuovo Meerestheile zugeschüttet sind, so dass die jetzt dort befindliche, Lago Lucrino genannte Lagune nur der dürftige Rest einer grösseren Meeresbucht ist. Diese muss dem zur Zeit des Augustus als Seehafen eine Rolle spielenden Lacus Lucrinus entprochen haben und durch die allgemeine Senkung der Küste, welche den alten Hafendamm, die Via Herculea, unter den Seespiegel brachte, aus dem Strandsee hervorgegangen sein. […]","sp":90,"u1":["Area non rilevabile","","","Napoli","Nicht kartierbar (bebaut)","#d6d6d2"],"u2":["Spiagge sabbiose e duna litoranea recente","Holozän","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"]},{"id":43,"k":3,"r":"Solfatara – Monte Nuovo – Bajae – Cumae – Lago d’Averno","s":90,"t":"F","b":"Stufe di Nerone: heiße Dämpfe und Wasser, Schwitzbäder; im Tunnel der Cumana 80–93 °C","n":"Terme Stufe di Nerone, Bacoli","z":"Thermalbad in Betrieb","zg":"frei","sg":"Parco Regionale dei Campi Flegrei","g":"Fumarolen und Thermalwasser am Westrand des Lucrino","l":"genau","la":40.8244,"lo":14.0752,"c":"Bacoli (NA)","ex":"[…] Diese muss dem zur Zeit des Augustus als Seehafen eine Rolle spielenden Lacus Lucrinus entprochen haben und durch die allgemeine Senkung der Küste, welche den alten Hafendamm, die Via Herculea, unter den Seespiegel brachte, aus dem Strandsee hervorgegangen sein. Am Vorsprunge südwestlich vom Mte. Nuovo sind zahlreiche Trümmer vorhanden, die auf das jenseitige Ufer unterhalb der Stufe di Nerone zulaufen, so dass der antike Molo wohl diese Richtung gehabt. hat. Der gegenwärtige flache Sandstreifen ist neuerer: Entstehung, ebenso wie die dahinterliegende Lagune. […]","sp":90,"u1":["Tufi di baia e fondi di baia","TBF","Holozän","Napoli","Pyroklastite, Holozän","#f09660"],"u2":["Tufo","Holozän","Neapolitanischer Gelbtuff (15 000 J.)","#e8c448"]},{"id":44,"k":3,"r":"Solfatara – Monte Nuovo – Bajae – Cumae – Lago d’Averno","s":91,"t":"A","b":"Punta dell'Epitaffio: Gelbtuff, darüber Pozzolana, die in großem Maßstab abgebaut und verschifft wird","n":"Punta Epitaffio, Baia","z":"Abbau längst eingestellt; vor der Küste der Unterwasserpark mit Villen und Statuen","zg":"frei","sg":"Parco Archeologico Sommerso di Baia","g":"Gelbtuff unter jüngeren Pozzolanen","l":"genau","la":40.8222,"lo":14.0742,"c":"Bacoli (NA)","ex":"[…] Am. Vorgebirge Punta del l’Epitaffio stehen. gelber Tuff und über demselben Pozzolana an. Diese letztere wird in grossem Maasse gegraben, heruntergeworfen, unten nothdürftig gesiebt und mittelst Segelschiffen nach allen Theilen der Erde verladen. Beim Abbau kommen zahlreiche antike Substructionen, Leitungen und sonstige Reste zu Tage. Der Golf von Baja, dem antiken Bajae, gleicht wiederum einem Krater mit zerstörtem Ostrande. Aber ob er einem Vulkan entspricht, bleibe dahingestellt. […]","sp":91,"u1":["Litosoma di mofete","MTF","Oberpleistozän","Napoli","Pyroklastite, Holozän","#f09660"]},{"id":45,"k":3,"r":"Solfatara – Monte Nuovo – Bajae – Cumae – Lago d’Averno","s":91,"t":"H","b":"Golf von Baja wie ein Krater mit zerstörtem Ostrand; im Einschnitt über dem Diana-Tempel mächtige, nach außen fallende Bimssteinschichten","n":"Baia, Tempio di Diana","z":"Römische Thermenruinen von Baia, archäologischer Park","zg":"frei","sg":"Parco Archeologico dei Campi Flegrei","g":"Bucht von Baia: Teil der Caldera; Kraternatur weiterhin diskutiert","l":"geschätzt","la":40.816,"lo":14.077,"c":"Bacoli (NA)","ex":"[…] Aber ob er einem Vulkan entspricht, bleibe dahingestellt. Allerdings zeigen sich in dem grossen Einschnitte oberhalb des sog. Diana- Tempels mächtige Bimssteinschichten mit nach aussen gerichtetem Fallen, und beim Bau der Ferrovia Cumana haben sich in dem Tunnel geröthete Schlacken- und Tuffbänke ergeben, sowie erhöhte Temperatur (67°) und Anzeichen von warmen Quellen, die zur Römerzeit. abgeleitet und benutzt zu sein scheinen. Deshalb kann der Busen von Bajä einen Ausbruchspunkt beherbergen. Der mächtige Einschnitt, in dem die Strasse zum Fusaro-See läuft, ist jedenfalls römischen Ursprungs und erleichterte den Verkehr zwischen Bajae und Cumae. […]","sp":91},{"id":46,"k":3,"r":"Solfatara – Monte Nuovo – Bajae – Cumae – Lago d’Averno","s":92,"t":"H","b":"Mächtiger römischer Einschnitt, in dem die Straße zum Fusaro-See läuft","n":"Straßeneinschnitt Baia–Fusaro (Via Lago Fusaro)","z":"Straße in Benutzung","zg":"frei","sg":"Parco Regionale dei Campi Flegrei","g":"Tuffe der Bacoli-Halbinsel","l":"geschätzt","la":40.817,"lo":14.064,"c":"Bacoli (NA)","ex":"kann der Busen von Bajä einen Ausbruchspunkt beherbergen. Der mächtige Einschnitt, in dem die Strasse zum Fusaro-See läuft, ist jedenfalls römischen Ursprungs und erleichterte den Verkehr zwischen Bajae und Cumae. An seinem Ausgange hat man einen Blick auf den Fusaro-See und schlägt, wenn man noch weiter gehen will, am besten die Strasse nach Norden ein, welche am Fusse fruchtbarer Rebengelände direkt auf das Amphitheater von Cumae und die einst mit Villen besetzte Unterstadt zuführt. Wandert man nun vom Amphitheater bei Beginn des Hohlweges links über die Bauernhöfe durch die Felder auf Cumae zu, so fällt die vorzügliche Lage der Stadt gleich in die Augen. […]","sp":92,"u1":["Coltre eluvio-colluviale","b2","Holozän","Napoli","Hangschutt, Rutschmassen","#ecdeba"],"u2":["Prodotti piroclastici indifferenziati","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":47,"k":3,"r":"Solfatara – Monte Nuovo – Bajae – Cumae – Lago d’Averno","s":92,"t":"H","b":"Unterstadt von Cumae auf einem Tuffrücken zwischen Strand und der Senke zum Lago di Licola","n":"Unterstadt von Cuma","z":"Ausgrabungen in Feldern; der Lago di Licola ist trockengelegt","zg":"eingeschränkt","sg":"Parco Archeologico dei Campi Flegrei","g":"Tuffrücken am Westrand der Caldera","l":"geschätzt","la":40.849,"lo":14.058,"c":"Pozzuoli (NA)","ex":"[…] Der mächtige Einschnitt, in dem die Strasse zum Fusaro-See läuft, ist jedenfalls römischen Ursprungs und erleichterte den Verkehr zwischen Bajae und Cumae. An seinem Ausgange hat man einen Blick auf den Fusaro-See und schlägt, wenn man noch weiter gehen will, am besten die Strasse nach Norden ein, welche am Fusse fruchtbarer Rebengelände direkt auf das Amphitheater von Cumae und die einst mit Villen besetzte Unterstadt zuführt. Wandert man nun vom Amphitheater bei Beginn des Hohlweges links über die Bauernhöfe durch die Felder auf Cumae zu, so fällt die vorzügliche Lage der Stadt gleich in die Augen. […]","sp":92,"u1":["Facies lagunare","VEF2e3","Holozän","Napoli","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"],"u2":["Prodotti di dilavamento","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":48,"k":3,"r":"Solfatara – Monte Nuovo – Bajae – Cumae – Lago d’Averno","s":93,"t":"H","b":"Akropolis von Cumae (82 m) aus Gelbtuff, Stadtmauer aus Tuffquadern; Sibyllengrotte am Fuß; Trachyt seeseitig mit Sanidin-, Sodalith- und Olivinkristallen","n":"Akropolis von Cuma mit Antro della Sibilla","z":"Archäologischer Park, Sibyllengrotte begehbar","zg":"frei","sg":"Parco Archeologico dei Campi Flegrei","g":"Trachytischer Lavadom von Cuma (älter als der Kampanische Ignimbrit), mit Gelbtuff überdeckt","l":"genau","la":40.848,"lo":14.0536,"c":"Pozzuoli (NA)","ex":"[…] Wahrscheinlich haben nachträgliche Erhöhungen des Bodens die Topographie der alten Griechenstadt bereits etwas verwischt, die Dünen z. B. sind sicher verbreitert, und vielleicht war bei der ersten Niederlassung der Lago di Licola eine für kleine Schiffe zugängliche Bucht. Vor dem Thore der Akropolis verschmälert sich die Terrasse auf 50 bis 60 m zum Theil durch künstliche Abgrabungen. Im Akropolis- felsen (82 m) tritt der gelbe Tuff zu Tage und hat für die Stadtmauern, von denen an der NO.-Seite riesige Quadern in der ursprünglichen Lage aufeinander ruhen, das Material geliefert. Der Boden der Burg ist ein Schuttboden des Bimssteintuffes. […]","sp":92,"u1":["Facies lagunare","VEF2e3","Holozän","Napoli","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"],"u2":["Tufo","Holozän","Neapolitanischer Gelbtuff (15 000 J.)","#e8c448"]},{"id":49,"k":3,"r":"Solfatara – Monte Nuovo – Bajae – Cumae – Lago d’Averno","s":93,"t":"V","b":"Monte Grillo: älterer, elliptischer Krater, dessen Südseite der jüngere Averner See einnimmt","n":"Monte Grillo","z":"Bewaldet, Lage ungefähr","zg":"frei","sg":"Parco Regionale dei Campi Flegrei","g":"Tuffkegel der Campi Flegrei","l":"geschätzt","la":40.842,"lo":14.0695,"c":"Pozzuoli (NA)","ex":"[…] Auf den Klüften sitzen Sanidin-, Sodalith-, Augit- und Olivinkrystalle, welche letztere schwarz oder metallisch glinzend aussehen. Vom Amphitheater kehrt man nach Pozzuoli über den Mte. Grillo und Averner See zurück. Der Mte. Grillo ist ein elliptischer, dadurch unvollständiger älterer Krater, weil an seiner Südseite der jüngere Averner See eingefügt ist. Der Ringwall ist relativ niedrig, der Kraterboden hoch (80 m), seine Längsachse (NO.—-SW.) 13/, km, seine Breite (NW.—SO.) nur etwa 3/ km. Von Cumae führt unterirdisch ein antiker Verbindungsweg ähnlich der Grotta di Posillipo unter dem Mte. Grillo direkt auf den Averner See zu. […]","sp":93,"u1":["Litosoma di averno","AER","Holozän","Napoli","Pyroklastite, Holozän","#f09660"],"u2":["Prodotti piroclastici superiori","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":50,"k":3,"r":"Solfatara – Monte Nuovo – Bajae – Cumae – Lago d’Averno","s":94,"t":"H","b":"Arco Felice: Bogenbau im Hohlweg durch den Ringwall, darunter antikes Pflaster; dazu der unterirdische Gang von Cumae zum Averner See","n":"Arco Felice an der Via Domitiana","z":"Römischer Bogen erhalten; die Grotta di Cocceio ist seit Kriegsschäden 1943 gesperrt","zg":"frei","sg":"Parco Archeologico dei Campi Flegrei","g":"Einschnitt im Tuff des Monte Grillo","l":"genau","la":40.8446,"lo":14.067,"c":"Bacoli (NA)","ex":"[…] Von Cumae führt unterirdisch ein antiker Verbindungsweg ähnlich der Grotta di Posillipo unter dem Mte. Grillo direkt auf den Averner See zu. Die Strasse durchschneidet den Ringwall unter dem sog. Arco Felice, einem als Aquäduct gedeuteten, malerischen Bogenbau in einem mächtigen Hohlwege, auf dessen Fuss das alte Pflaster sichtbar wird. Ohne dass man einen ausgesprochenen Rand des Kraterwalls passirte, gelangt man an den tiefeingesenkten Lago d’Averno. Dieser ist ein typischer Explosionskrater und ein Maar, welches ringsum steile Wände und nur im Osten einen niedrigen, etwas schärfer abgesetzten Wall besitzt, welcher sich unter dem Mte. Nuovo verliert. […]","sp":94,"u1":["Litosoma di averno","AER","Holozän","Napoli","Pyroklastite, Holozän","#f09660"],"u2":["Prodotti piroclastici superiori","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":51,"k":3,"r":"Solfatara – Monte Nuovo – Bajae – Cumae – Lago d’Averno","s":94,"t":"V","b":"Lago d'Averno: typischer Explosionskrater und Maar, 34,5 m tief; Bimssteintuff mit Leucittephrit-Auswürflingen; einst Kriegshafen mit Kanal zum Lucriner See","n":"Lago d’Averno","z":"Kratersee mit Uferweg","zg":"frei","sg":"Parco Regionale dei Campi Flegrei","g":"Maar der jüngsten Phase (Averno 2, ca. 4 300 Jahre)","l":"genau","la":40.839,"lo":14.0795,"c":"Pozzuoli (NA)","ex":"[…] Die Strasse durchschneidet den Ringwall unter dem sog. Arco Felice, einem als Aquäduct gedeuteten, malerischen Bogenbau in einem mächtigen Hohlwege, auf dessen Fuss das alte Pflaster sichtbar wird. Ohne dass man einen ausgesprochenen Rand des Kraterwalls passirte, gelangt man an den tiefeingesenkten Lago d’Averno. Dieser ist ein typischer Explosionskrater und ein Maar, welches ringsum steile Wände und nur im Osten einen niedrigen, etwas schärfer abgesetzten Wall besitzt, welcher sich unter dem Mte. Nuovo verliert. […]","sp":94,"u1":["Area non rilevabile","","","Napoli","Nicht kartierbar (bebaut)","#d6d6d2"],"u2":["(ohne Bezeichnung)","","Alter nicht angegeben","#c4c4c4"]},{"id":52,"k":3,"r":"Monte di Procida – Capo Miseno – Bacoli","s":96,"t":"H","b":"Torre Gaveta: steiler Gelbtufffelsen mit römischen Bauten; antiker Abflusskanal des Fusaro durch den Fels","n":"Torregaveta, Bacoli","z":"Endstation der Cumana-Bahn; Felsen mit Villenresten","zg":"frei","sg":"Parco Regionale dei Campi Flegrei","g":"Gelbtuff","l":"genau","la":40.8135,"lo":14.0428,"c":"Bacoli (NA)","ex":"[…] Wer mit der Ferrovia Cumana bis zum Lago Fusaro fährt, kann in !/, bis 3/, Tag die letzten geologisch interessanten Punkte der Phlegràischen Felder aufsuchen. Die Bahn endigt am Südende des Fusaro-Sees, an der Torre Gaveta. Letztere bezeichnet einen steil gegen das Meer abstürzenden Felsen von gelbem Tuff mit allerlei römischen Substructionen. Er lenkt die Sandmassen der nördlichen Küste ab, und deshalb haben schon die Alten den Abflusskanal des Fusaro-Sees durch diesen Tuffklotz hindurch gebaut; neuerdings hat die Lagune einen zweiten Abfluss durch die Dünen an ihrem Nordende erhalten. Südlich der Torre Gaveta erhebt sich der 21/, km lange, von NW. nach SO. gerichtete Monte di Procida. […]","sp":96},{"id":53,"k":3,"r":"Monte di Procida – Capo Miseno – Bacoli","s":96,"t":"K","b":"Lago Fusaro, Lagune hinter den Dünen","n":"Lago Fusaro mit der Casina Vanvitelliana","z":"Lagune, Muschelzuc

usragen. Dicht vor Bosco Tre Case ist Lava von 1754 sichtbar und ebenso am anderen Ende der langgezogenen Ortschaft bei der Station der Ferrovia Vesuviana (Napoli — S. Giuseppe). Massa di Somma — Atrio — Bosco. Hine zweite Excursion kann man von Neapel unternehmen, indem man mit Wagen oder Omnibus bis S. Giorgio a Cremano, resp. S. Sebastiano oder mit der Bahn bis zur Station Cercola fährt. […]","sp":169,"u1":["Depositi piroclastici di caduta (1944)","LPVe","Holozän","Ercolano","Pyroklastite, Holozän","#f09660"],"u2":["Lave dall'anno 1694 al 1944","Holozän","Lavastrom, historisch datiert","#b01c24"]},{"id":120,"k":6,"r":"Resina – Observatorium – Krater – Bosco Tre Case","s":169,"t":"L","b":"Reste des Stroms von 1714 (Rione Fruscio, 275 m) ragen aus den Pflanzungen; Lava von 1754 vor Bosco Tre Case und bei der Station der Ferrovia Vesuviana","n":"Boscotrecase","z":"Ortschaft mit Weinbergen (Lacryma Christi) auf den Laven","zg":"frei","sg":"Rote Zone des Vesuv-Notfallplans","g":"Laven von 1714 und 1754 am Südostfuß","l":"geschätzt","la":40.78,"lo":14.4655,"c":"Boscotrecase (NA)","ex":"Aschenkegels eine Gruppe von Ausbruchskegeln der Eruption von 1754 (800 m), ilberschreitet die Lava von 1822 (600 —500 m) und sieht beim Betreten der bebauten Region aus den Pflanzungen hie und da Reste des Stromes von 1714 (Rione Fruscio, 275 m) herausragen. Dicht vor Bosco Tre Case ist Lava von 1754 sichtbar und ebenso am anderen Ende der langgezogenen Ortschaft bei der Station der Ferrovia Vesuviana (Napoli — S. Giuseppe). Massa di Somma — Atrio — Bosco. Hine zweite Excursion kann man von Neapel unternehmen, indem man mit Wagen oder Omnibus bis S. Giorgio a Cremano, resp. S. Sebastiano oder mit der Bahn bis zur Station Cercola fährt. […]","sp":169,"u1":["Piroclastiti di Pompei","PPM","Holozän","Sorrento","Pyroklastite, Holozän","#f09660"],"u2":["Cono vesuviano - ceneri, lapilli, e scorie di lancio","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":121,"k":6,"r":"Massa di Somma – Atrio – Bosco","s":169,"t":"L","b":"Zwischen S. Sebastiano und Massa di Somma haben die Ströme von 1855 und 1872 einen flachen Rücken geschaffen und den unteren Fosso Faraone gefüllt","n":"Fosso Faraone zwischen San Sebastiano und Massa di Somma","z":"Teil des 1944 erneut überfluteten Gebiets","zg":"frei","sg":"Parco Nazionale del Vesuvio","g":"Laven von 1855, 1872 und 1944","l":"geschätzt","la":40.841,"lo":14.378,"c":"San Sebastiano al Vesuvio (NA)","ex":"[…] Hine zweite Excursion kann man von Neapel unternehmen, indem man mit Wagen oder Omnibus bis S. Giorgio a Cremano, resp. S. Sebastiano oder mit der Bahn bis zur Station Cercola fährt. Zwischen S. Sebastiano und Massa di Somma haben sich die mächtigen Ströme von 1855 und 1872 ihren Weg gesucht und zwischen beiden Orten einen flachen Rücken geschaffen, den unteren Theil des sog. Fosso Faraone ausfüllend. In der Mitte von Massa führt ein Pfad auf den Mte. Somma zu; zunächst läuft eran den Laven entlang, die prachtvolle Schlacken und Schlackenwälle der zusammengebrochenen Decke zeigen. […]","sp":169,"u1":["Depositi di flusso piroclastico","PNAb","Holozän","Ercolano","Pyroklastite, Holozän","#f09660"],"u2":["Frammenti lavici, proietti ultra-femici","Holozän","Lava, Schlacke, Dom","#7a262e"]},{"id":122,"k":6,"r":"Massa di Somma – Atrio – Bosco","s":170,"t":"A","b":"Schlucht im Somma-Kegel über Massa (ab 300 m): unten Tuffe der Phasen V und VI mit Kalkblöcken, darüber Bimsstein der Phase III und alte leucitreiche Laven mit kugeliger Absonderung","n":"Schluchten (Valloni) am Westhang des Monte Somma über Massa di Somma","z":"Teils verwachsen, teils durch Brände von 2017 freigelegt","zg":"eingeschränkt","sg":"Parco Nazionale del Vesuvio","g":"Abfolge der Somma-Eruptionen; Phase VI entspricht wohl dem Pomici-di-Base- oder Mercato-Ausbruch","l":"geschätzt","la":40.837,"lo":14.392,"c":"Massa di Somma (NA)","ex":"[…] In den höheren treten die Bimssteinmassen der III. Phase und bei weiterem Anstieg leucitreiche alte Laven mit kugeliger Absonderung hervor. Man kann nun dem Pfade folgend direkt in den Fosso della Vetrana gelangen oder vorher in einige, tief eingerissene Furchen an der linken Seite Einblick gewinnen, an deren Wänden die gleichen Laven und Bimssteinschichten anstehen. Wer keine Zeit hat von Pollena oder Somma aus die Thäler des Nordgehänges zu besuchen, sollte sich diesen kleinen Abstecher nicht verdriessen lassen, da er orographisch sehr interessant ist. […]","sp":170,"u1":["Colate e surge piroclastici","PAVb","Holozän","Ercolano","Pyroklastite, Holozän","#f09660"],"u2":["Frammenti lavici, proietti ultra-femici","Holozän","Lava, Schlacke, Dom","#7a262e"]},{"id":123,"k":6,"r":"Massa di Somma – Atrio – Bosco","s":171,"t":"A","b":"Atrio di Cavallo: Folgen von Laven und Tuffen mit zahlreichen mächtigen Radialgängen; nur das Val del Bove am Ätna bietet Vergleichbares. Johnston-Lavis nummerierte 37 Gänge","n":"Atrio del Cavallo mit den Gängen der Somma-Wand","z":"Teil des Vesuv-Nationalparks; Zugang nur auf ausgewiesenen Wegen bzw. mit Führung","zg":"eingeschränkt","sg":"Parco Nazionale del Vesuvio","g":"Radiale Gänge (Dykes) in der Innenwand der Somma-Caldera","l":"genau","la":40.83,"lo":14.425,"c":"Ercolano (NA)","ex":"[…] Am Atrio lassen sich nun in herrlichster Entblössung die Folgen von Laven und Tuffen mit zahlreichen mächtigen Radialgängen and Spaltenausfüllungen beobachten. Nur die Val del Bove am Aetna bietet in Europa dem Geologen einen ähnlich grossartigen Aufschluss. Die in ihrem Habitus sehr verschiedenartigen Gänge sind mineralogisch recht einförmig, aber bald fast porphyrisch-krystallin durch zahlreiche Augit- und Leuciteinsprenglinge, bald feinkörnig bis dicht, ja selbst obsidianartig und glasig. […]","sp":171,"u1":["Valanghe ardenti","LPVg","Holozän","Ercolano","Pyroklastite, Holozän","#f09660"],"u2":["Ceneri, lapilli e scorie di lancio con effusioni laviche intercalate: fase vesuvio-somma","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":124,"k":6,"r":"Massa di Somma – Atrio – Bosco","s":172,"t":"V","b":"Südöstlicher Abschnitt des Atrio, Valle dell’Inferno; Bocchen von 1751 und 1754 am Fuß des Aschenkegels, Kalkblöcke an den Hängen","n":"Valle dell’Inferno","z":"Abgeschiedenes Tal im Osten des Atrio","zg":"eingeschränkt","sg":"Parco Nazionale del Vesuvio","g":"Östliche Fortsetzung des Atrio zwischen Somma-Wall und Gran Cono","l":"geschätzt","la":40.827,"lo":14.441,"c":"Ottaviano (NA)","ex":"[…] Manche Blöcke sind 100 m und mehr vom Gehängefusse.fortgesprungen, beständig rieselt Gesteinsschutt hernieder, und füllt das Atrio langsam aus. Der südöstliche Abschnitt heisst Valle dell’Inferno. Dort wo der Klippenzug sich in den Ausläufern der Cognoli di fuori wieder neigt, beginnt ein Pfad, der an der Lava von 1834 entlang hinabführt. An den Gehängen kommen reichlich Kalkblöcke vor. Rechts am Fusse des Aschenkegels sind die Bocchen von 1751 und 1754 zu sehen. […]","sp":172,"u1":["Colata lavica del 1929","LPVa","Holozän","Ercolano","Lavastrom, historisch datiert","#b01c24"],"u2":["Lave dall'anno 1694 al 1944","Holozän","Lavastrom, historisch datiert","#b01c24"]},{"id":125,"k":6,"r":"Massa di Somma – Atrio – Bosco","s":172,"t":"L","b":"Abstieg nach Bosco: über die Lava von 1834 (Lava di Caposecchi), die rapilliüberschüttete Region I Torrioni mit Zungen von 1850, dann über die Lava von 1764 (Lava del Mauro)","n":"Ostflanke zwischen Terzigno und Boscotrecase","z":"Wald und Weinberge; großer Waldbrand 2017","zg":"frei","sg":"Parco Nazionale del Vesuvio","g":"Laven von 1764, 1834 und 1850","l":"geschätzt","la":40.803,"lo":14.461,"c":"Terzigno (NA)","ex":"[…] Rechts am Fusse des Aschenkegels sind die Bocchen von 1751 und 1754 zu sehen. Der Weg geht steil hinab bis 375 m, überschreitet den Strom von 1834 (Lava di Caposecchi), erreicht die I Torrioni genannte, von Rapilli dicht überschüttete Region, in die vom Vesuv her die Zungen des Ergusses von 1850 hmeinragen, führt dann über die Lava von 1764 (Lava del Mauro) und dicht vor Bosco an den Ausläufern derjenigen von 1751 — 54 vorbei und endigt im Orte nahe der Eisenbahnstation. Nordseite des Mte. Somma. […]","sp":172,"u1":["Depositi piroclastici di caduta (1944)","LPVe","Holozän","Ercolano","Pyroklastite, Holozän","#f09660"],"u2":["Vesuviti - leucititi","Holozän","Lava, Schlacke, Dom","#7a262e"]},{"id":126,"k":6,"r":"Nordseite des Monte Somma","s":173,"t":"A","b":"Runsen oberhalb Pollena, Lagno di Pollena mit drei Armen: Tuffe der Phase VI mit Auswürflingen, Kalken und Kalksilikatgesteinen, darunter Laven der Phase I; kohlige Auswürflinge im Vallone Pollena","n":"Lagno (Vallone) di Pollena, Pollena Trocchia","z":"Erosionsrinne mit Hochwasserbauten; Wanderweg auf den Monte Somma","zg":"eingeschränkt","sg":"Parco Nazionale del Vesuvio","g":"Bekannte Fundstelle von Somma-Auswürflingen (Skarn-Blöcke mit Vesuvian, Granat u. a.)","l":"geschätzt","la":40.8465,"lo":14.388,"c":"Massa di Somma (NA)","ex":"[…] Phase. Der Hauptstrasse von Pollena folgend trifft man am Ende des Ortes auf einen Saumpfad, der sich am Rande des breiten Risses Lagno di Pollena entlang gegen den Berg fortsetzt. Dieser Lagno gabelt sich in drei Arme, in denen man in jedem ziemlich hoch hinaufsteigen und zur geologischen Orientirung die vorkommenden Gesteine reichlich sammeln kann. — Eine andere Stelle ist von Sta. Anastasia aus zu besuchen, wenn man von der Mitte der südlichen Hälfte des Ortes der Cupa dell’ Olivello, an deren Westseite eine Wasserleitung läuft, gegen den Berg nachgeht. […]","sp":173,"u1":["Depositi di flusso piroclastico","PNAb","Holozän","Ercolano","Pyroklastite, Holozän","#f09660"],"u2":["Frammenti lavici, proietti ultra-femici","Holozän","Lava, Schlacke, Dom","#7a262e"]},{"id":127,"k":6,"r":"Nordseite des Monte Somma","s":174,"t":"A","b":"Von S. Anastasia die Cupa dell’Olivello hinauf, über die tiefe Valle del Sacramento","n":"Valle del Sacramento oberhalb von Sant’Anastasia","z":"Hangschluchten mit Wanderwegen des Parks","zg":"eingeschränkt","sg":"Parco Nazionale del Vesuvio","g":"Tuffe und Laven der Somma-Nordflanke","l":"geschätzt","la":40.842,"lo":14.412,"c":"Sant'Anastasia (NA)","ex":"jedem ziemlich hoch hinaufsteigen und zur geologischen Orientirung die vorkommenden Gesteine reichlich sammeln kann. — Eine andere Stelle ist von Sta. Anastasia aus zu besuchen, wenn man von der Mitte der südlichen Hälfte des Ortes der Cupa dell’ Olivello, an deren Westseite eine Wasserleitung läuft, gegen den Berg nachgeht. Bei der Wasserfassung am Fusse der ersten Steigung zweigt sich ein Pfad ab, auf dem man die tiefe Valle del Sacramento überschreitet und in einem Parallelrisse zu dieser weit hinauf steigen kann. Ebenso bequem ist ein Besuch der Thäler westlich von Ottajano oder südlich von Somma auf dem Weg zum Kirchlein Sta. Maria del Castello. […]","sp":174,"u1":["Scorie di caduta sciolte","LVIb","Holozän","Ercolano","Pyroklastite, Holozän","#f09660"],"u2":["Frammenti lavici, proietti ultra-femici","Holozän","Lava, Schlacke, Dom","#7a262e"]},{"id":128,"k":6,"r":"Nordseite des Monte Somma","s":174,"t":"S","b":"Täler westlich von Ottajano und südlich von Somma auf dem Weg zum Kirchlein S. Maria del Castello","n":"Santuario di Santa Maria di Castello, Somma Vesuviana","z":"Wallfahrtskirche auf rund 450 m mit Blick über die Ebene","zg":"frei","sg":"Parco Nazionale del Vesuvio","g":"Nordflanke des Monte Somma","l":"geschätzt","la":40.846,"lo":14.443,"c":"Somma Vesuviana (NA)","ex":"[…] Bei der Wasserfassung am Fusse der ersten Steigung zweigt sich ein Pfad ab, auf dem man die tiefe Valle del Sacramento überschreitet und in einem Parallelrisse zu dieser weit hinauf steigen kann. Ebenso bequem ist ein Besuch der Thäler westlich von Ottajano oder südlich von Somma auf dem Weg zum Kirchlein Sta. Maria del Castello. Es kann nicht Aufgabe dieses Führers sein, alle die Sommathäler zu beschreiben. Diese Beispiele mögen genügen. Mit Hülfe der topographischen Karte wird man leicht andere Combinationen feststellen. […]","sp":174,"u1":["Lapilli pomicei","PAVa","Holozän","Ercolano","Pyroklastite, Holozän","#f09660"],"u2":["Frammenti lavici, proietti ultra-femici","Holozän","Lava, Schlacke, Dom","#7a262e"]},{"id":129,"k":6,"r":"Die Bocchen von 1861 und 1794","s":175,"t":"H","b":"Herculaneum unter Resina, 10–30 m tief begraben; Theater völlig von Laven bedeckt; in der Straße zur See ausgegrabene Häuser zeigen murartige Schlamm- und Tuffmassen mit Somma-Kalkbrocken","n":"Parco Archeologico di Ercolano","z":"Großflächig ausgegraben; das Theater ist nur über Schächte unter dem Corso Resina zugänglich","zg":"frei","sg":"Parco Archeologico di Ercolano (UNESCO-Welterbe)","g":"Heute gedeutet als Ablagerungen pyroklastischer Dichteströme von 79 n. Chr., nicht als Lava und Schlammstrom. Die Lava von 1631 liegt darüber","l":"genau","la":40.8059,"lo":14.348,"c":"Ercolano (NA)","ex":"[…] Das alte Herculanum ist unter Resina in wechselnder Tiefe (10 bis 30 m) begraben. Das Theater ist völlig von den 79 n. Chr. und 1631 geförderten Laven bedeckt. In der neben dem Theater zur See führenden Strasse sind einzelne Häuser aus dem Schutt ausgegraben, wobei klar wird, dass nicht nur Laven, sondern ausserdem gewaltige Schlamm- und feuchte Tuffmassen murbruchartig die Stadt begraben haben. In diesem jetzt festen Schlamm nämlich stecken zahlreiche kleine Sommakalkbrocken, wie sie die anstehenden Tuffe der benachbarten Gehänge charakterisiren. Zwischen Resina und Torre del Greco ist ein anderer Arm der Lava von 1631 bis an das Meer gelangt. […]","sp":175,"u1":["Piroclastiti di pompei","PPM","Holozän","Ercolano","Pyroklastite, Holozän","#f09660"],"u2":["Lapilli e cineriti","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":130,"k":6,"r":"Die Bocchen von 1861 und 1794","s":175,"t":"L","b":"Strom von 1794, oben am Knick des Somma-Hangs entsprungen, floss über Torre del Greco ins Meer und bildete das Vorgebirge mit dem Fort Calastro beim Bahnhof","n":"Küste von Torre del Greco (Calastro, La Scala)","z":"Lavaküste mit Hafenanlagen","zg":"frei","sg":"–","g":"Lavastrom von 1794, der die Stadt zerstörte","l":"geschätzt","la":40.7835,"lo":14.364,"c":"Torre del Greco (NA)","ex":"[…] Zwischen Resina und Torre del Greco ist ein anderer Arm der Lava von 1631 bis an das Meer gelangt. Bei der Stadt selbst treffen wir auf den Strom von 1794, der, oben auf dem Plateau und am Knick des Sommahanges entspringend, sich über die Stadt hinweg in: das -Meer-ergess und das Vorgebirge mit dem Fort Calastro dicht bei der Eisenbahnstation bildete. In Torre del Greco geht man auf der oberen Hauptstrasse weiter, bis etwa in der Mitte derselben links eine Strasse nach dem Kapuzinerkloster abzweigt. […]","sp":175},{"id":131,"k":6,"r":"Die Bocchen von 1861 und 1794","s":176,"t":"V","b":"Bocche von 1861: 11 bis 14 kleine Kraterkegel auf einer NO–SW-Spalte; oberstes Loch eine lange Nische im Sommatuff","n":"Bocche del 1861 oberhalb Torre del Greco","z":"Kleine Kegelreihe zwischen Gärten und Wald, teils erhalten","zg":"eingeschränkt","sg":"Parco Nazionale del Vesuvio","g":"Exzentrische Seitenspalte nahe dem Fuß des Somma-Kegels","l":"geschätzt","la":40.798,"lo":14.396,"c":"Torre del Greco (NA)","ex":"schliesslich in dem höheren, weniger kultivirten Terrain die Grenze beider. Etwas weiter binauf erkennt man eine schräg nach rechts abbiegende Reihe kleiner Kraterkegel, die Bocche von 1861. Es sind 11 bis 14; die genaue Zahl ist nicht mehr recht festzustellen, da sie sich gegenseitig störten. Sie lieferten die bis dicht an Torre del Greco heranreichende Lava und liegen in einer Reihe auf einer NO.— SW. gerichteten Spalte. Steigt man an ihrer Seite aufwärts, so gelangt man schliesslich an das oberste Loch, eine lange tiefe, hinten abgerundete Nische, den Rest der den Berg durchsetzenden Eruptionskluft. Sie ist ganz im Sommatuff eingesenkt. […]","sp":176,"u1":["Banchi di cenere","PAVb","Holozän","Sorrento","Pyroklastite, Holozän","#f09660"],"u2":["Lapilli e cineriti","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":132,"k":6,"r":"Die Bocchen von 1861 und 1794","s":176,"t":"V","b":"Plateau Le Piane, gelbbraune Bocche von 1794 in 500 m Höhe auf fast 1 km Länge; die Hochebene dient als Schießplatz der Infanterie","n":"Bocche del 1794 auf der Hochfläche Le Piane","z":"Zugang über Wege des Nationalparks; ehemaliger Schießplatz","zg":"eingeschränkt","sg":"Parco Nazionale del Vesuvio","g":"Ausbruchsspalte der Eruption vom 15. Juni 1794","l":"geschätzt","la":40.806,"lo":14.403,"c":"Torre del Greco (NA)","ex":"[…] Sie ist ganz im Sommatuff eingesenkt. Ein Fusspfad erlaubt es, von diesem Punkte aus den Rand des alten Sommastiickes zu erreichen, über den rechts und links die jüngeren Laven von dem Le Piane genannten Plateau herabgeflossen sind. Ostwärts machen sich die verschiedenen Zungen der 1804— 1806 geförderten Lava im Gelände bemerkbar, westlich und nördlich der Strom von 1794, der freilich sehr stark cultivirt ist. Schliesslich fallen auf der Höhe sofort die gelbbraunen Bocche des letzteren ins Auge. Sie stehen etwas links und nach Norden in 500m Höhe üb. d. M. und vertheilen sich auf fast 1km Länge. Die drei mittleren, welche nahe zusammen liegend eine Gruppe bilden, sind bequem zu besuchen. […]","sp":176,"u1":["Colata lavica del 1737","LPVa","Holozän","Ercolano","Lavastrom, historisch datiert","#b01c24"],"u2":["Lave dall'anno 1694 al 1944","Holozän","Lavastrom, historisch datiert","#b01c24"]},{"id":133,"k":6,"r":"Das Ufer zwischen Portici und Pompeji","s":177,"t":"V","b":"Zwischen den Ergüssen von 1804–1806 ragt deutlich abgesetzt der prähistorische Seitenkrater auf, der das Kloster Camaldoli trägt","n":"Colle dei Camaldoli della Torre, Torre del Greco","z":"Hügel mit dem Eremo dei Camaldoli, Aussichtspunkt","zg":"eingeschränkt","sg":"–","g":"Parasitärer Schlackenkegel am Südfuß des Vesuvs","l":"geschätzt","la":40.779,"lo":14.411,"c":"Torre del Greco (NA)","ex":"[…] Annunziata Gehängeschutt, wie er Herculanum bedeckt, sowie ältere Laven unbekannter Entstehung. Oberhalb der Bahn, von dieser aus nur gelegentlich sichtbar, endigen die Ergüsse von 1804—1806. Zwischen denselben ragt deutlich abgesetzt der prähistorische Seitenkrater auf, der das Kloster Camaldoli trägt. Dicht vor Torre Annunziata durchquert die Bahn die Laven von 1760 und ältere, die ebenfalls einen breiten Vorsprung des Ufers schufen. In diesen und anderen sind mächtige Steinbrüche angelegt, die für Neapel und seine Nachbarorte das Pflastermaterial liefern. […]","sp":177,"u1":["Piroclastiti di caduta","LPVc","Holozän","Sorrento","Pyroklastite, Holozän","#f09660"],"u2":["Lave dall'anno 1694 al 1944","Holozän","Lavastrom, historisch datiert","#b01c24"]},{"id":134,"k":6,"r":"Das Ufer zwischen Portici und Pompeji","s":178,"t":"A","b":"Vor Torre Annunziata durchquert die Bahn die Laven von 1760; mächtige Steinbrüche liefern das Pflastermaterial für Neapel","n":"Lavaküste von Torre Annunziata (Oncino)","z":"Brüche aufgelassen, Küste bebaut","zg":"frei","sg":"–","g":"Lava von 1760 und ältere Ströme","l":"geschätzt","la":40.76,"lo":14.4385,"c":"Torre Annunziata (NA)","ex":"breiten Vorsprung des Ufers schufen. In diesen und anderen sind mächtige Steinbrüche angelegt, die für Neapel und seine Nachbarorte das Pflastermaterial liefern. Ausserdem entspringen längs des Ufers mehrere Eisensäuerlinge, die zu mancherlei Bädern oder Heilanstalten Veranlassung gegeben haben. Von T. Annunziata Centrale bis Castellammare läuft die Bahn über ein Alluvialland, das aus Vesuvasche, Sarnoanschwemmung und Dünensand besteht und an die Stelle einer flachen Bucht getreten ist. Bei T. Annunziata Centrale erblickt man landeinwärts die aus weissen Bimssteinen aufgeschütteten Hügel, hinter denen die Stadt Pompeji sich versteckt. Pompeji. […]","sp":178,"u1":["Lave grigio-scure","LVIa","Holozän","Sorrento","Lava, Schlacke, Dom","#7a262e"],"u2":["Lapilli e cineriti","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":135,"k":6,"r":"Das Ufer zwischen Portici und Pompeji","s":178,"t":"F","b":"Längs des Ufers mehrere Eisensäuerlinge mit Bädern und Heilanstalten","n":"Terme Vesuviane Nunziante, Torre Annunziata","z":"Historische Thermen am Strand; Betrieb seit Jahren eingestellt","zg":"geschlossen","sg":"–","g":"CO₂-haltige Mineralwässer am Vesuvfuß","l":"geschätzt","la":40.754,"lo":14.4465,"c":"Torre Annunziata (NA)","ex":"[…] In diesen und anderen sind mächtige Steinbrüche angelegt, die für Neapel und seine Nachbarorte das Pflastermaterial liefern. Ausserdem entspringen längs des Ufers mehrere Eisensäuerlinge, die zu mancherlei Bädern oder Heilanstalten Veranlassung gegeben haben. Von T. Annunziata Centrale bis Castellammare läuft die Bahn über ein Alluvialland, das aus Vesuvasche, Sarnoanschwemmung und Dünensand besteht und an die Stelle einer flachen Bucht getreten ist. Bei T. Annunziata Centrale erblickt man landeinwärts die aus weissen Bimssteinen aufgeschütteten Hügel, hinter denen die Stadt Pompeji sich versteckt. Pompeji. […]","sp":178,"u2":["Spiagge sabbiose e duna litoranea recente","Holozän","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"]},{"id":136,"k":6,"r":"Das Ufer zwischen Portici und Pompeji","s":178,"t":"A","b":"Bei T. Annunziata Centrale landeinwärts Hügel aus weißen Bimssteinen, hinter denen Pompeji versteckt liegt","n":"Torre Annunziata – Villa di Oplontis","z":"Die Bimsdecke wurde später großflächig abgetragen; in Torre Annunziata ist die Villa von Oplontis (Villa di Poppea) ausgegraben","zg":"frei","sg":"Parco Archeologico di Pompei (UNESCO-Welterbe)","g":"Bimsfall der Eruption von 79 n. Chr.","l":"genau","la":40.757,"lo":14.4529,"c":"Torre Annunziata (NA)","ex":"[…] Bei T. Annunziata Centrale erblickt man landeinwärts die aus weissen Bimssteinen aufgeschütteten Hügel, hinter denen die Stadt Pompeji sich versteckt. Pompeji. Auch in Pompeji lassen sich allerlei geologische Beobachtungen machen, so dass hier kurz darauf eingegangen sein möge. Pompeji liegt auf einer alten Sommalava, deren Erstreckung gegen das Sarnothal trotz der gewaltigen späteren Ueberschüttung deutlich als ein flacher Rücken hervortritt. Aufgeschlossen ist er bei dem Amphitheater (Casa Erra) und an der Südseite der Stadtmauer bei der Gladiatorenkaserne und den mehrstöckigen Häusern. […]","sp":178,"u1":["Piroclastiti di Pompei","PPM","Holozän","Sorrento","Pyroklastite, Holozän","#f09660"],"u2":["Terre vecchie - lapilli e cineriti","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":137,"k":6,"r":"Pompeji","s":178,"t":"A","b":"Pompeji liegt auf einer alten Sommalava mit erbsengroßen Leuciten, aufgeschlossen beim Amphitheater (Casa Erra); Tuffe von 79 rings um das Amphitheater mit Pisolithen","n":"Amphitheater von Pompeji","z":"Ausgrabung zugänglich","zg":"frei","sg":"Parco Archeologico di Pompei (UNESCO-Welterbe)","g":"Prähistorischer Lavastrom des Somma; darüber Bims und Aschen von 79 n. Chr.","l":"genau","la":40.7509,"lo":14.4952,"c":"Pompei (NA)","ex":"[…] Pompeji liegt auf einer alten Sommalava, deren Erstreckung gegen das Sarnothal trotz der gewaltigen späteren Ueberschüttung deutlich als ein flacher Rücken hervortritt. Aufgeschlossen ist er bei dem Amphitheater (Casa Erra) und an der Südseite der Stadtmauer bei der Gladiatorenkaserne und den mehrstöckigen Häusern. Das Gestein ist braun, stark verwittert und mit erbsengrossen, frei herausfallenden Leucitkrystallen versehen. Seine an Leucit reichen, blasigen, braunschwarzen Schlacken findet man als Baumaterial der Hauswände und im Gusswerk der gewölbten Decken wieder. Gute Durchschnitte durch die 79 n. […]","sp":178,"u1":["Vulcaniti della Civita","VVT","Oberpleistozän bis Holozän","Sorrento","Pyroklastite, Holozän","#f09660"],"u2":["Resti archeologici romani","Holozän","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"]},{"id":138,"k":6,"r":"Pompeji","s":178,"t":"A","b":"Lava an der Südseite der Stadtmauer bei der Gladiatorenkaserne und den mehrstöckigen Häusern","n":"Quadriportico dei Teatri (Gladiatorenkaserne), Pompeji","z":"Ausgrabung zugänglich","zg":"frei","sg":"Parco Archeologico di Pompei (UNESCO-Welterbe)","g":"Somma-Lava als Untergrund der Stadt","l":"genau","la":40.7478,"lo":14.4883,"c":"Pompei (NA)","ex":"[…] Pompeji liegt auf einer alten Sommalava, deren Erstreckung gegen das Sarnothal trotz der gewaltigen späteren Ueberschüttung deutlich als ein flacher Rücken hervortritt. Aufgeschlossen ist er bei dem Amphitheater (Casa Erra) und an der Südseite der Stadtmauer bei der Gladiatorenkaserne und den mehrstöckigen Häusern. Das Gestein ist braun, stark verwittert und mit erbsengrossen, frei herausfallenden Leucitkrystallen versehen. Seine an Leucit reichen, blasigen, braunschwarzen Schlacken findet man als Baumaterial der Hauswände und im Gusswerk der gewölbten Decken wieder. Gute Durchschnitte durch die 79 n. […]","sp":178,"u1":["Piroclastiti di Pompei","PPM","Holozän","Sorrento","Pyroklastite, Holozän","#f09660"],"u2":["Resti archeologici romani","Holozän","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"]},{"id":139,"k":6,"r":"Pompeji","s":179,"t":"A","b":"An der Nordseite der Stadtmauer Tuffe von 79 in ursprünglicher Lagerung: weißer, dann grauer Bims, darüber Aschen, 8–10 m","n":"Nordmauer bei der Porta Vesuvio, Pompeji","z":"Grabungsgrenze mit Profilen der Eruptionsablagerungen","zg":"frei","sg":"Parco Archeologico di Pompei (UNESCO-Welterbe)","g":"Klassisches Profil: weißer und grauer Bims (plinianische Phase), darüber Lagen pyroklastischer Dichteströme","l":"genau","la":40.7538,"lo":14.4848,"c":"Pompei (NA)","ex":"[…] Chr. und später auf Pompeji niedergefallenen Tuffe sind nicht leicht zu finden; denn auch in den unausgegrabenen Theilen sind durch den Bau des Sarnokanals und frühere als Raubbau betriebene Untersuchungen die verschiedenen Lagen arg durcheinander gerathen. Rings um das Amphitheater und in Hohlwegen am Rande der Vertiefung sowie an der Nordseite der Stadtmauer lassen sich immerhin einige Tuffe mit ihrer ursprünglichen Lagerung erkennen. Sie haben im Allgemeinen 8— 10m Dicke, an vielen Punkten aber weit weniger und zerfallen in drei Schichten, die regelmässig wie Schneelagen aufeinander folgen. […]","sp":179,"u1":["Piroclastiti di Pompei","PPM","Holozän","Sorrento","Pyroklastite, Holozän","#f09660"],"u2":["Resti archeologici romani","Holozän","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"]},{"id":140,"k":6,"r":"Pompeji","s":180,"t":"H","b":"Straßenpflaster und Schwellen aus dichter Lava mit kugelig-schaliger Absonderung, z. B. an der Treppe vom Forum zur Basilika; Mühlsteine mit großen Leuciten vermutlich vom Roccamonfina","n":"Forum und Basilika von Pompeji","z":"Ausgrabung zugänglich","zg":"frei","sg":"Parco Archeologico di Pompei (UNESCO-Welterbe)","g":"Baugesteine: Vesuvlava, Leucit-Phonolith (Mühlsteine), Kampanischer Ignimbrit, Gelbtuff, Sarno-Travertin","l":"genau","la":40.7486,"lo":14.4848,"c":"Pompei (NA)","ex":"[…] Dichtere, bald mehr, bald weniger krystalline, z. Z. unbekannte Lavaströme lieferten das Material für das Strassenpflaster, die Treppenschwellen und die grossen Trittsteine und Rinnsteinbordschwellen. Bei diesen Blöcken ist durch die Zeit und das Abtreten eine versteckte kugelig-schalige Absonderung schärfer hervorgetreten, was man z. B. an den Schwellen der vom Forum zur Basilika führenden Treppe beobachtet. In den Bäckereien stammen die Mühlsteinkegel und Hohlkegel mit den grossen Leuciten wohl nicht vom Mte. Somma, sondern eher von dem Vulkan von Roccamonfina. […]","sp":180,"u1":["Vulcaniti della Civita","VVT","Oberpleistozän bis Holozän","Sorrento","Pyroklastite, Holozän","#f09660"],"u2":["Resti archeologici romani","Holozän","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"]},{"id":141,"k":6,"r":"Pompeji","s":180,"t":"H","b":"Grauer kampanischer Tuff als älteres Baumaterial, z. B. in großen Quadern der Casa del Chirurgo; Brüche zwischen Gragnano und Sarno","n":"Casa del Chirurgo, Pompeji","z":"Ausgrabung, Haus teils zugänglich","zg":"frei","sg":"Parco Archeologico di Pompei (UNESCO-Welterbe)","g":"Kampanischer Ignimbrit (Tufo grigio campano)","l":"genau","la":40.752,"lo":14.4818,"c":"Pompei (NA)","ex":"[…] Ein wichtiges Baumaterial der älteren Zeit war der graue campanische Tuff mit den flammigen schwarzen Schlacken (vergl. S.37). Derselbe ist weich und zerreiblich, leicht zu behauen und hat daher z.B. in der Casa del Chirurgo zu grossen Quadern der Thür und Seitenwände Verwendung gefunden. Auch kommt er mit kleineren Bruchstücken in dem sog. opus incertum vor. Die Brüche dieses Gesteins lagen sicher zwischen Gragnano und Sarno, vielleicht bei Nocera, wo noch heute grosse Gruben eröffnet sind, von denen gleich weiter unten die Rede sein wird. […]","sp":180,"u1":["Vulcaniti della Civita","VVT","Oberpleistozän bis Holozän","Sorrento","Pyroklastite, Holozän","#f09660"],"u2":["Resti archeologici romani","Holozän","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"]},{"id":142,"k":7,"r":"Sarno – Nocera","s":182,"t":"A","b":"Am Fuß der Hügel von Merichi und des Monte Torrichio (Rudistenkalk, isolierte Scholle) entlang; die Bahn Sarno–Codola durchbricht ihn im Tunnel","n":"Kalkhügel zwischen Nocera Inferiore und Sarno","z":"Lage geschätzt; Hänge teils mit Steinbrüchen","zg":"unklar","sg":"–","g":"Kreidekalk der Karbonatplattform, vom Kampanischen Ignimbrit umlagert","l":"geschätzt","la":40.77,"lo":14.618,"c":"Nocera Inferiore (SA)","ex":"[…] Man fährt entweder bis Nocera oder, wenn sofort Anschluss ist, bis Codola; eventuell von Neapel bis Sarno, wozu sich der Morgenzug am besten eignet, da die Rückkehr dann Nachmittags über Pompeji bewirkt werden kann. Von Nocera wandert man am Fusse der Hügel von Merichi und des Mte. Torrichio entlang. Der letztere besteht aus Rudistenkalk und ist eine isolirte Scholle, die SW.— NO. streicht und NW. fällt. Die Bahn Sarno-Codola durchbricht ihn mit einem Tunnel. […]","sp":182,"u1":["Alluvioni di conoide","VEF2b","Holozän","Sorrento","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"],"u2":["Tufo Campano","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":143,"k":7,"r":"Sarno – Nocera","s":183,"t":"A","b":"Tuffbrüche am Fuß von Monte Torrichio und Apollinaro, über 20 m grauer Tuff mit Säulen; im Süden die Brüche von Fiano, im Norden Fossa Lupara: Kalkeinschlüsse, Glimmer- und Nocerindrusen, Flussspat","n":"Tuffsteinbrüche von Fiano, Nocera Inferiore","z":"Abbau des Tufo grigio teils noch, teils aufgelassen","zg":"eingeschränkt","sg":"–","g":"Kampanischer Ignimbrit (39 800 Jahre) mit Fluor-Mineralen; Typlokalität des Minerals Nocerit","l":"geschätzt","la":40.7605,"lo":14.6205,"c":"Nocera Inferiore (SA)","ex":"[…] Er ist ungeschichtet, oft säulenförmig abgesondert und gegen oben bräunlich bis gelblich gefärbt, in Folge der Oxydation seiner eisenhaltigen Bestandtheile. Am Gehänge sind drei Steinbrüche eröffnet, deren südliche den Namen Fiano tragen, deren nördlicher Fossa Lupara heisst. In diesen trifft man zusammen mit dem Tuffe zahlreiche Einschlüsse von Kalk, die entweder randlich oder ganz und gar krystallin und weiss geworden sind. Andere, die in einer Kruste amorpher Kieselsäure stecken, beherbergen schöne Glimmer- und Nocerindrusen. Sie stecken meistens im Tuff selbst, sind sehr zerbrechlich, so dass man sich entsprechend mit Schachteln und Watte ausrüsten muss. […]","sp":183,"u1":["Alluvioni di conoide","VEF2b","Holozän","Sorrento","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"],"u2":["Tufo Campano","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":144,"k":7,"r":"Sarno – Nocera","s":183,"t":"A","b":"Nördlicher Tuffbruch Fossa Lupara mit verkieselten Kalkeinschlüssen und fluorhaltigen Massen","n":"Ehem. Tuffbruch Fossa Lupara bei Nocera","z":"Lage geschätzt","zg":"unklar","sg":"–","g":"Kampanischer Ignimbrit","l":"geschätzt","la":40.769,"lo":14.615,"c":"Nocera Inferiore (SA)","ex":"[…] Er ist ungeschichtet, oft säulenförmig abgesondert und gegen oben bräunlich bis gelblich gefärbt, in Folge der Oxydation seiner eisenhaltigen Bestandtheile. Am Gehänge sind drei Steinbrüche eröffnet, deren südliche den Namen Fiano tragen, deren nördlicher Fossa Lupara heisst. In diesen trifft man zusammen mit dem Tuffe zahlreiche Einschlüsse von Kalk, die entweder randlich oder ganz und gar krystallin und weiss geworden sind. Andere, die in einer Kruste amorpher Kieselsäure stecken, beherbergen schöne Glimmer- und Nocerindrusen. Sie stecken meistens im Tuff selbst, sind sehr zerbrechlich, so dass man sich entsprechend mit Schachteln und Watte ausrüsten muss. […]","sp":183,"u1":["Alluvioni di conoide","VEF2b","Holozän","Sorrento","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"],"u2":["Tufo Campano","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":145,"k":7,"r":"Sarno – Nocera","s":184,"t":"A","b":"Steinbruch (Tufara) S. Vito dicht vor Sarno: gelblicher Tuff mit hellen Bimssteinen, selten Hirschknochen als Beleg für Ablagerung an Land","n":"Tuffbrüche am Südrand von Sarno","z":"Lage geschätzt","zg":"unklar","sg":"–","g":"Oberer, gelblich umgewandelter Teil des Kampanischen Ignimbrits","l":"geschätzt","la":40.803,"lo":14.61,"c":"Sarno (SA)","ex":"Weiterhin dicht vor Sarno steht in dem Steinbruch (Tufara) S. Vito ein gelblicher Tuff mit hellen Bimssteinen an, wenn es nicht umgewandelter, d. h. gebleichter campanischer Tuff ist. Hie und da finden sich als Seltenheit Knochen von Hirschen in dem Tuff, ein Beweis fiir seine terrestrische Entstehung. Innerhalb des Bogens, z. Th. direkt am Rande der Kalkberge, hat man Gelegenheit das Hervorbrechen starker Quellen zu sehen. Es sind die Abzugskanäle der im oberen Thalabschnitte bei Mercato, Codola etc. versickernden Gewässer, die hier sich gegen die Ebene entleeren, in zahlreichen kleinen Adern nach S. Marzano zusammenrinnen und den Sarno bilden (vergl. S. 13). […]","sp":184,"u1":["Travertino","VEF2f1","Holozän","Ercolano","Travertin, Kalksinter","#cedea0"],"u2":["Travertino con alternanze di materiale piroclastico","Holozän","Travertin, Kalksinter","#cedea0"]},{"id":146,"k":7,"r":"Sarno – Nocera","s":184,"t":"F","b":"Starke Karstquellen am Rand der Kalkberge, die bis S. Marzano zum Sarno zusammenrinnen; in diesem Bogen wächst der in Pompeji verbaute Travertin","n":"Sorgenti del Sarno (Santa Maria la Foce, Mercato-Palazzo, Santa Marina di Lavorate)","z":"Quellen großteils für die Trinkwasserversorgung gefasst; der Sarno gilt als einer der am stärksten belasteten Flüsse Europas. Am 5. Mai 1998 begruben Schlammströme aus den vulkanischen Hangböden Teile von Sarno (137 Tote)","zg":"frei","sg":"Parco Regionale del Bacino Idrografico del Fiume Sarno","g":"Karstquellen aus den Kalken der Monti di Sarno; Travertin im Quellgebiet","l":"genau","la":40.815,"lo":14.602,"c":"Sarno (SA)","ex":"[…] Innerhalb des Bogens, z. Th. direkt am Rande der Kalkberge, hat man Gelegenheit das Hervorbrechen starker Quellen zu sehen. Es sind die Abzugskanäle der im oberen Thalabschnitte bei Mercato, Codola etc. versickernden Gewässer, die hier sich gegen die Ebene entleeren, in zahlreichen kleinen Adern nach S. Marzano zusammenrinnen und den Sarno bilden (vergl. S. 13). Innerhalb dieses Bogens bis S. Marzano wächst der Travertin immer nach und entsteht das schon in Pompeji gebrauchte Gestein. […]","sp":184,"u1":["Travertino","VEF2f1","Holozän","Ercolano","Travertin, Kalksinter","#cedea0"],"u2":["Tufo Campano","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":147,"k":7,"r":"Kampanischer Tuff: Maddaloni – Caserta – Calvi","s":184,"t":"H","b":"Wanderung zum Studium der kampanischen Tuffe: von Maddaloni über den Aquädukt Ponte della Valle nach Garzano hinter der Kette des Monte S. Michele","n":"Ponti della Valle (Acquedotto Carolino), Valle di Maddaloni","z":"Vanvitellis Aquädukt von 1769, gut erhalten","zg":"frei","sg":"UNESCO-Welterbe (Reggia di Caserta, Acquedotto Vanvitelliano)","g":"Kalkrücken des Apennins, im Vorland Kampanischer Ignimbrit","l":"genau","la":41.0712,"lo":14.4115,"c":"Valle di Maddaloni (CE)","ex":"[…] Von Sarno ist per Eisenbahn die Rückkehr über Cancello nach Neapel anzurathen, eventuell ein Ausflug in die allerdings geologisch wenig bietenden Berge von Nola oder Cancello anzuschliessen, falls die Zeit reicht. Zum Studium der campanischen Tuffe möge eine Wanderung empfohlen sein von der oberen Station Maddaloni (Linie nach Benevento) über den Aquädukt Ponte della Valle (vgl. S. 17) nach Garzano hinter der Kette des Mte. S. Michele. Weiter über Tuoro, Sta. Barbara und Puccianello nach Caserta. Oder ein Besuch der Umgebung von Sparanise — Calvi Risorta — Pignataro. […]","sp":184,"u1":["Coltri elluviali e colluviali","B2","Holozän","Caserta Est","Hangschutt, Rutschmassen","#ecdeba"],"u2":["Tufo grigio campano - ignimbrite","Pleistozän","Kampanischer Ignimbrit (39 800 J.)","#9684a0"]},{"id":148,"k":7,"r":"Kampanischer Tuff: Maddaloni – Caserta – Calvi","s":185,"t":"V","b":"Weiter über Tuoro, S. Barbara und Puccianello nach Caserta; dazu Scacchis Aufsatz „Il vulcanetto di Puccianello“","n":"Puccianello, Caserta","z":"Ortsteil am Hang der Monti Tifatini","zg":"frei","sg":"–","g":"Kleiner Ausbruchspunkt am Rand der kampanischen Ebene (Deutung umstritten)","l":"geschätzt","la":41.096,"lo":14.327,"c":"Caserta (CE)","ex":"Tuoro, Sta. Barbara und Puccianello nach Caserta. Oder ein Besuch der Umgebung von Sparanise — Calvi Risorta — Pignataro. Geht man von Pignataro Maggiore nach Giano- Vetusto und dann über Camigliano, Bellona zum Volturno, um in Capua oder Sta. Maria Vetere die Bahn wieder zu erreichen, ist auch ohne besondere Schwierigkeit ein Bild von der Struktur der Randketten zu erlangen. -Fiir diese und ähnliche Ausflüge ist Anschaffung von Blatt Nr.172 (Caserta) der topographischen Karte 1:100000 empfehlenswerth und der Aufsatz von A. Scacchi: Il vulcanetto di Puccianello zu lesen. (Mem. Accad. d. sc. fis. e mat. Napoli III. […]","sp":185,"u2":["Tufo grigio campano - ignimbrite","Pleistozän","Kampanischer Ignimbrit (39 800 J.)","#9684a0"]},{"id":149,"k":7,"r":"Kampanischer Tuff: Maddaloni – Caserta – Calvi","s":185,"t":"A","b":"Umgebung von Sparanise – Calvi Risorta – Pignataro: Struktur der Randketten und Tuffe","n":"Calvi Risorta (Cales)","z":"Römische Stadt Cales mit Ruinen; Ort auf Tuffplateau","zg":"frei","sg":"–","g":"Kampanischer Ignimbrit und Roccamonfina-Tuffe am Rand der Ebene","l":"genau","la":41.214,"lo":14.13,"c":"Calvi Risorta (CE)","ex":"Tuoro, Sta. Barbara und Puccianello nach Caserta. Oder ein Besuch der Umgebung von Sparanise — Calvi Risorta — Pignataro. Geht man von Pignataro Maggiore nach Giano- Vetusto und dann über Camigliano, Bellona zum Volturno, um in Capua oder Sta. Maria Vetere die Bahn wieder zu erreichen, ist auch ohne besondere Schwierigkeit ein Bild von der Struktur der Randketten zu erlangen. -Fiir diese und ähnliche Ausflüge ist Anschaffung von Blatt Nr.172 (Caserta) der topographischen Karte 1:100000 empfehlenswerth und der Aufsatz von A. Scacchi: Il vulcanetto di Puccianello zu lesen. (Mem. Accad. d. sc. fis. e mat. Napoli III. […]","sp":185,"u2":["Tufo grigio campano - ignimbrite","Pleistozän","Kampanischer Ignimbrit (39 800 J.)","#9684a0"]},{"id":150,"k":7,"r":"Kampanischer Tuff: Maddaloni – Caserta – Calvi","s":185,"t":"A","b":"Von Pignataro über Giano Vetusto, Camigliano und Bellona zum Volturno; Bild der Randketten","n":"Bellona am Volturno","z":"Große Tuffsteinbrüche im Umland","zg":"eingeschränkt","sg":"–","g":"Kampanischer Ignimbrit (graue Fazies), am Fuß der Kalkberge","l":"genau","la":41.161,"lo":14.235,"c":"Bellona (CE)","ex":"[…] Oder ein Besuch der Umgebung von Sparanise — Calvi Risorta — Pignataro. Geht man von Pignataro Maggiore nach Giano- Vetusto und dann über Camigliano, Bellona zum Volturno, um in Capua oder Sta. Maria Vetere die Bahn wieder zu erreichen, ist auch ohne besondere Schwierigkeit ein Bild von der Struktur der Randketten zu erlangen. -Fiir diese und ähnliche Ausflüge ist Anschaffung von Blatt Nr.172 (Caserta) der topographischen Karte 1:100000 empfehlenswerth und der Aufsatz von A. Scacchi: Il vulcanetto di Puccianello zu lesen. (Mem. Accad. d. sc. fis. e mat. Napoli III. […]","sp":185,"u2":["Tufo grigio campano - ignimbrite","Pleistozän","Kampanischer Ignimbrit (39 800 J.)","#9684a0"]},{"id":151,"k":8,"r":"Castellammare – Vico Equense – Sorrent","s":189,"t":"K","b":"Die Klippen Li Galli und Scoglio di Vivaro (Sireneninseln) sind die höchsten Teile eines schmalen abgesunkenen Streifens vor der Südküste","n":"Li Galli (Sirenusen) vor Positano","z":"Privatinseln, Umgebung Schutzgebiet","zg":"geschlossen","sg":"Area Marina Protetta Punta Campanella","g":"Kalkschollen an den Längsbrüchen der Südküste","l":"genau","la":40.581,"lo":14.433,"c":"Positano (SA)","ex":"[…] Nach Walther. dritter folgt dem Ufer von Positano bis zur Punta Campanella. Diese Längsbrüche verursachen am Südstrande ein treppenförmiges Absetzen und Verschwinden der Schollen; denn die vor der Kiiste liegenden Klippen Li Galli und Scoglio di Vivaro (die sog. Sireneninseln) sind als höchste Theile eines schmalen abgesunkenen Streifens aufzufassen, an dessen Südseite es abermals steil zu grösseren Tiefen im Golfe hinabgeht (Fig. 21). Diesen Längsbrüchen entspricht sicher ein ähnliches System an der Nord- Seite, wenigstens deutet der Verlauf der Kette südlich vom Vesuv darauf hin. […]","sp":189},{"id":152,"k":8,"r":"Castellammare – Vico Equense – Sorrent","s":190,"t":"S","b":"Castellammare am Fuß einer mächtigen Kette mit dem Monte S. Angelo a tre pizzi (1542 m), Scholle aus Unterkreidekalken","n":"Monte Molare (Monte San Michele, 1444 m) und Monte Faito","z":"Höchster Gipfel der Halbinsel. Die Seilbahn von Castellammare auf den Faito steht seit dem Absturz einer Kabine am 17. April 2025 still","zg":"frei","sg":"Parco Regionale dei Monti Lattari","g":"Unterkreide-Rudistenkalk (Urgon) der Monti Lattari; Deeckes Höhenangabe ist veraltet","l":"genau","la":40.6519,"lo":14.4878,"c":"Vico Equense (NA)","ex":"[…] Da die wichtigsten stratigraphischen Angaben bereits in der allgemeinen Einleitung gemacht sind, mögen hier gleich einige Excursionen folgen, die über den geologischen Charakter der Gegend am besten Aufschluss ertheilen. In Castellammare di Stabia, das in der Nähe der 79n.Chr. durch den Vesuv verschütteten römischen Stadt Stabiae gelegen ist, befindet man sich am Fusse einer mächtigen, im Mte. S. Angelo a tre pizzi 1542 m aufragenden Kette. Dieselbe stellt . eine im Nordosten und Südwesten durch Querspalten herausgeschnittene . Scholle von untercretacischen Kalken dar. […]","sp":190,"u1":["Calcari con requienie e gasteropodi","CRQ","Berriasium bis Aptium","Sorrento","Valanginium","#99d36a"],"u2":["Calcari e calcari dolomitici","Neokom","Berriasium","#8ccd60"]},{"id":153,"k":8,"r":"Castellammare – Vico Equense – Sorrent","s":190,"t":"A","b":"Senke von Gragnano mit dem Monte Pendolo aus Hippuritenkalk; Bims von Pompeji als fruchtbarer Untergrund","n":"Gragnano mit dem Monte Pendolo","z":"Nudelstadt (Pasta di Gragnano g. g. A.), Weinbau","zg":"frei","sg":"Parco Regionale dei Monti Lattari","g":"Oberkreide-Kalk, mit Vesuvbims überdeckt","l":"geschätzt","la":40.6935,"lo":14.513,"c":"Gragnano (NA)","ex":"[…] Diesen Längsbrüchen entspricht sicher ein ähnliches System an der Nord- Seite, wenigstens deutet der Verlauf der Kette südlich vom Vesuv darauf hin. Diese Längsspalten setzen an mehreren grossen Querbrüchen ab, denen man im Süden die Vorsprünge des Capo Sottile und C. d’Orso verdankt, ferner den Einschnitt von La Cava, die Bucht von Gragnano, die Steilwände des Mte. S. Angelo gegen Sorrento hin, die Grabensenkung von Sorrento und wahrscheinlich auch die Meeresstrasse zwischen der Halbinsel und Capri. Die Verschiebungen sind z. Th. sehr bedeutend und betragen stellenweise mehr als 1000 m. […]","sp":190,"u1":["Piroclastiti sciolte","VEFl","Oberpleistozän bis Holozän","Sorrento","Pyroklastite, Holozän","#f09660"],"u2":["Conoidi","Attuale","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"]},{"id":154,"k":8,"r":"Castellammare – Vico Equense – Sorrent","s":191,"t":"F","b":"Schwach schwefelhaltige Quellen und Eisensäuerlinge von Castellammare, zu Mineralbädern gefasst, z. T. im Meeresniveau","n":"Mineralquellen von Castellammare di Stabia (Terme di Stabia, Acqua della Madonna)","z":"Die Thermen sind seit Jahren geschlossen; einzelne Quellen sind als öffentliche Brunnen zugänglich","zg":"eingeschränkt","sg":"–","g":"Mineralwässer aus Störungen im Kreidekalk","l":"geschätzt","la":40.6985,"lo":14.482,"c":"Castellammare di Stabia (NA)","ex":"[…] Den langen Kamm nehmen die dem Urgon angehörigen Rudistenkalke mit einzelnen Linsen von Orbitolinenmergeln ein, sie ziehen sich am Mte. Cepparica und Mte. Faito zur Hauptspitze in die Höhe, bis sie durch die grosse Längsverwerfung oberhalb Positano abgeschnitten werden. Bei Castellammare entspringen schwache schwefelhaltige Quellen und Eisensäuerlinge, die zu Mineralbädern gefasst sind und vielfach benutzt werden. Sie treten aus dem Kalkfelsen oder Spalten z. Th. im Meeresniveau heraus und dürften Auslaugungswasser der Umgebung sein. […]","sp":191,"u1":["Alluvioni di conoide e depositi fluviali","PNIb","Holozän","Sorrento","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"],"u2":["Duna - sabbie eoliche","Holozän","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"]},{"id":155,"k":8,"r":"Castellammare – Vico Equense – Sorrent","s":191,"t":"A","b":"Große Steinbrüche bei Capo d’Orlando an der Straße nach Vico: bituminöse Plattenkalke mit trefflich erhaltenen Fischen, darüber Orbitolinenmergel und Rudistenkalk","n":"Capo d’Orlando / Pozzano, Castellammare di Stabia","z":"Abbau eingestellt; Straße SS 145 am Fuß","zg":"eingeschränkt","sg":"Parco Regionale dei Monti Lattari","g":"Fischführende Plattenkalke der Unterkreide","l":"geschätzt","la":40.6855,"lo":14.459,"c":"Castellammare di Stabia (NA)","ex":"[…] Sie treten aus dem Kalkfelsen oder Spalten z. Th. im Meeresniveau heraus und dürften Auslaugungswasser der Umgebung sein. An der Strasse nach Vico sind bei Capo d’Orlando grosse Steinbrüche eröffnet, in denen sich früher in bituminösen Plattenkalken zahlreiche, trefflich erhaltene Fische gefunden haben. Die Bänke werden leider z. Th. nicht mehr abgebaut. Oberhalb der Plattenkalke erscheinen Kalke und Breccien, in denen Orbitolinenmergel eingeschaltet sind. Guiscardi erwähnte von dort Janira atava und andere Zweischaler der unteren Kreide. Noch etwas höher hinauf am Gehänge kommen Rudistenkalke zum Vorschein, aus denen aber brauchbare Versteinerungen nicht zu gewinnen sind. […]","sp":191,"u1":["Calcari con requienie e gasteropodi","CRQ","Berriasium bis Aptium","Sorrento","Valanginium","#99d36a"],"u2":["Tufo Campano","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":156,"k":8,"r":"Castellammare – Vico Equense – Sorrent","s":192,"t":"A","b":"Tief eingeschnittenes Tal von Vico Equense, unten von kampanischem Tuff erfüllt; Querbruch mit rund 1000 m Versatz","n":"Vico Equense","z":"Ort auf der Tuffterrasse über dem Meer","zg":"frei","sg":"Parco Regionale dei Monti Lattari","g":"Querstörung der Monti Lattari, Füllung aus Kampanischem Ignimbrit","l":"genau","la":40.6625,"lo":14.427,"c":"Vico Equense (NA)","ex":"[…] Noch etwas höher hinauf am Gehänge kommen Rudistenkalke zum Vorschein, aus denen aber brauchbare Versteinerungen nicht zu gewinnen sind. Sobald man um das Vorgebirge herumgekommen ist, sieht man die Steilwände des Mte. Cepparica über dem tief eingeschnittenen Thale von Vico Equense hervorragen. Dieses letztere wird am unteren Ende von dem campanischen Tuffe erfüllt und entspricht einem Querbruche, der die Schichten des Mte. S. Angelo um ca. 1000 m verworfen hat. Jenseits Vico steigt die Strasse zum Vorgebirge des Mte. Scutolo hinauf. […]","sp":192,"u1":["Piroclastiti sciolte","VEFl","Oberpleistozän bis Holozän","Sorrento","Pyroklastite, Holozän","#f09660"],"u2":["Materiali piroclastici","Pleistozän bis Holozän","Pyroklastite, Pleistozän (älter oder nicht näher datiert)","#aa5c46"]},{"id":157,"k":8,"r":"Castellammare – Vico Equense – Sorrent","s":192,"t":"S","b":"Monte Scutolo mit Monte di Camaldoli und Monte Commune: parallele Scholle, die steil zum Piano di Sorrento abbricht; Bruchlinie zum Vico Alvano","n":"Punta Scutolo und Monte Comune, Meta/Vico Equense","z":"Vorgebirge an der Küstenstraße","zg":"frei","sg":"Parco Regionale dei Monti Lattari","g":"Kreidekalk-Scholle zwischen Querbrüchen","l":"geschätzt","la":40.652,"lo":14.415,"c":"Vico Equense (NA)","ex":"[…] Dieses letztere wird am unteren Ende von dem campanischen Tuffe erfüllt und entspricht einem Querbruche, der die Schichten des Mte. S. Angelo um ca. 1000 m verworfen hat. Jenseits Vico steigt die Strasse zum Vorgebirge des Mte. Scutolo hinauf. Dieser mit dem Mte. di Camaldoli und dem Mte. Commune zusammen stellt eine dem Mte. S. Angelo analoge und parallele Scholle dar, die zum Piano di Sorrento gleichfalls steil, aber weit weniger hoch abbricht. Die Bruchlinie ist gut im Terrain markirt und läuft zum Vico Alvano hinauf (Fig. 22). […]","sp":192,"u1":["Piroclastiti sciolte","VEFl","Oberpleistozän bis Holozän","Sorrento","Pyroklastite, Holozän","#f09660"],"u2":["Materiali piroclastici","Pleistozän bis Holozän","Pyroklastite, Pleistozän (älter oder nicht näher datiert)","#aa5c46"]},{"id":158,"k":8,"r":"Castellammare – Vico Equense – Sorrent","s":192,"t":"K","b":"Piano di Sorrento: wellige Ebene aus grauem kampanischem Tuff mit schroffen Wänden zur See, Schluchten, künstliche Grotten; Abbrüche verschlangen u. a. Tassos Geburtshaus","n":"Steilküste von Sorrent (Marina Piccola, Vallone dei Mulini)","z":"Klippen mit Aufzügen und Treppen; Steinschlag- und Abbruchgefahr besteht weiterhin","zg":"frei","sg":"Area Marina Protetta Punta Campanella","g":"Kampanischer Ignimbrit, bis über 50 m mächtig","l":"genau","la":40.6275,"lo":14.3755,"c":"Sorrento (NA)","ex":"[…] Jenseits Vico steigt die Strasse zum Vorgebirge des Mte. Scutolo hinauf. Dieser mit dem Mte. di Camaldoli und dem Mte. Commune zusammen stellt eine dem Mte. S. Angelo analoge und parallele Scholle dar, die zum Piano di Sorrento gleichfalls steil, aber weit weniger hoch abbricht. Die Bruchlinie ist gut im Terrain markirt und läuft zum Vico Alvano hinauf (Fig. 22). Das Piano di Sorrento, eine ca. 51/, km lange und im Durchschnitt 11/, km breite, in die Berge eingesenkte, schwach wellige Ebene besteht aus grauen campanischen Tuffen, welche von Süden nach Norden an Mächtigkeit zunehmen und mit schroffen Wänden zur See abstürzen. […]","sp":192,"u1":["Tufo grigio campano (Ignimbrite Campana Auctt.)","TGC","Holozän","Sorrento","Kampanischer Ignimbrit (39 800 J.)","#9684a0"],"u2":["Materiali piroclastici","Pleistozän bis Holozän","Pyroklastite, Pleistozän (älter oder nicht näher datiert)","#aa5c46"]},{"id":159,"k":8,"r":"Castellammare – Vico Equense – Sorrent","s":193,"t":"K","b":"Am Strand zwischen Coccumella und Sorrento verschiedenartige Augittrachyt-Schlacken und Auswürflinge","n":"Marina di Cassano / Coccumella, Sant’Agnello","z":"Badeplätze unter der Tuffklippe","zg":"frei","sg":"Area Marina Protetta Punta Campanella","g":"Schlackenlagen (Schiuma) im Kampanischen Ignimbrit","l":"geschätzt","la":40.634,"lo":14.3955,"c":"Sant'Agnello (NA)","ex":"[…] Zwischen . Coccumella und Sorrento lassen sich am Strande die Gesteine sehr gut studiren und aus ihnen die verschiedenartigen Augittrachytschlacken und Auswürflinge sammeln. Weiter gegen den Berg hinauf nimmt die Dicke der Tufflagen ab und an verschiedenen Stellen tritt spornartig oder in den Schluchten als schroffe Wandung der unterliegende Kreidekalk heraus. So reicht im Mte. S. Angelo di Sorrento oberhalb S. Agnello wieder der geschichtete, weissgraue Kalk bis zur Oberfläche und dürfte, was schon Puggaard 1856 andeutete, als ein durch zwei untergeordnete Verwerfungen bedingter, keilförmiger Horst aufzufassen sein. […]","sp":193,"u1":["Piroclastiti sciolte","VEFl","Oberpleistozän bis Holozän","Sorrento","Pyroklastite, Holozän","#f09660"],"u2":["Materiali eluviali recenti","Holozän","Hangschutt, Rutschmassen","#ecdeba"]},{"id":160,"k":8,"r":"Castellammare – Vico Equense – Sorrent","s":194,"t":"A","b":"Im Monte S. Angelo di Sorrento oberhalb S. Agnello reicht geschichteter Kreidekalk an die Oberfläche, ein keilförmiger Horst","n":"Kalksporn oberhalb von Sant’Agnello","z":"Lage geschätzt","zg":"unklar","sg":"Parco Regionale dei Monti Lattari","g":"Kreidekalk-Horst unter der Tuffdecke","l":"geschätzt","la":40.624,"lo":14.399,"c":"Sant'Agnello (NA)","ex":"[…] Weiter gegen den Berg hinauf nimmt die Dicke der Tufflagen ab und an verschiedenen Stellen tritt spornartig oder in den Schluchten als schroffe Wandung der unterliegende Kreidekalk heraus. So reicht im Mte. S. Angelo di Sorrento oberhalb S. Agnello wieder der geschichtete, weissgraue Kalk bis zur Oberfläche und dürfte, was schon Puggaard 1856 andeutete, als ein durch zwei untergeordnete Verwerfungen bedingter, keilförmiger Horst aufzufassen sein. Durch diesen Sporn zerfällt die Ebene in zwei ungleiche Theile, deren westlicher kleinerer die nähere Umgebung Sorrents umfasst. […]","sp":194,"u1":["Piroclastiti sciolte","VEFl","Oberpleistozän bis Holozän","Sorrento","Pyroklastite, Holozän","#f09660"],"u2":["Facies calcarea di scogliera","Turonium","Turonium","#bfde53"]},{"id":161,"k":8,"r":"Sorrent – Massa Lubrense – S. Agata","s":195,"t":"A","b":"Straße Sorrento–Massa: am Ortsausgang Grenze des Tuffs und Querverwerfung, dann bei Lo Capo eozäne Sandsteinplatten; in Gartenmauern kleine Nummuliten und Orbitoliten","n":"Capo di Sorrento mit den Bagni della Regina Giovanna","z":"Römische Villa des Pollius Felix und Felsbecken am Kap, Fußweg","zg":"frei","sg":"Area Marina Protetta Punta Campanella","g":"Eozäner Flysch (Macigno) über Kreidekalk","l":"genau","la":40.6305,"lo":14.351,"c":"Sorrento (NA)","ex":"[…] Wer von Sorrento auf der Fahrstrasse nach Massa Lubrense wandert, passirt dicht am Ort am Fusse der Kalkwand die Grenze des vulkanischen Tuffs und eine Querverwerfung. Man steigt über die deutlich geschichteten Kreidekalke nach Lo Capo langsam hinab und gelangt in das Gebiet der eocänen Ablagerungen, aus denen hie und da die Unterlage hervorschaut. Die braunen Sandsteinplatten und glimmerig sandigen Schiefer mit untergeordneten Kalkeinlagerungen herrschen überall vor und werden in den Bachrissen oder bei Schürfen mit ihren Faltungen oder Stauchungen sichtbag. Die Zäune und Mauern der Oliven und Weingärten sind aus ihnen aufgebaut; auch dienen sie an manchen Stellen als Dachpfannen. […]","sp":195,"u1":["Piroclastiti sciolte","VEFl","Oberpleistozän bis Holozän","Sorrento","Pyroklastite, Holozän","#f09660"],"u2":["Materiali piroclastici","Pleistozän bis Holozän","Pyroklastite, Pleistozän (älter oder nicht näher datiert)","#aa5c46"]},{"id":162,"k":8,"r":"Sorrent – Massa Lubrense – S. Agata","s":195,"t":"A","b":"Monte Costanzo: Hippuritenkalk, bei Termini an einer Verwerfung abgesetzt, die sich zur Marina del Cantone verfolgen lässt","n":"Monte San Costanzo (497 m) und Termini, Massa Lubrense","z":"Kapelle auf dem Gipfel, Wanderwege zur Punta Campanella","zg":"frei","sg":"Area Marina Protetta Punta Campanella","g":"Oberkreide-Kalk, Störung Termini–Marina del Cantone","l":"genau","la":40.58,"lo":14.34,"c":"Massa Lubrense (NA)","ex":"[…] Wer diese Mauern durchmustert und seine Aufmerksamkeit auf die etwas kalkigen Sandsteinplatten richtet, wird auf diesen vereinzelt Reste von kleinen Nummuliten und Orbituliten finden; auch Alveolinenkalke kommen gelegentlich vor. Die ganze fruchtbare, wasserreiche Niederung mit ihren Hügeln besteht bis nach Termini und dem Mte. Costanzo aus diesen Schichten. Am letzteren treten Hippuritenkalke zu Tage, die bei Termini an einer Verwerfung gegen Osten absetzen. Dieser Bruch ist sehr deutlich ausgeprägt und lässt sich am Steilufer der Südküste zur Marina del Cantone hinab verfolgen. […]","sp":195,"u1":["Calcari a radiolitidi","RDT","Aptium bis Santonium","Sorrento","Aptium","#bfe48a"],"u2":["Serie comprensiva","Valanginium bis Cenomanium","Valanginium","#99d36a"]},{"id":163,"k":8,"r":"Sorrent – Massa Lubrense – S. Agata","s":196,"t":"S","b":"S. Agata auf kleiner Hochfläche mit kampanischem Tuff; der Hügel mit dem Kloster Il Deserto aus Kreidekalk; Strada delle Torri mit prächtiger Aussicht","n":"Sant’Agata sui Due Golfi mit dem Monastero del Deserto","z":"Aussichtsterrasse des Klosters über beide Golfe","zg":"frei","sg":"Parco Regionale dei Monti Lattari","g":"Tuffplateau über Kreidekalk","l":"genau","la":40.6015,"lo":14.369,"c":"Massa Lubrense (NA)","ex":"[…] Bei S. Agata, das auf einer kleinen Hochfläche steht, herrscht wieder der campanische Tuff vor. Der Hügel mit dem Deserto genannten Kloster besteht dagegen aus Kreidekalken. Diese durchquert man auf den Fusswegen von S. Agata nach Sorrento hinab. Die Tour ist eine bequeme Tageswanderung, bei welcher man, wenn der Weg auf der Höhe, die sog. Strada delle Torri, von Termini nach S. Agata eingeschlagen wird, auch prächtige Aussicht auf die schroffen Wände der Südküste und die vorgelagerten Inseln geniesst. […]","sp":196,"u1":["Arenarie del deserto","ADD","Serravallium bis Tortonium","Sorrento","Langhium","#ffff4d"],"u2":["Facies calcarea","Langhium bis Aquitanium","Langhium","#ffff4d"]},{"id":164,"k":8,"r":"Amalfiküste – Tramonti – La Cava","s":196,"t":"A","b":"Klotz des Vico Alvano (643 m) aus fossilreichem Hippuritenkalk mit Sphaeruliten; auf dem Sattel Macigno","n":"Monte Vico Alvano, Colli di San Pietro (Piano di Sorrento)","z":"Wanderwege; Straße Meta–Positano über den Sattel","zg":"frei","sg":"Parco Regionale dei Monti Lattari","g":"Rudisten-Kalk der Oberkreide","l":"geschätzt","la":40.617,"lo":14.423,"c":"Piano di Sorrento (NA)","ex":"[…] Die landschaftlich reizende und grossartige Fahrstrasse von Sorrento nach ‘Amalfi bietet geologisch nicht viel Interessantes, da sie sich in der Hauptsache in Gehängeschutt und Breccien, sowie in den einförmigen Kreidekalken und Triasschichten bewegt. Von Meta aus führt sie aus dem vulkanischen Tuff der Ebene zu dem merkwürdig gestalteten Klotz des Vico Alvano (643 m) hinan. Oben auf der Einsattelung bei der grossen‘ Serpentine befindet man sich in Macigno. Der Vico Alvano setzt sich aus fossilreichem Hippuritenkalk zusammen. Die Trümmer und Fragmente dieser Zweischaler erfüllen manche Bänke derart, dass sie kaum aus irgend etwas Anderem bestehen. […]","sp":196,"u1":["Arenarie del deserto","ADD","Serravallium bis Tortonium","Sorrento","Langhium","#ffff4d"],"u2":["Facies calcarea","Langhium bis Aquitanium","Langhium","#ffff4d"]},{"id":165,"k":8,"r":"Amalfiküste – Tramonti – La Cava","s":197,"t":"K","b":"Bucht von Positano: Querspalte trifft auf einen Längsbruch der Südküste","n":"Positano","z":"Touristenort; Hänge bergsturz- und murgefährdet","zg":"frei","sg":"UNESCO-Welterbe Costiera Amalfitana","g":"Kreuzung von Quer- und Längsstörungen","l":"genau","la":40.6281,"lo":14.4848,"c":"Positano (SA)","ex":"[…] Dann steigt die Strasse in Windungen auf der Südseite hinunter und läuft ziemlich eben am Gehänge des Mte. di Chiosse entlang. Etwa bei dem Vorgebirge Lo Germano setzt der Bruch von Meta ‚hindurch, und von dort an herrschen am Fusse des Mte. Commune Kalke der unteren Kreide mit einzelnen Rudistenbänken und Einlagerungen von Orbitolinenmergeln bis Positano vor. Das bei diesem Orte ausmündende, kurze Thal entspricht dem Bruche von Vico Equense und die Gehänge zwischen Positano und Prajano mit ihren Oliven- und Rebenpflanzungen sind bereits Theile der grossen Scholle des Mte. S. Angelo a tre pizzi. Viele Gehängeschotter und mächtige Breccien verhüllen das eigentlich anstehende Gestein. […]","sp":197,"u1":["Calcari con Campbeliella e Kurnubia","CMM1","Kimmeridgium bis Berriasium","Sorrento","Tithonium","#d9f1f7"],"u2":["Calcari e calcari dolomitici","Neokom","Berriasium","#8ccd60"]},{"id":166,"k":8,"r":"Amalfiküste – Tramonti – La Cava","s":197,"t":"K","b":"Capo Sottile bei Vettica-Prajano, ebenfalls an Längs- und Querbruch; östlich am Strand von Prajano tritt Triasdolomit unter der Kreide hervor","n":"Capo Sottile und Praiano","z":"Steilküste mit Badebuchten","zg":"frei","sg":"UNESCO-Welterbe Costiera Amalfitana","g":"Hauptdolomit (Obertrias) unter Kreide","l":"geschätzt","la":40.6095,"lo":14.531,"c":"Praiano (SA)","ex":"[…] Die Bucht von Positano entsteht, wie oben gesagt, durch das Zusammentreffen der Querspalte mit einem Längsbruche der Südküste. Dies wiederholt sich am Capo Sottile bei Vettica-Prajano. Oestlich am Strande von Prajano beginnt unter der Kreide der Triasdolomit hervorzutreten, der die übrige Küste bis nach Vietri zusammensetzt und in den Bergen von Amalfi — Majori—La Cava das hauptsächlichste Gestein ist. Seine Eigenschaften sind oben S. 19 ge- Golfo di Salerno Plateau di Ravello u ER > & 4:50.000 Fig. 23. Profil durch die Basis des Plateau von Ravello. Unten Trias, darüber Kreide. Nach Böse. schildert. […]","sp":197,"u1":["Calcari oolitici ed oncolitici","CDO","Toarcium bis Callovium","Sorrento","Pliensbachium","#80c5dd"],"u2":["Calcari e calcari dolomitici grigi","Lias","Rhätium","#e3b9db"]},{"id":167,"k":8,"r":"Amalfiküste – Tramonti – La Cava","s":198,"t":"S","b":"Stufenförmiges Abbrechen mit Tuff- und Schuttterrassen, die wichtigsten von Agerola, Ravello und Scala","n":"Terrassen von Agerola, Ravello und Scala","z":"Agerola: Start des Sentiero degli Dei; Ravello mit Villa Rufolo und Villa Cimbrone","zg":"frei","sg":"UNESCO-Welterbe Costiera Amalfitana","g":"Bruchstufen der Karbonatplattform mit Tuffauflage","l":"genau","la":40.6492,"lo":14.6115,"c":"Ravello (SA)","ex":"[…] Nach Böse. schildert. Charakteristisch für das Gelände ist das stufenförmige Abbrechen, das kleine von Tuff und Gehängeschutt aufgefüllte, ausgeebnete Terrassen erzeugt, deren wichtigste die von Agerola, Ravello und Scala sind. Am Meeresstrande und in den Felswänden der Steilküste kommt man an vielen Höhlen und Grotten mit mehr oder minder schönen Stalaktiten vorüber. Als Beispiel diene die Grotta di S. Cristofano bei Amalfi. Die Bäche haben in die landeinwärts fallenden Schichten durch die Schichtenköpfe schmale romantische Thäler eingenagt, ‚von denen das berühmte Mühlenthal eines der vielen ist. Auch die Scala und Ravello trennende Schlucht verdankt der Erosion ihre Entstehung. […]","sp":198,"u1":["Deposito vulcanoclastico","l","Mittelpleistozän bis Holozän","Sorrento","Pyroklastite, Holozän","#f09660"],"u2":["Calcari e calcari dolomitici grigi","Lias","Rhätium","#e3b9db"]},{"id":168,"k":8,"r":"Amalfiküste – Tramonti – La Cava","s":198,"t":"K","b":"Höhlen und Grotten mit Stalaktiten in der Steilküste, z. B. die Grotta di S. Cristofano bei Amalfi","n":"Küstenhöhlen bei Amalfi (heute bekannt: Grotta dello Smeraldo, Conca dei Marini)","z":"Die Smaragdgrotte wurde erst 1932 entdeckt; Bootsbesuch","zg":"frei","sg":"UNESCO-Welterbe Costiera Amalfitana","g":"Karsthöhle mit untergetauchten Tropfsteinen (Beleg für Meeresspiegelanstieg)","l":"geschätzt","la":40.615,"lo":14.564,"c":"Conca dei Marini (SA)","ex":"[…] Am Meeresstrande und in den Felswänden der Steilküste kommt man an vielen Höhlen und Grotten mit mehr oder minder schönen Stalaktiten vorüber. Als Beispiel diene die Grotta di S. Cristofano bei Amalfi. Die Bäche haben in die landeinwärts fallenden Schichten durch die Schichtenköpfe schmale romantische Thäler eingenagt, ‚von denen das berühmte Mühlenthal eines der vielen ist. Auch die Scala und Ravello trennende Schlucht verdankt der Erosion ihre Entstehung. […]","sp":198},{"id":169,"k":8,"r":"Amalfiküste – Tramonti – La Cava","s":199,"t":"K","b":"Die Bäche haben schmale romantische Täler eingenagt, darunter das berühmte Mühlenthal; die Schlucht zwischen Scala und Ravello","n":"Valle dei Mulini und Riserva Naturale Valle delle Ferriere, Amalfi/Scala","z":"Papiermühlen-Museum; Naturreservat mit Farnrelikt (Woodwardia radicans), Wanderweg","zg":"frei","sg":"Riserva Naturale Statale Valle delle Ferriere","g":"Erosionstal im Dolomit und Kalk","l":"genau","la":40.648,"lo":14.594,"c":"Scala (SA)","ex":"‚von denen das berühmte Mühlenthal eines der vielen ist. Auch die Scala und Ravello trennende Schlucht verdankt der Erosion ihre Entstehung. An dieser Küstenstrecke müssen wiederholt erhebliche Abbrüche stattgefunden haben, sei es dass Erdstösse lose Massen zum Abrutschen brachten, sei es dass die Wogen den Felsen unterwuschen und während eines Sturmes bei hohem Seegang die Katastrophe eintrat. Amalfi ist wiederholt durch solches Unheil heimgesucht. Im 14. Jahrhundert soll bei heftigem Südwind die Unterstadt von dem Meere verschlungen sein. […]","sp":199,"u1":["Calcari a Palaedasycladus","CPL","Hettangium bis Toarcium","Sorrento","Norium","#d6aad3"],"u2":["Calcari e calcari dolomitici grigi","Lias","Rhätium","#e3b9db"]},{"id":170,"k":8,"r":"Amalfiküste – Tramonti – La Cava","s":199,"t":"O","b":"Amalfi wiederholt von Abbrüchen heimgesucht: Unterstadt im 14. Jh. vom Meer verschlungen; vor wenigen Jahren rutschte ein Stück des Vorsprungs mit dem Kapuzinerkloster ins Meer","n":"Ehem. Kapuzinerkloster, heute Hotel Convento di Amalfi","z":"Felssturz vom 22. Dezember 1899; das Kloster ist heute ein Hotel","zg":"eingeschränkt","sg":"UNESCO-Welterbe Costiera Amalfitana","g":"Felsstürze an der Steilküste","l":"genau","la":40.6358,"lo":14.5975,"c":"Amalfi (SA)","ex":"[…] Im 14. Jahrhundert soll bei heftigem Südwind die Unterstadt von dem Meere verschlungen sein. Aehnliches wird aus dem 11. Jahrhundert berichtet, und vor wenigen Jahren rutschte ein Stück des Vorsprunges, auf dem das Kapuzinerkloster steht, in das Meer hinab, bis hoch hinauf die Häuser durch Risse und Sprünge in Mitleidenschaft ziehend. Wer von Amalfi nach Vietri fährt oder geht, bleibt auf dieser ganzen Strecke im Hauptdolomit, dessen aschgraue oder dunkelgraue dolomitische Felspartieen überall an der Strasse, z. Th. übersintert sichtbar sind. Bei Le Erchie kommen Gerwillia exilis Stopp. und einige andere schlecht erhaltene Fossilien vor (Fig. 20). […]","sp":199,"u1":["Calcari oolitici ed oncolitici","CDO","Toarcium bis Callovium","Sorrento","Pliensbachium","#80c5dd"],"u2":["Calcari e calcari dolomitici grigi","Lias","Rhätium","#e3b9db"]},{"id":171,"k":8,"r":"Amalfiküste – Tramonti – La Cava","s":199,"t":"A","b":"Zwischen Amalfi und Vietri durchweg Hauptdolomit; bei Le Erchie Gervillia exilis und andere Fossilien","n":"Erchie, Maiori","z":"Kleiner Küstenort an der SS 163","zg":"frei","sg":"UNESCO-Welterbe Costiera Amalfitana","g":"Hauptdolomit (Norium) mit Muscheln","l":"genau","la":40.6455,"lo":14.6905,"c":"Maiori (SA)","ex":"[…] Wer von Amalfi nach Vietri fährt oder geht, bleibt auf dieser ganzen Strecke im Hauptdolomit, dessen aschgraue oder dunkelgraue dolomitische Felspartieen überall an der Strasse, z. Th. übersintert sichtbar sind. Bei Le Erchie kommen Gerwillia exilis Stopp. und einige andere schlecht erhaltene Fossilien vor (Fig. 20). Das weite Tramonti-Thal, welches vor Majori nach Norden führt, ist ein Querspaltenthal zwischen zwei Schollen. Sein Boden ist mit den verschiedenen vulkanischen Tuffen aufgefüllt. Wandert man das- - selbe hinauf, so bewegt man sich fast ausschliesslich in letzteren .und in mächtigen Gehängeschottern. […]","sp":199,"u1":["membro delle dolomie bioclastiche laminate","DBS3","Unterjura bis Rhätium","Salerno","Norium","#d6aad3"],"u2":["Dolomie e calcari dolomitici","unteres Lias bis Rhätium","Rhätium","#e3b9db"]},{"id":172,"k":8,"r":"Amalfiküste – Tramonti – La Cava","s":200,"t":"S","b":"Tramonti-Tal (Querspaltental) mit Tuffen und Schottern; am Torre di Chiunzo Trias unter nach Norden fallendem Kreidekalk, herrlicher Blick auf Ebene und Vesuv","n":"Valico di Chiunzo mit dem Torre di Chiunzo","z":"Pass mit Wachturm und Aussicht","zg":"frei","sg":"Parco Regionale dei Monti Lattari","g":"Grenze Hauptdolomit/Kreidekalk","l":"genau","la":40.7135,"lo":14.6115,"c":"Tramonti (SA)","ex":"[…] Wandert man das- - selbe hinauf, so bewegt man sich fast ausschliesslich in letzteren .und in mächtigen Gehängeschottern. Am TorrediChiunzo erscheint unten Trias, darüber nach N. fallender Kreidekalk. Der Blick auf die .campanische Ebene und den Vesuv ist herrlich. Von der Ortschaft Tramonti .kann man aber auch ‘auf Saumpfaden nach dem Passe zwischen Mte. Pertuso und Mte. Lo Spagnolo gelangen und gegen La Cava niedersteigen. Dabei werden erst Triasdolomite und oben auf dem Passe schmale Linsen von Asphalt in diesen Schichten angetroffen. Links stehen als Hangendes die wohlgeschichteten, 'stark zerbrochenen Kreidekalke mit Rudistenbänken an. […]","sp":200,"u1":["Deposito vulcanoclastico","l","Mittelpleistozän bis Holozän","Sorrento","Pyroklastite, Holozän","#f09660"],"u2":["Alternanze di calcari dolomitici e calcari detritici","Valanginium bis Albium","Valanginium","#99d36a"]},{"id":173,"k":8,"r":"Amalfiküste – Tramonti – La Cava","s":200,"t":"A","b":"Saumpfad von Tramonti zum Pass zwischen Monte Pertuso und Monte Lo Spagnolo: Triasdolomit mit schmalen Asphaltlinsen","n":"Pass zwischen Tramonti und Cava de’ Tirreni","z":"Lage geschätzt; Wanderweg","zg":"unklar","sg":"Parco Regionale dei Monti Lattari","g":"Bitumenlinsen im Hauptdolomit","l":"geschätzt","la":40.705,"lo":14.656,"c":"Tramonti (SA)","ex":"[…] Von der Ortschaft Tramonti .kann man aber auch ‘auf Saumpfaden nach dem Passe zwischen Mte. Pertuso und Mte. Lo Spagnolo gelangen und gegen La Cava niedersteigen. Dabei werden erst Triasdolomite und oben auf dem Passe schmale Linsen von Asphalt in diesen Schichten angetroffen. Links stehen als Hangendes die wohlgeschichteten, 'stark zerbrochenen Kreidekalke mit Rudistenbänken an. Beim Abstieg verhüllt brauner vulkanischer Verwitterungsboden und Schotter alles feste Gestein. Erst bei Corpo di Cava tritt wieder Trias und zwar mit Fossilien zu Tage. A IX. Capri. = da MS uf Capri sind in den letzten 20 Jahren mancherlei geologische Untersuchungen \"=, vorgenommen worden. […]","sp":200,"u1":["Calcari a Palaedasycladus","CPL","Hettangium bis Toarcium","Sorrento","Norium","#d6aad3"],"u2":["Calcari pseudoolitici","unteres Lias bis oberes Lias","Rhätium","#e3b9db"]},{"id":174,"k":8,"r":"Amalfiküste – Tramonti – La Cava","s":200,"t":"A","b":"Bei Corpo di Cava tritt wieder Trias mit Fossilien zutage","n":"Badia della Santissima Trinità, Corpo di Cava","z":"Benediktinerabtei (1011) am Rand der Schlucht des Selano","zg":"frei","sg":"Parco Regionale dei Monti Lattari","g":"Hauptdolomit mit Megalodonten und Gyroporellen","l":"genau","la":40.688,"lo":14.68,"c":"Cava de' Tirreni (SA)","ex":"[…] Beim Abstieg verhüllt brauner vulkanischer Verwitterungsboden und Schotter alles feste Gestein. Erst bei Corpo di Cava tritt wieder Trias und zwar mit Fossilien zu Tage. A IX. Capri. = da MS uf Capri sind in den letzten 20 Jahren mancherlei geologische Untersuchungen \"=, vorgenommen worden. Die erste und wichtigste war die von G. Steinmann, der in den Kalken bei Anacapri Ellipsactinien entdeckte. Dann folgte ein Aufsatz von Oppenheim .und zuletzt zwei von Karsten. Die Oppenheim’schen Beobachtungen sind mehrfach bestritten und haben nicht, wie es anfangs schien, das geologische Problem der Insel völlig gelöst. […]","sp":200,"u1":["membro delle dolomie bioclastiche laminate","DBS3","Unterjura bis Rhätium","Salerno","Norium","#d6aad3"],"u2":["Dolomie e calcari dolomitici","Norium bis unteres Lias","Norium","#d6aad3"]},{"id":175,"k":9,"r":"Insel Capri","s":201,"t":"S","b":"Capri aus zwei Kalkschollen: die östliche gipfelt im Monte Tiberio, beide brechen nach Osten steil ab; auf der Spitze die Verwerfung, an der bei Lo Capo tertiäre Schollen kleben","n":"Monte Tiberio mit der Villa Jovis","z":"Kaiservilla des Tiberius, Ausgrabung zugänglich","zg":"frei","sg":"Kulturdenkmal","g":"Mesozoischer Plattformkalk, Ostrand einer Kippscholle","l":"genau","la":40.5555,"lo":14.2655,"c":"Capri (NA)","ex":"[…] Die Oppenheim’schen Beobachtungen sind mehrfach bestritten und haben nicht, wie es anfangs schien, das geologische Problem der Insel völlig gelöst. Capri besteht, darüber ist man allgemein einig, aus zwei Kalkschollen, einer östlichen, die im Mte. Tiberio culminirt, und einer westlichen mit dem Mte. Solaro. Beide brechen gegen Osten steil ab und verflachen sich gegen Westen. Zwischen ihnen liegt eine Senke, die an der schmalsten Stelle der Insel von deren Nordufer zur Südseite hinüberführt und in den beiden Marinen (Marina grande u. M. piccola) endigt. Dass die Gestalt Capri’s durch Brüche bedingt ist, dürfte gleichfalls nicht mehr zweifelhaft sein. […]","sp":201,"u1":["Calcari ad ellipsactinie","ELL","Kreide bis Jura","Isola Di Capri","Valanginium","#99d36a"],"u2":["Calcari da bianco-cerei a cinerei","Unterkreide bis mittleres Kreide","Berriasium","#8ccd60"]},{"id":176,"k":9,"r":"Insel Capri","s":201,"t":"S","b":"Westliche Scholle mit dem Monte Solaro; am Aufstieg Ellipsactinien und Schratten, oben Unterkreide, die Schichten zum Teil saiger","n":"Monte Solaro (589 m)","z":"Sessellift von Anacapri, Wanderweg über Cetrella","zg":"frei","sg":"–","g":"Kalke von Oberjura bis Unterkreide; Ellipsactinien-Kalk","l":"genau","la":40.549,"lo":14.2265,"c":"Anacapri (NA)","ex":"[…] Die Oppenheim’schen Beobachtungen sind mehrfach bestritten und haben nicht, wie es anfangs schien, das geologische Problem der Insel völlig gelöst. Capri besteht, darüber ist man allgemein einig, aus zwei Kalkschollen, einer östlichen, die im Mte. Tiberio culminirt, und einer westlichen mit dem Mte. Solaro. Beide brechen gegen Osten steil ab und verflachen sich gegen Westen. Zwischen ihnen liegt eine Senke, die an der schmalsten Stelle der Insel von deren Nordufer zur Südseite hinüberführt und in den beiden Marinen (Marina grande u. M. piccola) endigt. Dass die Gestalt Capri’s durch Brüche bedingt ist, dürfte gleichfalls nicht mehr zweifelhaft sein. […]","sp":201,"u1":["Coltre eluvio-colluviale","b2","Holozän","Isola Di Capri","Hangschutt, Rutschmassen","#ecdeba"],"u2":["Facies priva di noduli di selce","Unterkreide bis mittleres Kreide","Berriasium","#8ccd60"]},{"id":177,"k":9,"r":"Insel Capri","s":202,"t":"A","b":"Senke zwischen Marina grande und Marina piccola mit weichen Eozänschichten (Macigno); aus ihnen kommt die einzige Quelle der Insel","n":"Sattel von Capri-Stadt","z":"Ort Capri mit der Piazzetta; Wasser kommt heute per Leitung vom Festland","zg":"frei","sg":"–","g":"Eozäner Flysch im Graben zwischen den Schollen","l":"genau","la":40.5507,"lo":14.2427,"c":"Capri (NA)","ex":"[…] Die mittlere Einsenkung erfüllen weichere Schichten des Eocäns, Macignobildungen mit zwischengeschalteten dünnen Sandsteinbänken. Aus ihnen kommt die einzige Quelle der Insel. Sie lagen ursprünglich auf der ganzen Fläche der Tiberio-Scholle und sind nur an deren unterem Ende vor der Erosion bewahrt geblieben. Zu diesen eocänen Schichten gehören ferner einzelne Fetzen, welche am Nordfusse des Tiberiofelsens bei Lo Capo in steiler Stellung hängen, sowie Alveolinenkalke, welche sich zwischen der Marina grande und der Blauen Grotte in kleinen Schollen und Fetzen zwischen den Gehängebreccien durch ihre fossilen Einschlüsse als tertiäre Kalkbildungen zu erkennen geben. […]","sp":202,"u1":["Calcari ad ellipsactinie","ELL","Kreide bis Jura","Isola Di Capri","Valanginium","#99d36a"],"u2":["Materiali piroclastici rimaneggiati","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":178,"k":9,"r":"Insel Capri","s":202,"t":"A","b":"Beste Fundstelle der Tertiärschichten nach Karsten: Punta del Cantone am Fuß der Solaro-Scholle, Nummuliten und große Alveolinen","n":"Küste am Fuß des Solaro (heutiger Name ungeprüft)","z":"Lage unsicher","zg":"unklar","sg":"–","g":"Eozäne Nummuliten- und Alveolinenkalke","l":"geschätzt","la":40.544,"lo":14.234,"c":"Capri (NA)","ex":"[…] Zu diesen eocänen Schichten gehören ferner einzelne Fetzen, welche am Nordfusse des Tiberiofelsens bei Lo Capo in steiler Stellung hängen, sowie Alveolinenkalke, welche sich zwischen der Marina grande und der Blauen Grotte in kleinen Schollen und Fetzen zwischen den Gehängebreccien durch ihre fossilen Einschlüsse als tertiäre Kalkbildungen zu erkennen geben. Nach Beobachtung Karsten’s ist die beste Fundstätte derartigerSchichten die Punta del Cantone am Fusse der Solaroscholle, wo in einigen Schichten Nummuliten von der Form des N. complanatus sowie grosse Alveolinen, vielleicht A. melo oder A. oblonga vorkommen. […]","sp":202},{"id":179,"k":9,"r":"Insel Capri","s":202,"t":"A","b":"Alveolinenkalke zwischen Marina grande und der Blauen Grotte als kleine Schollen zwischen Gehängebreccien","n":"Nordküste zwischen Marina Grande und Grotta Azzurra","z":"Straße nach Anacapri und Uferpfad","zg":"frei","sg":"–","g":"Eozäne Kalkschollen","l":"geschätzt","la":40.559,"lo":14.225,"c":"Capri (NA)","ex":"[…] Sie lagen ursprünglich auf der ganzen Fläche der Tiberio-Scholle und sind nur an deren unterem Ende vor der Erosion bewahrt geblieben. Zu diesen eocänen Schichten gehören ferner einzelne Fetzen, welche am Nordfusse des Tiberiofelsens bei Lo Capo in steiler Stellung hängen, sowie Alveolinenkalke, welche sich zwischen der Marina grande und der Blauen Grotte in kleinen Schollen und Fetzen zwischen den Gehängebreccien durch ihre fossilen Einschlüsse als tertiäre Kalkbildungen zu erkennen geben. […]","sp":202,"u1":["Brecce di marina piccola","BMP","Holozän bis Oberpleistozän","Isola Di Capri","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"],"u2":["Frane","Holozän","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"]},{"id":180,"k":9,"r":"Insel Capri","s":203,"t":"A","b":"Bei Capo di Sopra am Nordosthang des Tiberio fossilreicher Kalk, in 200 m Höhe Breccie mit Austern und Bohrlöchern von Pholas und Lithodomus","n":"Ortsteil Capo am Weg zur Villa Jovis","z":"Weg Via Tiberio","zg":"frei","sg":"–","g":"Gehobene marine Breccie (Quartär): die Insel lag einst rund 200 m tiefer","l":"geschätzt","la":40.558,"lo":14.258,"c":"Capri (NA)","ex":"[…] Von solchen Fossilstellen machen Oppenheim und Karsten folgende namhaft. Die Felsen am Eingange der Blauen Grotte, bei den Häusern Capo di Sopra am nordöstlichen Gehänge des Mte. Tiberio, bei der Kirche Sta. Maria a Citrella auf dem Mte. Solaro und am Zollhause zwischen Capri und Anacapri. Die Ellipsactinien sind auf der ganzen Insel verbreitet, auf der Westscholle z. B. bei Torre di Guardia längs des östlichen der beiden, nach Anacapri führenden Wege, in den Rollsteinen der Pfade von Anacapri nach Torre Damecuta, sowie östlich von Capri längs des Weges zum Mte. Tiberio und zu den Faraglioni. […]","sp":203,"u1":["Calcari ad ellipsactinie","ELL","Kreide bis Jura","Isola Di Capri","Valanginium","#99d36a"],"u2":["Calcare di capri","Unterkreide bis mittleres Kreide","Berriasium","#8ccd60"]},{"id":181,"k":9,"r":"Insel Capri","s":203,"t":"S","b":"Bei der Kirche S. Maria a Citrella auf dem Solaro vulkanische Tuffe und Nerineenkalke","n":"Eremo di Santa Maria a Cetrella, Anacapri","z":"Einsiedelei mit Aussicht über die Südküste","zg":"frei","sg":"–","g":"Nerineen-Kalk mit Tuffauflage","l":"genau","la":40.5465,"lo":14.2185,"c":"Anacapri (NA)","ex":"[…] Von solchen Fossilstellen machen Oppenheim und Karsten folgende namhaft. Die Felsen am Eingange der Blauen Grotte, bei den Häusern Capo di Sopra am nordöstlichen Gehänge des Mte. Tiberio, bei der Kirche Sta. Maria a Citrella auf dem Mte. Solaro und am Zollhause zwischen Capri und Anacapri. Die Ellipsactinien sind auf der ganzen Insel verbreitet, auf der Westscholle z. B. bei Torre di Guardia längs des östlichen der beiden, nach Anacapri führenden Wege, in den Rollsteinen der Pfade von Anacapri nach Torre Damecuta, sowie östlich von Capri längs des Weges zum Mte. Tiberio und zu den Faraglioni. […]","sp":203,"u1":["Coltre eluvio-colluviale","b2","Holozän","Isola Di Capri","Hangschutt, Rutschmassen","#ecdeba"],"u2":["Materiali piroclastici rimaneggiati","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":182,"k":9,"r":"Insel Capri","s":203,"t":"A","b":"Am Zollhaus zwischen Capri und Anacapri Nerineenkalke","n":"Via Provinciale Capri–Anacapri (Capodimonte)","z":"Die Zollstation besteht nicht mehr","zg":"frei","sg":"–","g":"Nerineen-Kalk","l":"geschätzt","la":40.553,"lo":14.2265,"c":"Anacapri (NA)","ex":"[…] Von solchen Fossilstellen machen Oppenheim und Karsten

 folgende namhaft. Die Felsen am Eingange der Blauen Grotte, bei den Häusern Capo di Sopra am nordöstlichen Gehänge des Mte. Tiberio, bei der Kirche Sta. Maria a Citrella auf dem Mte. Solaro und am Zollhause zwischen Capri und Anacapri. Die Ellipsactinien sind auf der ganzen Insel verbreitet, auf der Westscholle z. B. bei Torre di Guardia längs des östlichen der beiden, nach Anacapri führenden Wege, in den Rollsteinen der Pfade von Anacapri nach Torre Damecuta, sowie östlich von Capri längs des Weges zum Mte. Tiberio und zu den Faraglioni. […]","sp":203,"u1":["Calcari ad ellipsactinie","ELL","Kreide bis Jura","Isola Di Capri","Valanginium","#99d36a"],"u2":["Calcari-compatti","Unterkreide bis mittleres Kreide","Berriasium","#8ccd60"]},{"id":183,"k":9,"r":"Insel Capri","s":203,"t":"H","b":"Rollsteine der Pfade von Anacapri nach Torre Damecuta mit Ellipsactinien; erst Ellipsactinienkalk, dann Breccien, schließlich Kieselknollenkalk","n":"Villa Damecuta mit Torre Damecuta, Anacapri","z":"Ruine einer Kaiservilla, frei zugänglich","zg":"frei","sg":"Kulturdenkmal","g":"Ellipsactinien- und Kieselknollenkalk","l":"genau","la":40.5585,"lo":14.2035,"c":"Anacapri (NA)","ex":"[…] Die Felsen am Eingange der Blauen Grotte, bei den Häusern Capo di Sopra am nordöstlichen Gehänge des Mte. Tiberio, bei der Kirche Sta. Maria a Citrella auf dem Mte. Solaro und am Zollhause zwischen Capri und Anacapri. Die Ellipsactinien sind auf der ganzen Insel verbreitet, auf der Westscholle z. B. bei Torre di Guardia längs des östlichen der beiden, nach Anacapri führenden Wege, in den Rollsteinen der Pfade von Anacapri nach Torre Damecuta, sowie östlich von Capri längs des Weges zum Mte. Tiberio und zu den Faraglioni. […]","sp":203,"u1":["Coltre eluvio-colluviale","b2","Holozän","Isola Di Capri","Hangschutt, Rutschmassen","#ecdeba"],"u2":["Calcari da bianco-cerei a cinerei","Unterkreide bis mittleres Kreide","Berriasium","#8ccd60"]},{"id":184,"k":9,"r":"Insel Capri","s":204,"t":"K","b":"Im Westen beim Leuchtturm auf dem Limbo Kieselknollenkalke, nach Karsten zur Unterkreide","n":"Punta Carena mit Leuchtturm, Anacapri","z":"Badeplatz und Leuchtturm","zg":"frei","sg":"–","g":"Kieselknollenkalk der Unterkreide","l":"genau","la":40.5365,"lo":14.1975,"c":"Anacapri (NA)","ex":"[…] Ursprünglich ist der Kalk deutlich grobbankig geschichtet. Ausser diesen Ellipsactinienkalken kennt man im Westen der Insel bei dem Leuchtthurme auf dem sog. Limbo noch Kieselknollenkalke, in welchen Oppenheim Sphaerulitenkalke vermuthete. Das sollen sie nicht sein, vielmehr ‚mit Rudistenbänken in Verbindung stehen und daher zur unteren Kreide zu rechnen sein. Ist -die Beobachtung Karsten’s richtig, dass am Limbo diese Kieselkalke unter der Rudistenbank liegen und mit der Hauptmasse des Mte. Solaro in inniger Beziehung stehen, dann kann der Ellipsactinienkalk nicht Tithon sein. Rudisten kommen ferner am Mte. Telegrafo und zwischen Anacapri und der Blauen Grotte vor. […]","sp":204,"u1":["Unità della migliara","ULR","Unterpleistozän","Isola Di Capri","Lockersedimente, Pleistozän","#f6e6a0"]},{"id":185,"k":9,"r":"Insel Capri","s":210,"t":"A","b":"Bei Fravicina Lithodomus-Bohrlöcher, bei Torre di Guardia und beim Leuchtturm Kieselknollenkalke und Rudistenbänke","n":"Torre della Guardia und Fravicina, Anacapri","z":"Wanderweg Sentiero dei Fortini","zg":"frei","sg":"–","g":"Kieselknollenkalk, gehobene Bohrlöcher","l":"geschätzt","la":40.542,"lo":14.209,"c":"Anacapri (NA)","ex":"[…] Auf der Strassenhöhe bei dem Zollhaus Nerineenkalke, längs des Weges zum Gipfel des Solaro Ellipsactinien und zoogene Gesteine mit Schrattenbildung, oben untere Kreide, bei Sta. Maria a Citrella vulkanische Tuffe und Nerineenkalke. Dann hinab gegen Torre di Guardia bei Fravicina Lithodomusbohrlöcher, bei Torre di Guardia und beim Leuchtthurm Kieselknollenkalke und Rudistenbinke. […]","sp":210,"u1":["Coltre eluvio-colluviale","b2","Holozän","Isola Di Capri","Hangschutt, Rutschmassen","#ecdeba"],"u2":["Calcare di castellammare","Unterkreide bis mittleres Kreide","Berriasium","#8ccd60"]},{"id":186,"k":9,"r":"Insel Capri","s":206,"t":"K","b":"Schratten und Gratwerk der Kalkwände; der Arco naturale verdankt Regen und Wind seine Entstehung (Fig. 25)","n":"Arco Naturale","z":"Felsbogen am Fußweg von Capri","zg":"frei","sg":"–","g":"Karstlösung; Rest einer eingestürzten Höhle","l":"genau","la":40.552,"lo":14.262,"c":"Capri (NA)","ex":"[…] Die gewaltige Auflösung der atmosphärischen Gewässer tritt am schärfsten an der dem Scirocco ausgesetzten Südküste hervor. Von ferne gesehen, erscheinen die Wände in ein Steingewebe. oder Gratwerk aufgelöst, und der schöne Arco naturale verdankt dem Regen und Winde, die an die vorspringende Steincoulisse anschlagen, seine Entstehung (Fig. 25). Der Regen dringt mittelst vieler feinen Risse in den Boden und wirkt lösend auf den Fels. Durch diese Wassercirculation bilden sich zahlreiche Höhlen und Grotten, von denen die am Meeresstrand belegenen, die Blaue und die Grüne die bekanntesten sind unter vielen anderen kleineren. Auch die Grotta di Mitromania gehört in diese Kategorie. […]","sp":206},{"id":187,"k":9,"r":"Insel Capri","s":206,"t":"K","b":"Durch Wassercirculation zahlreiche Höhlen und Grotten, auch die Grotta di Mitromania","n":"Grotta di Matermania","z":"Römisches Nymphäum in der Höhle, am Pizzolungo-Weg","zg":"frei","sg":"–","g":"Karsthöhle im Kreidekalk","l":"genau","la":40.549,"lo":14.2615,"c":"Capri (NA)","ex":"[…] Durch diese Wassercirculation bilden sich zahlreiche Höhlen und Grotten, von denen die am Meeresstrand belegenen, die Blaue und die Grüne die bekanntesten sind unter vielen anderen kleineren. Auch die Grotta di Mitromania gehört in diese Kategorie. Die Grüne und die Weisse Grotte erhalten ihre Farben durch den Untergrund der See und die Felspartieen, die Blaue durch das Licht, welches durch eine unter dem Wasserspiegel befindliche Oeffnung, also durch das Wasser von unten her Zutritt erhält, wobei nur die blauen Strahlen durchgelassen werden. Die Einfahrt erfolgt durch eine kleine fensterähnliche, mit römischem Mauerwerk ausgekleidete obere Oeffnung. […]","sp":206},{"id":188,"k":9,"r":"Insel Capri","s":206,"t":"K","b":"Blaue Grotte: Licht dringt durch eine Öffnung unter dem Wasserspiegel ein; Einfahrt durch ein fensterartiges, mit römischem Mauerwerk ausgekleidetes Loch; Strandverschiebung seit der Römerzeit","n":"Grotta Azzurra","z":"Bootsbesuch bei ruhiger See, bei Wellengang geschlossen","zg":"eingeschränkt","sg":"–","g":"Karsthöhle, durch Absenkung teilweise unter den Meeresspiegel geraten","l":"genau","la":40.5607,"lo":14.2054,"c":"Anacapri (NA)","ex":"[…] Auch die Grotta di Mitromania gehört in diese Kategorie. Die Grüne und die Weisse Grotte erhalten ihre Farben durch den Untergrund der See und die Felspartieen, die Blaue durch das Licht, welches durch eine unter dem Wasserspiegel befindliche Oeffnung, also durch das Wasser von unten her Zutritt erhält, wobei nur die blauen Strahlen durchgelassen werden. Die Einfahrt erfolgt durch eine kleine fensterähnliche, mit römischem Mauerwerk ausgekleidete obere Oeffnung. Esist nicht unmöglich, dass zur römischen Kaiserzeit das erste Loch über dem Wasserspiegel lag und die jetzige Einfahrtsstelle wirklich ein Fenster war. Das schöne Farbenspiel wäre damals nicht vorhanden gewesen. […]","sp":206,"u1":["Coltre eluvio-colluviale","b2","Holozän","Isola Di Capri","Hangschutt, Rutschmassen","#ecdeba"]},{"id":189,"k":9,"r":"Insel Capri","s":206,"t":"K","b":"Die Grüne und die Weiße Grotte erhalten ihre Farben durch Meeresgrund und Felsen","n":"Grotta Verde und Grotta Bianca","z":"Bei Bootsrundfahrten um die Insel zu sehen","zg":"frei","sg":"–","g":"Küstenhöhlen im Kalk","l":"geschätzt","la":40.5415,"lo":14.228,"c":"Anacapri (NA)","ex":"[…] Der Regen dringt mittelst vieler feinen Risse in den Boden und wirkt lösend auf den Fels. Durch diese Wassercirculation bilden sich zahlreiche Höhlen und Grotten, von denen die am Meeresstrand belegenen, die Blaue und die Grüne die bekanntesten sind unter vielen anderen kleineren. Auch die Grotta di Mitromania gehört in diese Kategorie. Die Grüne und die Weisse Grotte erhalten ihre Farben durch den Untergrund der See und die Felspartieen, die Blaue durch das Licht, welches durch eine unter dem Wasserspiegel befindliche Oeffnung, also durch das Wasser von unten her Zutritt erhält, wobei nur die blauen Strahlen durchgelassen werden. […]","sp":206,"u1":["membro delle dolomie bioclastiche laminate","DBS3","Kreide bis Jura","Isola Di Capri","Valanginium","#99d36a"]},{"id":190,"k":9,"r":"Insel Capri","s":209,"t":"K","b":"Rundgang: zum Arco Naturale und zu den Faraglioni hinab; Rudistenbänke am Monte Telegrafo","n":"Faraglioni","z":"Felsnadeln vor der Südostküste, Badeplätze","zg":"frei","sg":"–","g":"Abgetrennte Kalkpfeiler (Brandungsabtrag)","l":"genau","la":40.5455,"lo":14.2575,"c":"Capri (NA)","ex":"[…] Dabei beobachtet man die quartären Breccien, dann Ellipsactinienkalke, bei Capo di Sopra wieder die Breccien und Lithodomusbohrlöcher, oben auf der Spitze gelangt man an die Verwerfung, an welcher unten bei Lo Capo tertiäre Schollen kleben. Zurück auf dem oberen Wege bis dicht vor Capri und dann zum Arco Naturale und den Faraglioni hinab. Auf dem Mte, Telegrafo Rudisten führende Bänke. 2. Von Capri über die Einsattelung mit dem Eocän und dem Tuff, sowie den jüngeren Breccien nach Anacapri und von dort auf den Mte. Solaro. […]","sp":209},{"id":191,"k":10,"r":"Gegend von Salerno","s":212,"t":"A","b":"Trias des Tals von La Cava: von der Station nach Corpo di Cava oder auf dem Saumpfad über S. Pietro nach Pellezzano; Dolomite mit Megalodon und Gyroporellen","n":"Saumpfad Cava de’ Tirreni – Pellezzano","z":"Lage geschätzt","zg":"unklar","sg":"–","g":"Hauptdolomit (Obertrias)","l":"geschätzt","la":40.712,"lo":14.738,"c":"Cava de' Tirreni (SA)","ex":"[…] Aber auch dort herrscht zwischen der Bergkuppe I Mai und dem Salernitaner Golf eine treppenfirmig gegen die See gerichtete Bruchbildung mit landein fallenden Spalten. Wer die Trias des Thales von La Cava kennen lernen will, mag von der Station nach Corpo di Cava gehen oder von dem Bahnhof auf dem Saumpfade über S. Pietro nach Pellezzano wandern. In beiden Fällen stösst man sowohl auf die splittrigen Kalke, als auch auf die dunklen Dolomite, die hie und da Aegalodon enthalten und local ziemlich reichlich Gyroporellen in schlechten Exemplaren beherbergen. […]","sp":212,"u1":["membro delle dolomie bioclastiche laminate","DBS3","Unterjura bis Rhätium","Salerno","Norium","#d6aad3"],"u2":["Dolomie e calcari dolomitici","Norium bis unteres Lias","Norium","#d6aad3"]},{"id":192,"k":10,"r":"Gegend von Salerno","s":212,"t":"A","b":"Bachrunsen (Fiumaren) oberhalb Cava dei Tirreni mit dolomitischen Schottern voller Gervillia exilis und Turbo solitarius","n":"Cava de’ Tirreni","z":"Stadt im breiten Spaltental","zg":"frei","sg":"–","g":"Dolomitschotter aus der Trias","l":"genau","la":40.7,"lo":14.706,"c":"Cava de' Tirreni (SA)","ex":"[…] In beiden Fällen stösst man sowohl auf die splittrigen Kalke, als auch auf die dunklen Dolomite, die hie und da Aegalodon enthalten und local ziemlich reichlich Gyroporellen in schlechten Exemplaren beherbergen. Die Bachrunsen (Fiumaren) oberhalb Cava dei Tirreni führen dolomitische Schotter, in welchen Gervillia exilis und Turbo solitarius ziemlich häufig stecken. Bei Cava dei Tirreni hat das Thal seine Höhe erreicht, und mit langen Windungen führt die Bahn über eine steile Schwelle zum Golf von Salerno hinab. Man kann mehrere Staffelbrüche erkennen. […]","sp":212,"u1":["facies eluviali e/o colluviali","VEF2b2","Holozän","Salerno","Hangschutt, Rutschmassen","#ecdeba"],"u2":["Tufo Campano","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":193,"k":10,"r":"Gegend von Salerno","s":212,"t":"S","b":"Monte S. Liberatore (462 m) über Vietri: Hauptdolomit mit einer Kappe aus vielleicht rhätischem Kalk, beiderseits an Verwerfungen abgesetzt (Fig. 27)","n":"Monte San Liberatore, Vietri sul Mare/Salerno","z":"Wallfahrtskirche auf dem Gipfel, Aussicht über den Golf","zg":"frei","sg":"–","g":"Hauptdolomit und Rät-Kalk, Horst","l":"genau","la":40.6865,"lo":14.7375,"c":"Salerno (SA)","ex":"[…] Man kann mehrere Staffelbrüche erkennen. Der isolirt vorspringende, malerische Mte. S. Liberatore oberhalb Vietri besteht, wie beistehendes Profil zeigt, aus einer Hauptdolomitbasis mit einer Kappe von deutlich geschichtetem, vielleicht rhätischem Kalke und setzt im Norden an einer Verwerfung ab, desgleichen im Süden. Durch Tunnel an seinem Fusse erreicht die Bahn Salerno. M.S Liberadlore 462 nv Valle presso Vietri SW 1.25 000 NO Fig. 27. Profil des Mte. 8. Liberatore. Nach Böse. Bei dieser Stadt Öffnet sich das von Norden herkommende Irnothal, welches wahrscheinlich eine Erosionsrinne darstellt. […]","sp":212,"u1":["membro delle dolomie a bande","DBS1","Rhätium bis Norium","Salerno","Norium","#d6aad3"],"u2":["Dolomie","Norium","Norium","#d6aad3"]},{"id":194,"k":10,"r":"Gegend von Salerno","s":213,"t":"F","b":"Irnotal bei Salerno, mit vulkanischem Tuff beschüttet, an mehreren Stellen schwache Eisensäuerlinge","n":"Valle dell’Irno, Salerno","z":"Stadt- und Gewerbegebiet; Universität in Fisciano","zg":"frei","sg":"–","g":"Mineralwässer aus dem Tuff","l":"geschätzt","la":40.693,"lo":14.772,"c":"Salerno (SA)","ex":"[…] Nach Böse. Bei dieser Stadt Öffnet sich das von Norden herkommende Irnothal, welches wahrscheinlich eine Erosionsrinne darstellt. Dieselbe ist an ihrem Boden meterhoch mit vulkanischem Tuff beschüttet und enthält an mehreren Stellen schwache Eisensäuerlinge, deren mineralische Bestandtheile auf den grauen campanischen Tuff zurückgehen werden. Westlich von Salerno schiebt sich eine in den I Monti (419 m) genannten Höhen culminirende Kette vor. Es ist eine Längsscholle des Apennins und besteht zum Theil aus mächtigen pliocänen Schottern mit blauen Mergel-. und Thon- oder Sandeinlagerungen. Man kann diese Bildungen auf der von Salerno am Gehänge hinaufführenden Strasse studiren. […]","sp":213,"u1":["Sintema masseria acqua santa","MQSb","Holozän bis Oberpleistozän","Salerno","Quartäre Abfolge (Sintem, gemischte Ablagerungen)","#e2c496"],"u2":["Tufo Campano","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":195,"k":10,"r":"Gegend von Salerno","s":213,"t":"A","b":"Kette der I Monti (419 m): Längsscholle mit mächtigen Pliozän-Schottern, blauen Mergeln und Tonen; an der Straße von Salerno zu studieren","n":"Hügelland bei Salerno (Bezeichnung „I Monti“ ungeprüft)","z":"Lage unsicher","zg":"unklar","sg":"–","g":"Pliozäne Konglomerate und Mergel (Conglomerati di Salerno)","l":"geschätzt","la":40.696,"lo":14.79,"c":"Salerno (SA)","ex":"[…] Dieselbe ist an ihrem Boden meterhoch mit vulkanischem Tuff beschüttet und enthält an mehreren Stellen schwache Eisensäuerlinge, deren mineralische Bestandtheile auf den grauen campanischen Tuff zurückgehen werden. Westlich von Salerno schiebt sich eine in den I Monti (419 m) genannten Höhen culminirende Kette vor. Es ist eine Längsscholle des Apennins und besteht zum Theil aus mächtigen pliocänen Schottern mit blauen Mergel-. und Thon- oder Sandeinlagerungen. Man kann diese Bildungen auf der von Salerno am Gehänge hinaufführenden Strasse studiren. […]","sp":213,"u1":["Argille e argille siltose di salerno","AAN","Messinium bis Tortonium","Salerno","Messinium","#ffff73"],"u2":["Argille e marne siltose grigio-plumbee, o varicolori","Oligozän bis Miozän","Rupelium","#e1d991"]},{"id":196,"k":10,"r":"Gegend von Salerno","s":214,"t":"S","b":"Tal von Ogliara, dann über staffelförmig abgesunkene Kreideschollen zum Monte Stella (951 m); jenseits bei Calvanico Hauptdolomit, am Pizzo S. Michele wieder Kreide","n":"Monte Stella und Ogliara, Salerno","z":"Wanderwege, Aussicht","zg":"frei","sg":"Parco Regionale dei Monti Picentini (Umfeld)","g":"Treppenförmige Bruchstufen der Monti Picentini","l":"geschätzt","la":40.718,"lo":14.8,"c":"Salerno (SA)","ex":"[…] Man kann diese Bildungen auf der von Salerno am Gehänge hinaufführenden Strasse studiren. Nördlich dieser Scholle liegt das breite Thal von Ogliara, wo Tuffe und Gehängeschotter wahrscheinlich das Pliocän und einen Sockel von Hauptdolomit verhüllen, und dann geht es über staffelförmig abgesunkenen Kreideschollen hinauf zum Mte. Stella (951m). Jenseits dieses Berges im Gebiet von Calvanico ist wieder Hauptdolomit sichtbar. Die Gehänge des Pizzo S. Michele (1563) setzen sich dagegen abermals aus Kreidekalken zusammen. […]","sp":214,"u1":["membro delle dolomie a bande","DBS1","Rhätium bis Norium","Salerno","Norium","#d6aad3"],"u2":["Calcari grigi, bianchi o avana, detritici","Cenomanium bis Senonium","Cenomanium","#b3de53"]},{"id":197,"k":10,"r":"Paestum und Sele-Ebene","s":214,"t":"K","b":"Bei Pontecagnano beginnt das dreieckige Alluvialland des Sele bis Eboli, ein Delta in einer tiefen Bucht; halbverlandete Sümpfe","n":"Sele-Ebene (Piana del Sele) und Foce Sele","z":"Seit den Bonifiche der 1930er-Jahre trockengelegt, intensive Landwirtschaft (Büffelmozzarella); Küste mit Pinienwald","zg":"frei","sg":"Riserva Naturale Foce Sele – Tanagro","g":"Holozänes Delta des Sele","l":"geschätzt","la":40.488,"lo":14.945,"c":"Eboli (SA)","ex":"[…] Die Gehänge des Pizzo S. Michele (1563) setzen sich dagegen abermals aus Kreidekalken zusammen. Auf der Fahrt nach Pästum folgt man zunächst dem Fusse der Monti-Kette und erreicht an deren Ende bei Pontecagnano ein dreieckiges Alluvialland, dessen Basis die Küste ist und dessen Spitze der Austritt des wasserreichen Sele aus dem Gebirge bei Eboli darstellt. Dieser Fluss hat ein weit in den Apennin hinaufgreifendes Sammelgebiet und ist nächst dem Volturno die bedeutendste Wasserader der unteritalischen Westküste. […]","sp":214,"u1":["Deposito lacustre palustre","SLGe","Holozän","Foce Del Sele","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"],"u2":["Sabbie alluvionali","Holozän","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"]},{"id":198,"k":10,"r":"Paestum und Sele-Ebene","s":215,"t":"H","b":"Paestum steht auf Travertin (Kalktuff), aus dem auch die Tempel gebaut sind; die Bewohner zogen im Mittelalter wegen der Sümpfe nach Capaccio","n":"Parco Archeologico di Paestum e Velia","z":"Dorische Tempel (Hera, Neptun, Athena), Museum","zg":"frei","sg":"UNESCO-Welterbe Cilento","g":"Holozäner Süßwasser-Travertin","l":"genau","la":40.4196,"lo":15.0053,"c":"Capaccio Paestum (SA)","ex":"[…] Ein wichtiges Element in der Gesteinsbildung dieses jungen Bodens sind Kalktuffe und Sinter, welche sich beim Stehen der kalkreichen Wasser um Pflanzenstengel ausscheiden. Solcher Travertin oder Kalktuff herrscht überall im Boden der Stadt Pästum, ist feucht, von Grundwasser durchzogen und hat das Material zu den Tempeln geliefert, deren mächtige Quadern sich nahe der Baustelle in beliebig grossen Stücken verhältnissmässig leicht gewinnen liessen. Von Pästum aus eröffnet sich ein schöner Blick auf dietreppenartig ansteigenden Ketten von Capaccio bis zu dem mächtigen, im Frühjahr und Winter mit Schnee bedeckten Mte. Alburno (1740 m). […]","sp":215,"u2":["Travertino","Pleistozän","Travertin, Kalksinter","#cedea0"]},{"id":199,"k":10,"r":"Paestum und Sele-Ebene","s":216,"t":"S","b":"Treppenartige Ketten hinter Paestum: Monte Sottano (632 m) bei Trentinara, Monte Soprano (1032 m) hinter Capaccio, Alburno-Tafel; Wanderung Paestum–Capaccio–Trentinara–Giungano","n":"Monte Soprano und Monte Sottano, Capaccio/Trentinara","z":"Wanderwege; Trentinara als „Terrazza del Cilento“","zg":"frei","sg":"Parco Nazionale del Cilento, Vallo di Diano e Alburni","g":"Kreide-Hippuritenkalk an NW–SO streichenden Staffelbrüchen","l":"geschätzt","la":40.435,"lo":15.1,"c":"Capaccio Paestum (SA)","ex":"die NW—SO. streichen und gegen NO. fallen. Die niedrigste ist der Rücken des Mte. Sottano (632 m) bei Trentinara, dann folgt der Steilrand der Höhen des Mte. Soprano (1032 m) hinter Capaccio, drittens die Alburnotafel. Querbrüche schneiden diese Schollen gegen den Sele zu ab. Auf ihren nordöstlichen Abdachungen liegen tertiäre (eocäne und pliocäne) Schichten, die Steilwände bestehen aus Hippuritenkalk, unterlagert von Breccien und Nerineenkalken. Die niedrigste Stufe lässt sich leicht von Pästum besuchen, indem man von der Station den Feldweg nach Capaccio einschlägt und von dort über Trentinara und Giungano nach der Station von Ogliastro geht. […]","sp":216,"u2":["Calcare","Turonium bis Senonium","Turonium","#bfde53"]},{"id":200,"k":10,"r":"Paestum und Sele-Ebene","s":215,"t":"S","b":"Blick von Paestum bis zum mächtigen, im Winter verschneiten Monte Alburno (1740 m)","n":"Monti Alburni (Monte Panormo, 1742 m)","z":"Karstplateau mit Höhlen (Grotte di Pertosa-Auletta, Grotte di Castelcivita)","zg":"frei","sg":"Parco Nazionale del Cilento, Vallo di Diano e Alburni","g":"Karbonatplattform, verkarstetes Hochplateau","l":"geschätzt","la":40.523,"lo":15.29,"c":"Ottati (SA)","ex":"[…] Solcher Travertin oder Kalktuff herrscht überall im Boden der Stadt Pästum, ist feucht, von Grundwasser durchzogen und hat das Material zu den Tempeln geliefert, deren mächtige Quadern sich nahe der Baustelle in beliebig grossen Stücken verhältnissmässig leicht gewinnen liessen. Von Pästum aus eröffnet sich ein schöner Blick auf dietreppenartig ansteigenden Ketten von Capaccio bis zu dem mächtigen, im Frühjahr und Winter mit Schnee bedeckten Mte. Alburno (1740 m). Man kann ohne Weiteres drei Längsschollen erkennen, die NW—SO. streichen und gegen NO. fallen. […]","sp":215,"u2":["Calcare","Turonium bis Senonium","Turonium","#bfde53"]}],"kapitel":{"3":"Neapel und die Phlegräischen Felder","4":"Ischia und Nachbarinseln","5":"Der Vulkan von Roccamonfina","6":"Monte Somma und Vesuv","7":"Sarno – Nocera","8":"Sorrentiner Halbinsel","9":"Capri","10":"Gegend von Salerno"},"kurz":{"3":"Phlegräische Felder","4":"Ischia, Procida","5":"Roccamonfina","6":"Vesuv","7":"Sarno, Caserta","8":"Sorrent, Amalfi","9":"Capri","10":"Salerno, Paestum"},"info":"<h5>Stand der Vulkane (Oktober 2026)<\/h5>\n<div class=\"statgrid\">\n <div class=\"stat\"><span class=\"lvl y\">Warnstufe Gelb<\/span><b>Campi Flegrei<\/b><span>Der Boden hebt sich weiter, zuletzt um rund 1 cm im Monat; am Rione Terra in Pozzuoli etwa 30 cm allein seit Januar 2025. Das stärkste Beben der Krise erreichte Md 4,7 am 31. Juli 2026. Die Solfatara ist seit 2017 geschlossen, Pisciarelli abgesperrt.<\/span><\/div>\n <div class=\"stat\"><span class=\"lvl g\">Warnstufe Grün<\/span><b>Vesuv<\/b><span>Ruhend seit dem Ausbruch vom März 1944. Der Kraterweg von Quota 1000 ist mit Online-Zeitfenster begehbar, bei Waldbrandgefahr oder Unwetter gesperrt.<\/span><\/div>\n<\/div>\n<p>Ischia gilt als ruhend (letzter Ausbruch 1302), wird aber von flachen Beben getroffen (Casamicciola 1883 und 2017). Vor jedem Besuch in den Campi Flegrei die aktuellen Wochenberichte des <a href=\"https://www.ov.ingv.it/\" target=\"_blank\" rel=\"noopener\">Osservatorio Vesuviano (INGV)<\/a> und die Hinweise des Zivilschutzes prüfen.<\/p>\n<h5>Deeckes Begriffe, heute gelesen<\/h5><div class=\"gloss\"><table><thead><tr><th>1901<\/th><th>heute<\/th><\/tr><\/thead><tbody><tr><td>Gelber Tuff, Tufo giallo<\/td><td>Neapolitanischer Gelbtuff (NYT), Caldera-Ausbruch der Campi Flegrei vor rund 15 000 Jahren<\/td><\/tr><tr><td>Grauer campanischer Tuff, Piperno, Breccia Museo<\/td><td>Kampanischer Ignimbrit (CI), größter Ausbruch Europas der letzten 200 000 Jahre, vor 39 800 Jahren; Piperno ist seine verschweißte Fazies<\/td><\/tr><tr><td>Bimssteintuff, Pozzolana, Tufo bigio<\/td><td>Bims- und Aschenlagen der jüngeren Ausbrüche; Puzzolan als natürlicher Zementzuschlag<\/td><\/tr><tr><td>Pisolithtuff<\/td><td>Tuff mit akkretionären Lapilli (Aschenkügelchen aus feuchten Eruptionswolken)<\/td><\/tr><tr><td>Explosionskrater, Maar<\/td><td>Maar bzw. Tuffring; die meisten Krater der Campi Flegrei sind 15 000 bis 3 800 Jahre alt, der Monte Nuovo entstand 1538<\/td><\/tr><tr><td>Riesenkrater, Einsturzbecken (Pianura, Quarto)<\/td><td>Teile der Caldera des Kampanischen Ignimbrits und des Gelbtuffs<\/td><\/tr><tr><td>Säculare Bodenschwankung am Serapeum<\/td><td>Bradyseismos: Hebung und Senkung durch Druck im Hydrothermal- und Magmasystem<\/td><\/tr><tr><td>Sanidin-Trachyt, Sodalithtrachyt<\/td><td>Trachyt bis Phonolith (Campi Flegrei, Ischia)<\/td><\/tr><tr><td>Leucittephrit, Leucitbasanit (Vesuv)<\/td><td>Phonolithischer Tephrit und Tephriphonolith der kaliumreichen Vesuv-Serie<\/td><\/tr><tr><td>Leucitit, Leucitophyr, Biotit-Vulsinit (Roccamonfina)<\/td><td>Leucitit, Leucit-Phonolith; Vulsinit ≈ Latit bzw. Trachyt<\/td><\/tr><tr><td>Phasen I–VI des Monte Somma (Johnston-Lavis)<\/td><td>Heute gegliedert nach plinianischen Ausbrüchen: Pomici di Base (rund 22 000 J.), Mercato (rund 8 900 J.), Avellino (rund 3 900 J.), Pompeji (79 n. Chr.)<\/td><\/tr><tr><td>Erhebungsvulkan (L. v. Buch)<\/td><td>Widerlegt; der Somma-Wall ist der Rand einer Einsturz-Caldera<\/td><\/tr><tr><td>Schlammströme von Herculaneum<\/td><td>Pyroklastische Dichteströme (Glutlawinen) von 79 n. Chr.<\/td><\/tr><tr><td>Aschenkegel<\/td><td>Gran Cono, der junge Vesuvkegel in der Somma-Caldera<\/td><\/tr><tr><td>Atrio di Cavallo<\/td><td>Atrio del Cavallo<\/td><\/tr><tr><td>Rapilli<\/td><td>Lapilli<\/td><\/tr><tr><td>Stufa, Stufe (di Nerone, di S. Germano)<\/td><td>Natürliches Dampfbad über Fumarolen<\/td><\/tr><tr><td>Eisensäuerling<\/td><td>Eisenhaltiger CO₂-Säuerling<\/td><\/tr><tr><td>Hippuriten-, Rudisten-, Sphaerulitenkalk<\/td><td>Oberkreide-Kalk mit Rudisten (riffbildende Muscheln)<\/td><\/tr><tr><td>Urgon, Orbitolinenmergel<\/td><td>Unterkreide (Barrême–Apt)<\/td><\/tr><tr><td>Ellipsactinienkalk, Nerineenkalk (Capri)<\/td><td>Riffkalk des Oberjura (Tithon) bis Unterkreide; Ellipsactinia ist eine Hydrozoe, Nerinea eine Schnecke<\/td><\/tr><tr><td>Macigno<\/td><td>Flysch (Sandstein-Mergel-Wechselfolge), Eozän bis Miozän<\/td><\/tr><tr><td>Hauptdolomit, Megalodon, Gyroporellen<\/td><td>Hauptdolomit (Norium, Obertrias); Megalodonten-Muscheln, Kalkalgen<\/td><\/tr><tr><td>Resina<\/td><td>Ercolano (seit 1969)<\/td><\/tr><tr><td>Ottajano, Bosco Tre Case, Torre dell’Annunziata<\/td><td>Ottaviano, Boscotrecase, Torre Annunziata<\/td><\/tr><tr><td>Bajae, Cumae, Pästum<\/td><td>Baia, Cuma, Paestum<\/td><\/tr><tr><td>Prajano, Majori, La Cava<\/td><td>Praiano, Maiori, Cava de’ Tirreni<\/td><\/tr><tr><td>Sujo, Piejo, Miniscola<\/td><td>Suio Terme, Piedimonte, Miliscola<\/td><\/tr><tr><td>Mte. S. Angelo a tre pizzi (1542 m)<\/td><td>Monte Molare / San Michele (1444 m)<\/td><\/tr><\/tbody><\/table><\/div>\n<h5>Wie die Zuordnung entstanden ist<\/h5>\n<p>Der Scan (252 Seiten) wurde per Texterkennung erfasst und der Exkursionsteil, Kapitel III bis X (S. 57–216), Route für Route gelesen. Jede Lokalität mit geologischer Aussage ist aufgenommen, mit Seitenzahl des Originals; zusammen 200 Stellen. Die allgemeinen Kapitel I und II (Topographie, Geologie) sind nicht als Punkte ausgewertet.<\/p>\n<p>Für Kampanien gibt es kein Geotopkataster wie in Sachsen. Die Koordinaten sind deshalb von Hand gesetzt: 93 Lokalitäten ließen sich einem heute eindeutig benannten Ort zuordnen (volle Punkte, Genauigkeit meist besser als 200 m), 107 sind aus Deeckes Wegbeschreibung geschätzt (hohle Punkte). Die Gemeinde ist aus den ISTAT-Gemeindegrenzen berechnet. 8 Stellen sind heute nicht zugänglich (Militärgelände, Sperrung, geschlossene Thermen); sie sind in der Liste mit „ZU“ markiert.<\/p>\n<p>„Heute“ beschreibt Zustand, Zugang und Schutzstatus nach dem Kenntnisstand vom Oktober 2026; Öffnungszeiten und Sperrungen ändern sich, gerade in den Campi Flegrei. „Geologie“ ordnet Deeckes Beobachtung in die heutige Gliederung ein, mit Altern nach der aktuellen Literatur.<\/p>\n<h5>Geologische Karten<\/h5>\n<p>Unter „Karte und Färbung“ lassen sich zwei Karten des Servizio Geologico d’Italia (ISPRA) einblenden, abgerufen im Oktober 2026 über dessen Kartendienst. <b>CARG<\/b> ist die neue Geologische Karte 1:50 000 aus der CARG-Datenbank, in 1:25 000 aufbereitet. Sie liegt für elf Blätter vor: Napoli, Ercolano, Procida, Sorrento, Isola di Capri, Salerno, Caserta Est, Avellino, Eboli, Foce del Sele und Agropoli. Ischia, Termini (Punta Campanella) und das Gebiet von Teano und Sessa (Roccamonfina) fehlen dort. <b>1:100 000<\/b> ist die ältere Carta Geologica d’Italia und deckt ganz Kampanien ab. Einheiten des Meeresbodens sind weggelassen.<\/p>\n<p>ISPRA färbt beide Karten nur nach dem Alter, wodurch Tuffe, Laven und Schwemmland im Raum Neapel fast gleich aussehen. Die Karte hier färbt quartäre Einheiten deshalb nach Gesteinsart: Laven rot (historisch datierte Ströme kräftig), Pyroklastite orange nach Alter, Neapolitanischer Gelbtuff und Kampanischer Ignimbrit mit eigenen Farben, Lockersedimente gelblich. Ältere Gesteine behalten die Farben der Zeitskala. Die Zuordnung erfolgt über Stichwörter in Namen und Legendentexten und kann einzelne Einheiten falsch einordnen; maßgeblich sind Name, Sigel und Alter in der Abfrage. Die Flächen sind auf etwa 10 m (CARG) bzw. 20 m (1:100 000) vereinfacht.<\/p>\n<p>„Originaltext lesen“ zeigt zu jeder Lokalität die zugehörige Stelle aus Deeckes Text, automatisch zugeordnet und auf die passenden Sätze gekürzt. Die Suche durchsucht diese Texte mit. Einige Namen blieben offen: Punta del Cantone und Monte Telegrafo auf Capri, „I Monti“ bei Salerno und die Montagnola di S. Teresa bei Bagnoli.<\/p>","outline":{"Lazio":[[[11.8109,42.8069],[11.8137,42.8227],[11.8474,42.8377],[11.9039,42.8322],[11.9274,42.7809],[11.9795,42.7646],[11.9692,42.7379],[11.9606,42.7282],[11.9454,42.7253],[11.9262,42.7039],[11.9488,42.696],[11.9413,42.6833],[12.0071,42.6625],[12.0299,42.6502],[12.03,42.6432],[12.0737,42.6567],[12.0945,42.6555],[12.1067,42.6647],[12.1241,42.6493],[12.1323,42.6617],[12.1462,42.6589],[12.1609,42.6767],[12.2043,42.6605],[12.2269,42.6435],[12.2257,42.6355],[12.2433,42.6281],[12.2291,42.6111],[12.2476,42.5967],[12.2359,42.5833],[12.2387,42.5722],[12.275,42.5599],[12.2786,42.5416],[12.2662,42. <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function(){
"use strict";
// ---------- Daten ----------
// Eine Zeile je Lokalität aus Deeckes Exkursionen; Felder: id, k (Kapitel), r (Route), s (Buchseite), t (Art),
// b (Deecke 1901, zusammengefasst), n (heute), z (Zustand), zg (Zugang), sg (Schutz/Status), g (Geologie heute),
// l (Lage genau/geschätzt), la/lo (WGS84), c (Gemeinde), ex (Originaltext), sp (Seite des Originaltexts)
const META = JSON.parse(document.getElementById('deeckedata').textContent);
const D = META.rows;
const byId = new Map(D.map(o=>[o.id,o]));
const RN = ['','I','II','III','IV','V','VI','VII','VIII','IX','X'];
// Kapitelfarben: Vesuv rot, Phlegräische Felder gelb wie der Tuff, Inseln türkis, Kalkgebirge grün/blau
const KVAR = {3:'--r3',4:'--r7',5:'--r6',6:'--r1',7:'--r5',8:'--r4',9:'--r2',10:'--r9'};

const TYPES = [
  {k:'V', c:'--c-vulk',       label:'Vulkan / Krater'},
  {k:'L', c:'--c-lava',       label:'Lavastrom'},
  {k:'A', c:'--c-aufschluss', label:'Aufschluss / Steinbruch'},
  {k:'F', c:'--c-quelle',     label:'Fumarole / Thermalquelle'},
  {k:'K', c:'--c-kueste',     label:'Küste / Insel / Grotte'},
  {k:'H', c:'--c-geohist',    label:'Antike Stätte / Bauwerk'},
  {k:'S', c:'--c-relief',     label:'Gipfel / Aussichtspunkt'},
  {k:'O', c:'--c-none',       label:'Ort / Ereignis'}
];
const ZUG = {frei:'frei zugänglich', 'eingeschränkt':'eingeschränkt (Eintritt, Führung, Zeiten)', geschlossen:'geschlossen / nicht zugänglich', unklar:'unklar'};

// ---------- Hilfsfunktionen ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => (s||'').toLowerCase().replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’']/g,"'");
const fmtInt = n => n==null ? '' : Number(n).toLocaleString('de-DE');
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
const typeVar = t => (TYPES.find(x=>x.k===t)||TYPES[7]).c;
const kapVar = k => KVAR[k] || '--r8';
const hasLoc = o => o.la!=null;
const approxOf = o => o.l!=='genau';

for (const o of D){
  o._s = norm([o.b,o.n,o.z,o.g,o.sg,o.c,o.r,o.ex,'s. '+o.s].join(' '));
  o._d = Infinity;
}

// ---------- Zustand ----------
const state = {
  q:'', types:new Set(TYPES.map(t=>t.k)), kap:'', lage:'', zug:'',
  view:false, colorBy: store.get('deecke.colorBy') || 'kap',
  base: store.get('deecke.base') || 'topo', sel:null, shown:250,
  near:null, rad:25,
  geo:'', geoOp:+(store.get('deecke.geoOp')||0.65), faults:store.get('deecke.faults')!=='0'
};

// ---------- Entfernungen ----------
// Luftlinie nach Haversine (Kugel mit mittlerem Erdradius) – auf wenige Meter genau, mehr braucht es hier nicht
function distKm(a,b){
  const R=6371.0088, r=Math.PI/180;
  const dLa=(b.la-a.la)*r, dLo=(b.lo-a.lo)*r;
  const h=Math.sin(dLa/2)**2+Math.cos(a.la*r)*Math.cos(b.la*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function bearingWord(a,b){
  const r=Math.PI/180, y=Math.sin((b.lo-a.lo)*r)*Math.cos(b.la*r);
  const x=Math.cos(a.la*r)*Math.sin(b.la*r)-Math.sin(a.la*r)*Math.cos(b.la*r)*Math.cos((b.lo-a.lo)*r);
  const deg=(Math.atan2(y,x)/r+360)%360;
  return ['nördlich','nordöstlich','östlich','südöstlich','südlich','südwestlich','westlich','nordwestlich'][Math.round(deg/45)%8];
}
const fmtKm = d => d<1 ? Math.round(d*1000/10)*10+' m' : (d<10 ? d.toFixed(1).replace('.',',') : Math.round(d))+' km';

// ---------- Filter-UI aufbauen ----------
function countBy(arr, f){ const m=new Map(); for(const o of arr){const k=f(o); if(k==null) continue; m.set(k,(m.get(k)||0)+1);} return m; }
// Auswahl „Kapitel und Route“: Kapitel als Gruppe, darunter die Routen in Deeckes Reihenfolge
(function(){
  const kc=countBy(D,o=>o.k), rc=countBy(D,o=>o.r);
  let h=`<option value="">alle acht Kapitel</option>`;
  for(const k of Object.keys(META.kapitel).map(Number)){
    const routes=[...new Set(D.filter(o=>o.k===k).map(o=>o.r))];
    h+=`<optgroup label="${RN[k]} · ${esc(META.kapitel[k])}"><option value="k${k}">ganzes Kapitel ${RN[k]} (${kc.get(k)||0})</option>`;
    if(routes.length>1) h+=routes.map(r=>`<option value="r${esc(r)}">${esc(r)} (${rc.get(r)})</option>`).join('');
    h+=`</optgroup>`;
  }
  $('#fTour').innerHTML=h;
})();
const nG = D.filter(o=>o.l==='genau').length, nE = D.length-nG;
$('#fLage').innerHTML = `<option value="">alle</option><option value="genau">Ort zugeordnet (${nG})</option><option value="geschätzt">geschätzt (${nE})</option>`;
const zc = countBy(D,o=>o.zg);
$('#fZug').innerHTML = `<option value="">alle</option>`+Object.keys(ZUG).filter(k=>zc.get(k)).map(k=>`<option value="${k}">${k} (${zc.get(k)})</option>`).join('');

const chipsEl = $('#chips');
chipsEl.innerHTML = TYPES.filter(t=>D.some(o=>o.t===t.k)).map(t=>
  `<button class="chip" type="button" aria-pressed="true" data-k="${esc(t.k)}" style="--c:var(${t.c})"><span class="dot"></span>${esc(t.label)} <span class="n"></span></button>`).join('');
chipsEl.addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  const k = b.dataset.k;
  // Wenn alle aktiv sind, zeigt der erste Klick nur diese Art; weitere Klicks nehmen Arten hinzu oder heraus
  if (state.types.size === chipsEl.children.length) { state.types = new Set([k]); }
  else if (state.types.has(k)) { state.types.delete(k); if(!state.types.size) state.types = new Set(TYPES.map(t=>t.k)); }
  else state.types.add(k);
  update();
});

// ---------- Filterlogik ----------
function matches(o, skipType){
  if (!skipType && !state.types.has(o.t)) return false;
  if (state.kap){ if (state.kap[0]==='k' ? o.k!==+state.kap.slice(1) : o.r!==state.kap.slice(1)) return false; }
  if (state.lage && o.l!==state.lage) return false;
  if (state.zug && o.zg!==state.zug) return false;
  if (state.q){ for (const w of state.q.split(/\s+/)) if (w && !o._s.includes(w)) return false; }
  if (state.near && state.rad && !(o._d <= state.rad)) return false;
  return true;
}

// ---------- Karte ----------
const map = L.map('map',{zoomControl:false, preferCanvas:true, minZoom:7, maxZoom:18, zoomSnap:0.5});
L.control.zoom({position:'topleft', zoomInTitle:'Hineinzoomen', zoomOutTitle:'Herauszoomen'}).addTo(map);
L.control.scale({imperial:false, position:'bottomleft'}).addTo(map);
map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
const renderer = L.canvas({padding:0.3, tolerance:4});
map.createPane('land'); map.getPane('land').style.zIndex = 250;
map.createPane('labels'); map.getPane('labels').style.zIndex = 450; map.getPane('labels').style.pointerEvents='none';
const landRenderer = L.canvas({pane:'land', padding:0.3});

// Hintergrundkarten (laden nur, wenn der Browser externe Kacheln erlaubt)
const BASES = {
  topo:{label:'Topografisch', url:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', o:{subdomains:'abc',maxNativeZoom:17,maxZoom:18,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>, SRTM | © <a href="https://opentopomap.org" target="_blank" rel="noopener">OpenTopoMap</a> (CC-BY-SA)'}},
  hell:{label:'Hell', url:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', o:{subdomains:'abcd',maxZoom:18,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>'}},
  luft:{label:'Luftbild', url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', o:{maxNativeZoom:18,maxZoom:18,attribution:'Luftbild © Esri, Maxar, Earthstar Geographics'}},
  none:{label:'Ohne Karte'}
};
let baseLayer=null, tilesBlocked=false;
const baseFailed=new Set(), baseOk=new Set();

function setBase(k){
  if (k!=='none' && (tilesBlocked || baseFailed.has(k))) k='none';
  state.base=k; store.set('deecke.base',k);
  if (baseLayer){ baseLayer.off(); map.removeLayer(baseLayer); baseLayer=null; }
  const b=BASES[k];
  if (b.url){
    const layer=L.tileLayer(b.url,b.o); baseLayer=layer;
    let errs=0;
    // Lädt dieser Hintergrund nicht, wird nur er gesperrt und der nächste versucht
    const fail=()=>{
      if (baseOk.has(k) || baseLayer!==layer) return;
      baseFailed.add(k);
      const next=['topo','hell','luft'].find(x=>!baseFailed.has(x));
      if (!next) tilesBlocked=true;
      setBase(next||'none');
    };
    setTimeout(fail,6000);
    layer.on('tileload',()=>{ baseOk.add(k); });
    layer.on('tileerror',()=>{ errs++; if(errs===3) setTimeout(fail,1500); });
    layer.addTo(map);
  }
  // Ohne Kacheln: eingebetteter Landumriss und Ortsnamen zur Orientierung
  if (k==='none'){ landLayer.addTo(map); cityLayer.addTo(map); } else { map.removeLayer(landLayer); map.removeLayer(cityLayer); }
  renderBaseCtl();
}

// Vereinfachter Umriss Kampaniens und der Nachbarregionen (ISTAT-Grenzen, auf ~100 m generalisiert)
const landLayer=L.layerGroup();
function drawLand(){

// ---------- Punkte ----------
const markers = new Map();

let selRing = null;
function radius(){ const z=map.getZoom(); return z<9?3.8: z<10.5?5: z<12?6: 7.5; }

// Volle Punkte: heutiger Ort eindeutig zugeordnet. Hohle, gestrichelte Punkte: aus Deeckes Beschreibung geschätzt.
function styleOf(o){
  const c=colorOf(o), approx=approxOf(o);
  return {radius:radius(), color:approx?c:css('--halo'), weight:approx?1.8:1, dashArray:approx?'3 2':null, fillColor:c, fillOpacity:approx?0.15:0.9, opacity:1};
}

function restyle(){ for(const [id,m] of markers) m.setStyle(styleOf(byId.get(id))); if(state.sel) drawSel(); drawLand(); renderLegend();

// ---------- Liste ----------
let current=[];
function update(){
  const visible=D.filter(o=>matches(o));
  pointLayer.clearLayers();
  for(const o of visible){ const m=markers.get(o.id); if(m) pointLayer.addLayer(m); }
  const tc=countBy(D.filter(o=>matches(o,true)),o=>o.t);
  for(const b of chipsEl.children){ b.setAttribute('aria-pressed',state.types.has(b.dataset.k)); b.querySelector('.n').textContent=tc.get(b.dataset.k)||0; }
  let L_=visible;
  if(state.view){ const bb=map.getBounds(); L_=visible.filter(o=>hasLoc(o) && bb.contains([o.la,o.lo])); }
  current=L_.slice().sort(state.near ? (a,b)=>a._d-b._d : (a,b)=>a.id-b.id);
  state.shown=250; renderList();
  const near = state.near ? (state.rad ? `im Umkreis von ${state.rad} km · ` : 'nach Entfernung · ') : '';
  $('#count').innerHTML = `<b>${fmtInt(current.length)}</b> ${near}${state.view?'im Ausschnitt · ':''}von ${fmtInt(D.length)} Lokalitäten`;

function renderList(){
  const el=$('#list');
  if(!current.length){ el.innerHTML=`<li class="empty">Keine Lokalität passt zu diesen Filtern.<br>Lockere die Suche oder setze die Filter zurück.</li>`; return; }
  let lastR='', html='';
  const part=current.slice(0,state.shown);
  for(const o of part){
    // Zwischenüberschrift je Route, solange die Liste nach Deeckes Reihenfolge sortiert ist
    if(!state.near && o.r!==lastR){ lastR=o.r; html+=`<li class="tourhd" style="--c:var(${kapVar(o.k)})"><span class="rn">${RN[o.k]}</span>${esc(o.r)}</li>`; }
    const sub=`Deecke S. ${o.s} · ${o.b}`;
    const dist = state.near && isFinite(o._d) ? `<span class="dist">${fmtKm(o._d)}</span>` : `<span class="nr">${String(o.id).padStart(3,'0')}</span>`;
    const tag = o.zg==='geschlossen' ? `<span class="tag shut" title="Heute nicht zugänglich">ZU</span>` : '';
    html+=`<li class="item" tabindex="0" data-id="${o.id}" ${o.id===state.sel?'aria-current="true"':''} style="--c:var(${colorVarOf(o)})"><span class="dot${approxOf(o)?' approx':''}"></span><div><div class="t">${esc(o.n)}${tag}</div><div class="s">${esc(sub.length>120?sub.slice(0,118)+'…':sub)}</div></div>${dist}</li>`;
  }
  if(current.length>state.shown) html+=`<li><button class="btn more" id="more" type="button">Weitere ${fmtInt(current.length-state.shown)} anzeigen</button></li>`;
  el.innerHTML=html;
}
$('#list').addEventListener('click',e=>{

});
$('#list').addEventListener('keydown',e=>{ if(e.key==='Enter'){ const li=e.target.closest('.item'); if(li) select(+li.dataset.id,{fly:true}); }});

function select(id,{fly}){

}

// ---------- Geologie (ISPRA): CARG 1:50 000 und Carta Geologica d'Italia 1:100 000 ----------
// Die Daten liegen in eigenen Dateien (geologie/*.json) und werden erst beim Einschalten geladen.
// Format: units = [[Name, Sigel, Alter, Legendenklasse, …]], legend = [{l: Text, c: Farbe, g: Gruppe, o: Rang}],
// polys = [[Einheit, [Ring, Ring, …]]], Ring = Koordinaten in 1/100 000 Grad, delta-kodiert (x, y abwechselnd).
const GEO_LAYERS={
  carg:{label:'CARG', title:'CARG-Datenbank: Geologische Karte 1:50 000, in 1:25 000 aufbereitet (11 Blätter)', file:'geologie/carg.json', tett:'geologie/carg_tett.json'},
  g100:{label:'1:100 000', title:'Carta Geologica d’Italia 1:100 000, ganz Kampanien', file:'geologie/g100.json', tett:'geologie/g100_tett.json'}
};
const GROUP_ORDER=['Vulkanite','Quartär, nicht vulkanisch','Neogen','Paläogen','Kreide','Jura','Trias','Perm','Paläozoikum','Sonstiges','unbekannt'];
const GEO_ATTR='Geologie © <a href="https://www.isprambiente.gov.it/it/progetti/cartella-progetti-in-corso/suolo-e-territorio-1/progetto-carg-cartografia-geologica-e-geotematica" target="_blank" rel="noopener">ISPRA – Servizio Geologico d’Italia</a>';
map.createPane('geology'); map.getPane('geology').style.zIndex=350;
map.getPane('geology').style.pointerEvents='none';   // Flächen fangen keine Klicks ab – Abfrage läuft über map.on('click')
map.createPane('faults'); map.getPane('faults').style.zIndex=360; map.getPane('faults').style.pointerEvents='none';
const geoRenderer=L.canvas({pane:'geology', padding:0.3});
const faultRenderer=L.canvas({pane:'faults', padding:0.3});
const geoData={}, geoLoading={}, geoLayers={}, faultLayers={};
let geoStatus='', geoHit, geoAttrOn=false;

function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function decodeRing(d){ const pts=[]; let x=0,y=0; for(let i=0;i<d.length;i+=2){ x+=d[i]; y+=d[i+1]; pts.push([y/1e5,x/1e5]); } return pts; }
function loadGeo(k){
  if(geoData[k]) return Promise.resolve(geoData[k]);
  if(geoLoading[k]) return geoLoading[k];
  geoLoading[k]=(async()=>{
    let raw, tt;
    try{
      const [r1,r2]=await Promise.all([fetch(GEO_LAYERS[k].file),fetch(GEO_LAYERS[k].tett)]);
      if(!r1.ok) throw new Error(r1.status);
      raw=await r1.json(); tt=r2.ok?await r2.json():null;
    }catch(e){
      // lokal geöffnete Datei (file://): fetch ist gesperrt, ein Skript-Tag geht (geologie/*.js setzt window.DEECKE_GEO)
      const name=f=>f.replace(/^.*\//,'').replace(/\.json$/,'');
      await loadScript(GEO_LAYERS[k].file.replace(/\.json$/,'.js'));
      try{ await loadScript(GEO_LAYERS[k].tett.replace(/\.json$/,'.js')); }catch(e2){}
      const G=window.DEECKE_GEO||{}; raw=G[name(GEO_LAYERS[k].file)]; tt=G[name(GEO_LAYERS[k].tett)];
      if(!raw) throw new Error('keine Daten');
    }
    tt=tt||{classes:[],lines:[]};
    const polys=raw.polys.map(([u,rings])=>{
      let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
      const R=rings.map(d=>{ const p=decodeRing(d); for(const [la,lo] of p){ if(lo<x0)x0=lo; if(lo>x1)x1=lo; if(la<y0)y0=la; if(la>y1)y1=la; } return p; });
      return {u,R,bb:[x0,y0,x1,y1]};
    });
    geoData[k]={units:raw.units, legend:raw.legend, polys, tett:{classes:tt.classes, lines:tt.lines.map(([c,dsh,d])=>({c,dsh,p:decodeRing(d)}))}};
    return geoData[k];
  })();
  geoLoading[k].catch(()=>{ delete geoLoading[k]; });
  return geoLoading[k];
}
const unitColor=(k,u)=>{ const G=geoData[k]; return G.legend[G.units[u][3]].c; };
function styleGeo(){ const L_=geoLayers[state.geo]; if(!L_) return; L_.eachLayer(p=>p.setStyle({opacity:Math.min(1,state.geoOp+0.15),fillOpacity:state.geoOp})); }
function buildGeo(k){
  const g=L.layerGroup(), G=geoData[k];
  for(const f of G.polys){ const c=unitColor(k,f.u);
    L.polygon(f.R,{renderer:geoRenderer,pane:'geology',interactive:false,weight:0.4,color:c,opacity:Math.min(1,state.geoOp+0.15),fillColor:c,fillOpacity:state.geoOp,fillRule:'evenodd'}).addTo(g); }
  return g;
}
function buildFaults(k){
  const g=L.layerGroup(), col=css('--fault');
  for(const l of geoData[k].tett.lines) L.polyline(l.p,{renderer:faultRenderer,pane:'faults',interactive:false,color:col,weight:1.2,opacity:0.85,dashArray:l.dsh?'4 3':null}).addTo(g);
  return g;
}
function showFaults(){
  for(const [k,l] of Object.entries(faultLayers)) map.removeLayer(l);
  if(state.geo && state.faults && geoData[state.geo]){ if(!faultLayers[state.geo]) faultLayers[state.geo]=buildFaults(state.geo); faultLayers[state.geo].addTo(map); }
  renderGeoUI();
}
async function setGeo(k){
  if(state.geo && geoLayers[state.geo]) map.removeLayer(geoLayers[state.geo]);
  state.geo=k; geoHit=undefined; renderBaseCtl();
  if(geoAttrOn!==!!k){ k ? map.attributionControl.addAttribution(GEO_ATTR) : map.attributionControl.removeAttribution(GEO_ATTR); geoAttrOn=!!k; }
  if(!k){ geoStatus=''; showFaults(); return; }
  geoStatus='load'; renderGeoUI();
  try{
    await loadGeo(k);
    if(state.geo!==k) return;                       // inzwischen umgeschaltet
    if(!geoLayers[k]) geoLayers[k]=buildGeo(k);
    styleGeo(); geoLayers[k].addTo(map); geoStatus='ok';
  }catch(e){ geoStatus='err'; }
  showFaults();
}
// Punkt-in-Polygon (gerade/ungerade Regel, passend zu Ringen mit Löchern)
function geoAt(k,lat,lon){
  const G=geoData[k]; if(!G) return undefined;
  for(let i=G.polys.length-1;i>=0;i--){ const f=G.polys[i], b=f.bb; if(lon<b[0]||lon>b[2]||lat<b[1]||lat>b[3]) continue;
    let ins=false;
    for(const r of f.R) for(let a=0,j=r.length-1;a<r.length;j=a++){
      const yi=r[a][0],xi=r[a][1],yj=r[j][0],xj=r[j][1];
      if(((yi>lat)!==(yj>lat)) && (lon<(xj-xi)*(lat-yi)/(yj-yi)+xi)) ins=!ins; }
    if(ins) return f.u; }
  return null;
}

const GeoInfoCtl=L.Control.extend({options:{position:'bottomleft'},onAdd(){ const d=L.DomUtil.create('div','mapbox geoinfo'); L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d); this._d=d; return d; }});
const geoInfoCtl=new GeoInfoCtl().addTo(map);
const GeoLegCtl=L.Control.extend({options:{position:'bottomright'},onAdd(){ const d=L.DomUtil.create('div','mapbox legend geoleg'); L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d); this._d=d; return d; }});
const geoLegCtl=new GeoLegCtl().addTo(map);
let geoLegOpen=false;
function renderGeoUI(){
  const info=geoInfoCtl._d, leg=geoLegCtl._d;
  info.hidden=!state.geo; leg.hidden=!(state.geo && geoStatus==='ok');
  if(!state.geo) return;
  const lay=GEO_LAYERS[state.geo], G=geoData[state.geo];
  let body;
  if(geoStatus==='load') body='Geologie wird geladen …';
  else if(geoStatus==='err') body='Die Geologie-Daten konnten nicht geladen werden. Sie müssen im Ordner <span class="mono">geologie/</span> neben der Seite liegen.';
  else if(geoHit===undefined) body='Tippe auf die Karte, um die Einheit an dieser Stelle abzufragen.';
  else if(geoHit===null) body = state.geo==='carg' ? 'Hier gibt es keine CARG-Fläche (Meer, bebaut oder Blatt fehlt).' : 'Hier ist keine Einheit kartiert.';
  else { const u=G.units[geoHit], lg=G.legend[u[3]];
    const extra = state.geo==='carg' ? [u[2], u[5]&&u[5]!=='unità quaternaria'?u[5]:'', 'Blatt '+u[4]].filter(Boolean).join(' · ') : u[2];
    body=`<span class="sq" style="background:${lg.c}"></span>${u[1]?`<b class="mono">${esc(u[1])}</b> `:''}<b>${esc(u[0])}</b><small>${esc(extra)}</small><small>${esc(lg.l)}</small>${state.geo==='g100'&&u[4]?`<details class="gdesc"><summary>Legendentext</summary>${esc(u[4])}</details>`:''}`; }
  info.innerHTML=`<div class="ttl">ISPRA · ${esc(lay.label)}</div><div class="gi">${body}</div>`;
  if(geoStatus!=='ok') return;
  // Legende: nur Klassen, die im Datensatz vorkommen, gruppiert
  const byG=new Map();
  G.legend.forEach(l=>{ if(!byG.has(l.g)) byG.set(l.g,[]); byG.get(l.g).push(l); });
  const groups=[...byG.keys()].sort((a,b)=>GROUP_ORDER.indexOf(a)-GROUP_ORDER.indexOf(b));
  const fl = state.faults && G.tett.lines.length ? `<div class="grp">Tektonik</div><div class="row"><span class="ln"></span><span>Störung, sicher</span></div><div class="row"><span class="ln dsh"></span><span>Störung, vermutet oder verdeckt</span></div>` : '';
  leg.innerHTML=`<details ${geoLegOpen?'open':''}><summary>Legende ${esc(lay.label)} (${G.legend.length})</summary>`+
    groups.map(g=>`<div class="grp">${esc(g)}</div>`+byG.get(g).sort((a,b)=>a.o-b.o).map(l=>`<div class="row"><span class="sq" style="background:${l.c}"></span><span>${esc(l.l)}</span></div>`).join('')).join('')+fl+`</details>`;
  leg.querySelector('details').addEventListener('toggle',e=>{ geoLegOpen=e.target.open; });
}
map.on('click',e=>{ if(!state.geo||geoStatus!=='ok') return; geoHit=geoAt(state.geo,e.latlng.lat,e.latlng.lng); renderGeoUI(); });
renderGeoUI();

// ---------- Ereignisse ----------
let qt;
$('#q').addEventListener('input',e=>{ clearTimeout(qt); qt=setTimeout(()=>{ state.q=norm(e.target.value.trim()); update(); },120); });
$('#qclear').addEventListener('click',()=>{ $('#q').value=''; state.q=''; update(); $('#q').focus(); });
$('#fTour').addEventListener('change',e=>{ state.kap=e.target.value; update(); fitVisible(); });
$('#fLage').addEventListener('change',e=>{ state.lage=e.target.value; update(); });
$('#fZug').addEventListener('change',e=>{ state.zug=e.target.value; update(); });
$('#fView').addEventListener('change',e=>{ state.view=e.target.checked; update(); });
$('#reset').addEventListener('click',()=>{
  Object.assign(state,{q:'',types:new Set(TYPES.map(t=>t.k)),kap:'',lage:'',zug:'',view:false,rad:0});
  $('#q').value=''; $('#fTour').value=''; $('#fLage').value=''; $('#fZug').value=''; $('#fRad').value='0'; $('#fView').checked=false;
  update(); fitVisible();
});
$('#fRad').addEventListener('change',e=>{ state.rad=+e.target.value; update(); fitNear(); });
function fitVisible(){
  const pts=D.filter(o=>hasLoc(o)&&matches(o)).map(o=>[o.la,o.lo]);
  if(pts.length) map.fitBounds(L.latLngBounds(pts),{padding:[24,24],maxZoom:14});
}

// ---------- Eigener Standort (Geolocation-API des Browsers) ----------
// Der Browser fragt beim ersten Klick um Erlaubnis. Funktioniert nur auf https-Seiten
// (z. B. GitHub Pages) und in lokal geöffneten Dateien, nicht in jeder eingebetteten Vorschau.
const LOC_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>';
let watchId=null, meDot=null, meAcc=null, firstFix=true, lastUpd=null;
const LocCtl=L.Control.extend({options:{position:'topleft'},onAdd(){
  const d=L.DomUtil.create('div','leaflet-bar');
  const a=L.DomUtil.create('a','locbtn',d); a.href='#'; a.role='button'; a.title='Lokalitäten in meiner Nähe'; a.setAttribute('aria-label','Lokalitäten in meiner Nähe'); a.innerHTML=LOC_SVG;
  L.DomEvent.on(a,'click',e=>{ L.DomEvent.preventDefault(e); L.DomEvent.stopPropagation(e); watchId===null ? startLoc() : stopLoc(); });
  this._a=a; return d; }});
const locCtl=new LocCtl().addTo(map);
function locMsg(text, ok){ const m=$('#locmsg'); m.hidden=!text; m.textContent=text||''; m.classList.toggle('ok',!!ok); }
function startLoc(){
  if(!('geolocation' in navigator)){ locMsg('Dieser Browser kann keinen Standort bestimmen.'); return; }
  if(window.isSecureContext===false){ locMsg('Der Standort ist nur auf sicheren Seiten (https) verfügbar.'); return; }
  firstFix=true; locCtl._a.classList.add('wait'); locMsg('Standort wird bestimmt …',true);
  watchId=navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,maximumAge:15000,timeout:20000});
}
function stopLoc(){
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  watchId=null; state.near=null; lastUpd=null;
  if(meDot){ map.removeLayer(meDot); map.removeLayer(meAcc); meDot=meAcc=null; }
  locCtl._a.classList.remove('on','wait'); $('#nearRow').hidden=true; locMsg('');
  update(); if(state.sel) renderDetail(byId.get(state.sel));
}
function onPos(p){
  const me={la:p.coords.latitude, lo:p.coords.longitude}, acc=p.coords.accuracy||0;
  locCtl._a.classList.remove('wait'); locCtl._a.classList.add('on');
  const col=css('--me');
  if(!meDot){
    // Wichtig: derselbe Canvas-Renderer wie die Punkte. Eine eigene Canvas-Ebene darüber
    // würde alle Mausereignisse abfangen (keine Tooltips, keine Klicks mehr).
    meAcc=L.circle([me.la,me.lo],{renderer,radius:acc,color:col,weight:1,opacity:.5,fillColor:col,fillOpacity:.12,interactive:false}).addTo(map);
    meAcc.bringToBack();
    meDot=L.circleMarker([me.la,me.lo],{renderer,radius:7,color:css('--halo'),weight:2.5,fillColor:col,fillOpacity:1,interactive:false}).addTo(map);
  } else { meAcc.setLatLng([me.la,me.lo]).setRadius(acc); meDot.setLatLng([me.la,me.lo]); }
  // Liste nur neu sortieren, wenn man sich merklich bewegt hat (> 100 m), damit sie nicht ständig springt
  if(!lastUpd || distKm(lastUpd,me)>0.1){
    lastUpd=me; state.near=me;
    for(const o of D) o._d=hasLoc(o)?distKm(me,o):Infinity;
    $('#nearRow').hidden=false;
    update(); if(state.sel) renderDetail(byId.get(state.sel));
  }
  // grob: Rechteck um alle Lokalitäten plus etwa 5 km Rand
  const outside = me.la<40.35 || me.la>41.45 || me.lo<13.75 || me.lo>15.35;
  locMsg(outside ? 'Du bist außerhalb Kampaniens – die Liste zeigt trotzdem die nächstgelegenen Lokalitäten.' : `Standort gefunden (± ${fmtInt(Math.round(acc))} m). Die Liste ist nach Entfernung sortiert.`, !outside);
  if(firstFix){ firstFix=false; fitNear(); }
}
function onPosErr(e){
  locCtl._a.classList.remove('wait');
  const t = e.code===1 ? 'Standortzugriff abgelehnt. Erlaube ihn in den Einstellungen des Browsers für diese Seite und tippe erneut auf den Standort-Knopf.'
          : e.code===3 ? 'Der Standort konnte nicht rechtzeitig bestimmt werden. Versuch es im Freien noch einmal.'
          : 'Der Standort ist gerade nicht verfügbar. In manchen eingebetteten Vorschauen ist er gesperrt; auf der Website funktioniert er.';
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  watchId=null; if(!meDot){ locCtl._a.classList.remove('on'); } locMsg(t);
}
function fitNear(){
  if(!state.near) return;
  if(state.rad){ map.fitBounds(L.latLng(state.near.la,state.near.lo).toBounds(state.rad*2000),{padding:[10,10]}); }
  else map.flyTo([state.near.la,state.near.lo],Math.max(map.getZoom(),11),{duration:0.6});
}

map.on('zoomend',()=>{ const r=radius(); for(const m of markers.values()) m.setRadius(r); if(selRing) selRing.setRadius(r+6); refreshCities(); });
map.on('moveend',()=>{ if(state.view) update(); });

// Theme-Wechsel: Canvas-Farben neu aus den Tokens lesen
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(restyle,30));
new MutationObserver(()=>setTimeout(restyle,30)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

// ---------- Start ----------
map.fitBounds(L.latLngBounds(D.filter(hasLoc).map(o=>[o.la,o.lo])),{padding:[16,16]});
drawLand();
refreshCities();
setBase(state.base);
update();
const h=/^#n(\d+)$/.exec(location.hash||'');
if(h && byId.has(+h[1])) select(+h[1],{fly:true});
})();
</script>
</body>
</html>

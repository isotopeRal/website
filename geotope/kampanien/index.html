ht","zg":"frei","sg":"Parco Regionale dei Campi Flegrei","g":"Strandsee in einer Senke der Caldera","l":"genau","la":40.821,"lo":14.0555,"c":"Bacoli (NA)","ex":"Monte di Procida, Capo Miseno, Bacoli. Wer mit der Ferrovia Cumana bis zum Lago Fusaro fährt, kann in !/, bis 3/, Tag die letzten geologisch interessanten Punkte der Phlegràischen Felder aufsuchen. Die Bahn endigt am Südende des Fusaro-Sees, an der Torre Gaveta. Letztere bezeichnet einen steil gegen das Meer abstürzenden Felsen von gelbem Tuff mit allerlei römischen Substructionen. Er lenkt die Sandmassen der nördlichen Küste ab, und deshalb haben schon die Alten den Abflusskanal des Fusaro-Sees durch diesen Tuffklotz hindurch gebaut; neuerdings hat die Lagune einen zweiten Abfluss durch die Dünen an ihrem Nordende erhalten. […]","sp":96,"u1":["Area non rilevabile","","","Napoli","Nicht kartierbar (bebaut)","#d6d6d2"],"u2":["(ohne Bezeichnung)","","Alter nicht angegeben","#c4c4c4"]},{"id":54,"k":3,"r":"Monte di Procida – Capo Miseno – Bacoli","s":96,"t":"A","b":"Nordende des Monte di Procida, Steilwand bei Torre Gaveta: mächtige Breccien unter Gelbtuff mit Obsidian, Bims, Mandelsteinen, Leucitgestein und marinen Muscheln","n":"Kliff von Torregaveta – Monte di Procida","z":"Steilwand am Strand, nur bei ruhiger See begehbar; Steinschlag","zg":"eingeschränkt","sg":"Parco Regionale dei Campi Flegrei","g":"Proximale Breccien unter dem Gelbtuff (u. a. Breccia Museo des Kampanischen Ignimbrits)","l":"geschätzt","la":40.81,"lo":14.043,"c":"Monte di Procida (NA)","ex":"[…] Man nimmt vielfach an, dass letzterer vor dem Hügel im Meere gelegen habe, womit die Form des Rückens nicht stimmt, falis nicht nachträgliche lokale Senkungen eingetreten sind. Am Nordende des Mte. di Procida, also an der Südseite der kleinen Bucht bei Torre Gaveta, sind an der Steilwand mächtige Breccien unter gelbem Tuff entwickelt, die wegen der Mannigfaltigkeit der darin enthaltenen Gesteine einen Besuch lohnen. Trachytobsidiane, Glastrachyte, Bimsstein, eigenthümliche Mandelsteintuffe mit Kieselsäure als Ausfüllung der Mandeln, zahlreiche schaumig schlackige Bomben mit Zeolithen und angeblich auch leucit- Fig. 13. Das Cap Miseno, von Bacoli gesehen. […]","sp":96},{"id":55,"k":3,"r":"Monte di Procida – Capo Miseno – Bacoli","s":98,"t":"A","b":"Schwarzer, schlackiger Trachytstrom am Fuß der Seeseite, an der Punta di Fumo und im Scoglio di S. Martino","n":"Scoglio di San Martino, Monte di Procida","z":"Felsküste mit Badeplätzen (Acquamorta)","zg":"frei","sg":"Parco Regionale dei Campi Flegrei","g":"Ältere Lava am Westrand der Caldera","l":"geschätzt","la":40.7935,"lo":14.04,"c":"Monte di Procida (NA)","ex":"[…] Weit kommt man in der Regel nicht. Die Seeseite des Rückens birgt am Fusse einen schwarzen schlackigen Trachytstrom, der an der Punta di Fumo und in dem Scoglio di S. Martino hervortritt. Auf der Landseite sind dieselben von der Südspitze her längs des Strandes zugänglich; sonst muss man die neue Strasse einschlagen, welche von Torre Gaveta über den Mte. di Procida nach dem Strande zwischen Scoglio S. Martino und der Punta di Fumo führt. u di Der Südfuss des Mte. di Procida berührt eine andere Lagune, das Mare morto (von Torre Gaveta 21/, km), welche durch einen vielleicht zur Römerzeit aufgeschiitteten Damm, die Spiaggia di Miniscola von der offenen See getrennt wird. […]","sp":98},{"id":56,"k":3,"r":"Monte di Procida – Capo Miseno – Bacoli","s":98,"t":"K","b":"Mare morto: Lagune hinter der Spiaggia di Miniscola, Teil der Häfen von Misenum; kein Krater","n":"Lago Miseno (Mare Morto) und Spiaggia di Miliscola","z":"Lagune und Badestrand","zg":"frei","sg":"Parco Regionale dei Campi Flegrei","g":"Lagune hinter einem Strandwall","l":"genau","la":40.7925,"lo":14.0735,"c":"Bacoli (NA)","ex":"[…] Die Seeseite des Rückens birgt am Fusse einen schwarzen schlackigen Trachytstrom, der an der Punta di Fumo und in dem Scoglio di S. Martino hervortritt. Auf der Landseite sind dieselben von der Südspitze her längs des Strandes zugänglich; sonst muss man die neue Strasse einschlagen, welche von Torre Gaveta über den Mte. di Procida nach dem Strande zwischen Scoglio S. Martino und der Punta di Fumo führt. u di Der Südfuss des Mte. di Procida berührt eine andere Lagune, das Mare morto (von Torre Gaveta 21/, km), welche durch einen vielleicht zur Römerzeit aufgeschiitteten Damm, die Spiaggia di Miniscola von der offenen See getrennt wird. […]","sp":98,"u2":["(ohne Bezeichnung)","","Alter nicht angegeben","#c4c4c4"]},{"id":57,"k":3,"r":"Monte di Procida – Capo Miseno – Bacoli","s":98,"t":"V","b":"Capo Miseno: radialer Ausschnitt eines im Meer versunkenen Kraterkegels, ursprünglich Insel wie Nisida; herrliche Aussicht","n":"Capo Miseno","z":"Wanderweg zum Gipfel und Leuchtturm","zg":"frei","sg":"Parco Regionale dei Campi Flegrei","g":"Tuffkegel, zur Hälfte vom Meer abgetragen","l":"genau","la":40.7787,"lo":14.089,"c":"Bacoli (NA)","ex":"[…] Dieses Wasserbecken hat zu den Häfen am Cap Miseno gehört, kann aber wegen’ seiner Flachheit nur eine Art Bootshafen gewesen sein. Ein Krater, wie manche behauptet haben, ist es keineswegs. Um dies Becken herum führt der Weg nach Bacoli und zum Cap Miseno. . Letzteres mit seiner malerischen Form lässt sich am besten als einen radialen Ausschnitt aus einem im Meere versunkenen Kraterkegel auffassen, dessen Schlot SW. von der höchsten Spitze zu suchen wäre (Fig. 13). Es besteht aus mächtigen Tuffwänden mit oberflächlicher Bimssteinbedeckung. Die Aussicht von der Höhe ist herrlich, geologisch bietet der Punkt wenig Neues. […]","sp":98,"u1":["Tufo di capo miseno","TCM","Holozän","Procida","Pyroklastite, Holozän","#f09660"],"u2":["Tufo inferiore giallo-biancastro stratificato","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":58,"k":3,"r":"Monte di Procida – Capo Miseno – Bacoli","s":99,"t":"V","b":"Porto di Miseno (kein Krater) und ein flacher runder Kessel bei Bacoli, oft als Kraterboden gedeutet","n":"Bacoli, Porto di Miseno","z":"Hafen und Ortslage","zg":"frei","sg":"Parco Regionale dei Campi Flegrei","g":"Teil der Caldera; Kraternatur unsicher","l":"geschätzt","la":40.7965,"lo":14.0815,"c":"Bacoli (NA)","ex":"[…] Das Cap war ursprünglich eine Insel ähnlich Nisida und ist durch den Sandstreifen verlandet, analog den Vorgebirgen Toscana’s. | Eine noch offene Frage ist schliesslich, ob man bei Bacoli auch einen Durchbruch des Magmas anzunehmen hat. Dass der Porto di Miseno, der Aussenhafen der römischen Anlagen, kein Krater ist, dürfte ziemlich sicher sein. Aber bei Bacoli existirt ein flacher runder Kessel zwischen dem Orte und dem Meer, der oft für einen Kraterboden erklärt ist. Die Aufschlüsse sind indessen zu ungenügend, um über die Genesis dieses Hügels ins Klare zu kommen. […]","sp":99,"u1":["Deposito colluviale","b7","Holozän","Procida","Hangschutt, Rutschmassen","#ecdeba"],"u2":["Prodotti piroclastici indifferenziati","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":59,"k":3,"r":"Monte di Procida – Capo Miseno – Bacoli","s":99,"t":"H","b":"Castello di Baja auf dem Rückweg nach Baja","n":"Castello Aragonese di Baia (Museo Archeologico dei Campi Flegrei)","z":"Museum geöffnet","zg":"frei","sg":"Parco Archeologico dei Campi Flegrei","g":"Tuffsporn über der Bucht von Baia","l":"genau","la":40.8094,"lo":14.0815,"c":"Bacoli (NA)","ex":"[…] Die Aufschlüsse sind indessen zu ungenügend, um über die Genesis dieses Hügels ins Klare zu kommen. Von Bacoli erreicht man an dem Castello di Baja vorbei den Ort selbst und die nach Neapel zurückfiihrende Bahn. ta 1: » \\ !ı BLITZER Jas ausserordentlich fruchtbare Ischia besucht || man von Neapel zu Schiff aus oder fährt BRRES| mit der Bahn nach Torre Gaveta, von wo Anschluss per Dampfboot stattfindet, oder man nimmt sich dort ein Segelboot. Die Insel ist 46,5 qkm gross und besitzt pyramidale Gestalt, da sich fast in ihrer Mitte der Mte. Epomeo bis 792 m erhebt. An der Ostseite unterbricht ein Seitenkegel, Mte. Campagnano, von 378 m Höhe den gleichmässigen Verlauf der Flanken. […]","sp":99,"u1":["Litosoma di bellavista","LVE","Oberpleistozän","Napoli","Pyroklastite, Holozän","#f09660"],"u2":["Tufo","Holozän","Neapolitanischer Gelbtuff (15 000 J.)","#e8c448"]},{"id":60,"k":4,"r":"Insel Ischia","s":100,"t":"V","b":"Monte Epomeo (792 m): Vulkanruine mit weitem, nach Süden offenem Gipfelbogen; Fontana liegt über dem alten, verstopften Krater; ringsum gelblicher Bimssteintuff","n":"Monte Epomeo, Gipfel mit der Einsiedelei San Nicola","z":"Wanderwege von Fontana und Serrara; Gipfel mit Felsenkirche","zg":"frei","sg":"Area Marina Protetta Regno di Nettuno (Küste); Wanderregion","g":"Kein Vulkankegel, sondern ein herausgehobener Block (Resurgenz) aus Grünem Epomeo-Tuff (ca. 55 000 Jahre), um rund 800 m gehoben","l":"genau","la":40.7316,"lo":13.8988,"c":"Casamicciola Terme (NA)","ex":"BLITZER Jas ausserordentlich fruchtbare Ischia besucht || man von Neapel zu Schiff aus oder fährt BRRES| mit der Bahn nach Torre Gaveta, von wo Anschluss per Dampfboot stattfindet, oder man nimmt sich dort ein Segelboot. Die Insel ist 46,5 qkm gross und besitzt pyramidale Gestalt, da sich fast in ihrer Mitte der Mte. Epomeo bis 792 m erhebt. An der Ostseite unterbricht ein Seitenkegel, Mte. Campagnano, von 378 m Höhe den gleichmässigen Verlauf der Flanken. Ischia ist ein einheitlicher, in sich abgeschlossener Vulkan, dessen Thätigkeit weit in das Quartär, vielleicht bis in die Pliocänzeit hinaufreicht. […]","sp":100,"u2":["Tufo trachitico","Oberpleistozän","Pyroklastite, Oberpleistozän (jünger als 126 000 J.)","#d67446"]},{"id":61,"k":4,"r":"Insel Ischia","s":101,"t":"A","b":"„Creta“: mergeliges Abschwemmprodukt des Tuffs bis 250 m Höhe mit marinen Muscheln, Beweis einer Hebung; Rohstoff der Töpfereien","n":"Mergel- und Tonvorkommen am Nordfuß des Epomeo (Casamicciola)","z":"Abbau eingestellt; die Hänge gelten als rutschgefährdet","zg":"frei","sg":"–","g":"Marine und umgelagerte Sedimente, durch die Resurgenz des Epomeo-Blocks gehoben (marine Fossilien bis über 700 m Höhe)","l":"geschätzt","la":40.744,"lo":13.911,"c":"Casamicciola Terme (NA)","ex":"ist im Norden, Osten und z. Th. im Süden und zwar bis 250 m üb. d. M. umsäumt von einem mergeligen Zersetzungs- und Abschwemmungsprodukte dieses Tuffes, das „Creta“ heilst und zu mancherlei Töpfereien seit undenklichen Zeiten dient. In dieser gleichmässigen, ausgeschlämmten Creta stecken lokal marine Muscheln, weshalb kein Zweifel besteht, dass der Berg einst tiefer im Meere stand und seitdem eine nicht unbeträchtliche Hebung erfuhr. Analoges Aufsteigen und Sinken hat neuerdings Bergeat an den Inselvulkanen der Liparen beobachtet. Die zugehörigen Ergüsse des Hauptkraters sind nur zum kleinen Theile sichtbar. […]","sp":101,"u2":["Tufiti e sabbie di dilavamento","Oberpleistozän","Lockersedimente, Pleistozän","#f6e6a0"]},{"id":62,"k":4,"r":"Insel Ischia","s":101,"t":"A","b":"Trachyte am Monte Vetta (Trippiti, 511 m) östlich des Epomeo, sehr sodalithreich","n":"Monte Trippodi / Vetta, Ostflanke des Epomeo","z":"Wanderweg Epomeo–Fiaiano","zg":"frei","sg":"–","g":"Trachytische Lavadome am Rand des Epomeo-Blocks","l":"geschätzt","la":40.729,"lo":13.9145,"c":"Barano d'Ischia (NA)","ex":"[…] Die zugehörigen Ergüsse des Hauptkraters sind nur zum kleinen Theile sichtbar. An der Ostseite des Epomeo im Mte. Vetta und südlich desselben im Mte. Garofali zwischen Piejo und Moropano stehen Trachyte an, die vielleicht dem centralen Schlote entflossen sind. Ferner können viele der längs der steilen Südküste sich überdeckenden Laven zum Epomeo gehören. Aber relativ früh erlosch derselbe, und es öffneten sich dafür die Flanken, durch welche bis in das Mittelalter hinein seitliche Lavaausflüsse aus parasitischen Kegelbildungen stattfanden. […]","sp":101,"u2":["Tufiti e sabbie di dilavamento","Oberpleistozän","Lockersedimente, Pleistozän","#f6e6a0"]},{"id":63,"k":4,"r":"Insel Ischia","s":113,"t":"A","b":"Monte Garofali (231 m) bei Piejo: hellgrauer, kristalliner Trachyt mit großen Sanidinen","n":"Monte Garofoli bei Piedimonte, Barano d'Ischia","z":"Lage geschätzt","zg":"unklar","sg":"–","g":"Trachyt-Lavadom im Südosten der Insel","l":"geschätzt","la":40.7165,"lo":13.9255,"c":"Barano d'Ischia (NA)","ex":"[…] Ungefähr 2 km von Bagno d’Ischia entfernt lässt sich durch einen Abstecher von der Fahrstrasse nach Norden der Ausbruchspunkt Le Cremate erreichen, ein halbkreisförmiger Schlackenwall. Ueber Zabutti, Starza, Casa Buona in fruchtbarem Bimssteintuffgelinde kommt man rechts abbiegend nach Piejo, wo am Mte. Garofali (231 m) abermals ein hellgrauer krystalliner Trachyt mit grossen Sanidinen und langen braunen Augiten ansteht. […]","sp":113,"u2":["Sabbie pomicee","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":64,"k":4,"r":"Insel Ischia","s":102,"t":"K","b":"Steilufer zwischen Punta Imperatore und Capo Negro: viele Trachytlaven streichen gegen das Meer aus","n":"Punta Imperatore, Forio","z":"Leuchtturm, Steilküste","zg":"frei","sg":"Area Marina Protetta Regno di Nettuno","g":"Ältere Laven und Tuffe (älter als 55 000 Jahre) im Südwesten","l":"genau","la":40.7115,"lo":13.853,"c":"Forio (NA)","ex":"Unterschiede, dass sie weiter zurück liegen und daher weniger deutliche Spuren hinterlassen haben. Beginnen wir die allgemeine geologische Schilderung der Insel im Südwesten, so streichen an den Steilufern zwischen der Punta del Imperatore und dem Capo Negro eine Menge Trachytlaven gegen die See aus, deren Schlote unter dem gelben Tuff der Höhen versteckt sein werden, und die vielleicht submarin ergossen wurden. Einem weiteren Seitenausbruch entspricht das trachytische, mit schmaler Landzunge der Insel angegliederte Vorgebirge S. Angelo. Drittens wären im Südosten mehrere Trachytmassen und ziemlich mächtige Schlacken- und Bimssteinanhäufungen rings um den Mte. Campagnano zu nennen. . […]","sp":102,"u2":["Vulcaniti trachifonolitiche dell'isola d'ischia","Oberpleistozän","Pyroklastite, Oberpleistozän (jünger als 126 000 J.)","#d67446"]},{"id":65,"k":4,"r":"Insel Ischia","s":102,"t":"V","b":"Vorgebirge Sant'Angelo: trachytischer Seitenausbruch, durch eine schmale Landzunge mit der Insel verbunden","n":"Sant’Angelo, Serrara Fontana","z":"Fischerdorf; Fels über die Landbrücke erreichbar","zg":"frei","sg":"Area Marina Protetta Regno di Nettuno","g":"Älterer Lavadom mit Tombolo","l":"genau","la":40.695,"lo":13.893,"c":"Serrara Fontana (NA)","ex":"[…] Beginnen wir die allgemeine geologische Schilderung der Insel im Südwesten, so streichen an den Steilufern zwischen der Punta del Imperatore und dem Capo Negro eine Menge Trachytlaven gegen die See aus, deren Schlote unter dem gelben Tuff der Höhen versteckt sein werden, und die vielleicht submarin ergossen wurden. Einem weiteren Seitenausbruch entspricht das trachytische, mit schmaler Landzunge der Insel angegliederte Vorgebirge S. Angelo. Drittens wären im Südosten mehrere Trachytmassen und ziemlich mächtige Schlacken- und Bimssteinanhäufungen rings um den Mte. Campagnano zu nennen. . […]","sp":102,"u2":["Vulcaniti trachifonolitiche dell'isola d'ischia","Oberpleistozän","Pyroklastite, Oberpleistozän (jünger als 126 000 J.)","#d67446"]},{"id":66,"k":4,"r":"Insel Ischia","s":102,"t":"V","b":"Monte Campagnano (378 m): stark abgetragener Seitenkegel über älteren Trachytergüssen; Trachyt an der Südseite, Laven bei Punta di Pisciazza","n":"Monte Campagnano, Ischia","z":"Weinberge und Weiler","zg":"frei","sg":"–","g":"Trachyt-Dome und Tuffe im Osten der Insel","l":"genau","la":40.7175,"lo":13.9575,"c":"Ischia (NA)","ex":"[…] Einem weiteren Seitenausbruch entspricht das trachytische, mit schmaler Landzunge der Insel angegliederte Vorgebirge S. Angelo. Drittens wären im Südosten mehrere Trachytmassen und ziemlich mächtige Schlacken- und Bimssteinanhäufungen rings um den Mte. Campagnano zu nennen. . Dieser stark abgewaschene, früher sicher sehr bedeutende Seitenkegel, der bei Ansicht von Nordosten her das doppelspitzige Profil der Insel bedingt, ruht auf einem älteren System von Trachytergüssen mit zwischengelagerten Tuffen, so dass dort wiederholt das Magma hervorgebrochen sein muss. Der Ostseite ist. der Trachytfelsen von Ischia ebenso vorgelagert wie der Südküste der Mte. S. Angelo. […]","sp":102,"u2":["Sabbie pomicee","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":67,"k":4,"r":"Insel Ischia","s":102,"t":"H","b":"Trachytfelsen von Ischia (Castello): Lavapfropfen im Tuff; 1901 nicht zugänglich, Bruchstücke am Strand (Sodalith, Eisenglanz, Rinkit, Lävenit)","n":"Castello Aragonese, Ischia Ponte","z":"Burg und Museum, zugänglich","zg":"frei","sg":"Area Marina Protetta Regno di Nettuno","g":"Trachytischer Lavadom, einer der älteren Ischias","l":"genau","la":40.731,"lo":13.965,"c":"Ischia (NA)","ex":"[…] Dieser stark abgewaschene, früher sicher sehr bedeutende Seitenkegel, der bei Ansicht von Nordosten her das doppelspitzige Profil der Insel bedingt, ruht auf einem älteren System von Trachytergüssen mit zwischengelagerten Tuffen, so dass dort wiederholt das Magma hervorgebrochen sein muss. Der Ostseite ist. der Trachytfelsen von Ischia ebenso vorgelagert wie der Südküste der Mte. S. Angelo. Der in dem Tuff des Castells steckende Trachyt macht den Eindruck eines in seinem oder in dem Epomeotuff erstarrten Lavapfropfens. Dann kommt an der Nordseite der i. J. 1302 ergossene, rauhe, noch immer wenig bewachsene Schlackenstrom, die sog. Arsolava. […]","sp":102,"u2":["Vulcaniti trachifonolitiche dell'isola d'ischia","Oberpleistozän","Pyroklastite, Oberpleistozän (jünger als 126 000 J.)","#d67446"]},{"id":68,"k":4,"r":"Insel Ischia","s":102,"t":"V","b":"Arsolava von 1302: rauer, wenig bewachsener Schlackenstrom, 2,5 km lang, vom Schlackenwall Le Cremate bis ins Meer (Punta Molina); olivinführender Sodalithtrachyt","n":"Colata dell'Arso (Pineta dell'Arso) bis Punta Molina","z":"Lavastrom heute großteils mit Pinien bewachsen und bebaut; letzter Ausbruch Ischias","zg":"frei","sg":"–","g":"Trachyt-Lavastrom der Eruption von 1302","l":"genau","la":40.7345,"lo":13.944,"c":"Ischia (NA)","ex":"wenig bewachsene Schlackenstrom, die sog. Arsolava. Dieselbe entquoll der Ostseite des Mte. Epomeo in ca. ein Viertel Höhe und hat einen halbkreisförmigen Schlackenwall „Le Cremate“ (200 m) um den Durchbruchspunkt durch Auswirflinge aufgethürmt. Der Strom ist 2!/, km lang und am unteren Ende 5/, km breit. Zwischen Mandra und Bagno d’Ischia erreichte er das Meer und schob sich, die heutige Punta Molina bildend, ein kurzes Stück in dasselbe vor. Weiter haben wir die beiden wohlerhaltenen trichterförmigen Krater Montagnone (298 m) und Rotaro (315 m), sowie vor ihnen am Ufer den eigenthümlichen Kratersee des Lago del Bagno. […]","sp":103,"u2":["Lava dell'arso","Holozän","Lava, Schlacke, Dom","#7a262e"]},{"id":69,"k":4,"r":"Insel Ischia","s":113,"t":"V","b":"Ausbruchspunkt Le Cremate: halbkreisförmiger Schlackenwall, 2 km von Bagno d'Ischia","n":"Le Cremate, Fiaiano","z":"Schlackenwall im Wald","zg":"frei","sg":"–","g":"Förderschlot der Arso-Eruption 1302","l":"geschätzt","la":40.73,"lo":13.9255,"c":"Barano d'Ischia (NA)","ex":"[…] Ausserdem treten allerlei Feldspathausscheidungen auf. Ungefähr 2 km von Bagno d’Ischia entfernt lässt sich durch einen Abstecher von der Fahrstrasse nach Norden der Ausbruchspunkt Le Cremate erreichen, ein halbkreisförmiger Schlackenwall. Ueber Zabutti, Starza, Casa Buona in fruchtbarem Bimssteintuffgelinde kommt man rechts abbiegend nach Piejo, wo am Mte. Garofali (231 m) abermals ein hellgrauer krystalliner Trachyt mit grossen Sanidinen und langen braunen Augiten ansteht. […]","sp":113,"u2":["Sabbie pomicee","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":70,"k":4,"r":"Insel Ischia","s":103,"t":"V","b":"Montagnone (298 m) und Rotaro (315 m): echte Explosionskrater aus Schlacken, Obsidian und kopfgroßen Bimssteinen","n":"Montagnone und Monte Rotaro, Casamicciola/Barano","z":"Bewaldete Krater, Wanderwege","zg":"frei","sg":"–","g":"Tuffringe und Dome der letzten Jahrtausende im Nordosten Ischias","l":"genau","la":40.7385,"lo":13.9195,"c":"Casamicciola Terme (NA)","ex":"[…] Zwischen Mandra und Bagno d’Ischia erreichte er das Meer und schob sich, die heutige Punta Molina bildend, ein kurzes Stück in dasselbe vor. Weiter haben wir die beiden wohlerhaltenen trichterförmigen Krater Montagnone (298 m) und Rotaro (315 m), sowie vor ihnen am Ufer den eigenthümlichen Kratersee des Lago del Bagno. Der letztere wird an seiner Aussenseite von zwei Trachytmassen flankirt, welche vielleicht die zugehörigen Laven sind. Montagnone und Rotaro sind echte Explosionskrater nach Art des Campiglione und Avernersees und bestehen aus Schlacken, Obsidianen und Bimssteinen. […]","sp":103,"u2":["Sabbie pomicee","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":71,"k":4,"r":"Insel Ischia","s":103,"t":"H","b":"Kratersee Lago del Bagno am Ufer, durch Einfassung und Kanal zum Bootshafen umgestaltet; Trachyte an der Außenseite","n":"Porto d’Ischia","z":"1854 zum Hafen geöffnet; Haupthafen der Insel","zg":"frei","sg":"–","g":"Kleiner Maar-Krater","l":"genau","la":40.745,"lo":13.942,"c":"Ischia (NA)","ex":"[…] Zwischen Mandra und Bagno d’Ischia erreichte er das Meer und schob sich, die heutige Punta Molina bildend, ein kurzes Stück in dasselbe vor. Weiter haben wir die beiden wohlerhaltenen trichterförmigen Krater Montagnone (298 m) und Rotaro (315 m), sowie vor ihnen am Ufer den eigenthümlichen Kratersee des Lago del Bagno. Der letztere wird an seiner Aussenseite von zwei Trachytmassen flankirt, welche vielleicht die zugehörigen Laven sind. Montagnone und Rotaro sind echte Explosionskrater nach Art des Campiglione und Avernersees und bestehen aus Schlacken, Obsidianen und Bimssteinen. […]","sp":103},{"id":72,"k":4,"r":"Insel Ischia","s":103,"t":"V","b":"Monte Tabor: kurzer, zähflüssiger Trachytstrom des Rotaro; hellroter Trachyt mit Sublimaten (Eisenglanz, Titanit, Hypersthen)","n":"Monte Tabor, Casamicciola","z":"Bebaut, Lage geschätzt","zg":"unklar","sg":"–","g":"Trachytlava des Rotaro","l":"geschätzt","la":40.7455,"lo":13.9255,"c":"Casamicciola Terme (NA)","ex":"[…] Diese erreichen über Kopfgrösse, und es scheint daher natürlich, viele der im Osten der Insel vorhandenen Aschen- und Bimssteinlagen diesen beiden Vulkanen zuzuschreiben. Noch ein vierter flacher Kegel, Mte. Tabor, ist nichts anderes als der mächtige, kurze, weil zähflüssige, Trachytstrom des Mte. Rotaro. Schliesslich findet sich in der Nordwestecke, in dem Vorgebirge der Punta Cornacchia ein mächtiger, 1 km breiter und 11/, km langer Trachyterguss, welcher keinem deutlichen Krater entflossen ist. Möglicher Weise bezeichnet die von der Strasse nach Forio benutzte Senke an der Nordwestseite des Mte. Marecoco die Eruptionsstelle. […]","sp":103,"u2":["Prodotti vari di lancio e scorie vitrofiriche","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":73,"k":4,"r":"Insel Ischia","s":112,"t":"F","b":"Heißes Wasser der Acqua di Castiglione; fossilführende Schichten an der Punta di Castiglione","n":"Punta Castiglione, Casamicciola","z":"Thermalbad am Ufer","zg":"frei","sg":"Area Marina Protetta Regno di Nettuno","g":"Thermalwasser und gehobene marine Schichten","l":"geschätzt","la":40.748,"lo":13.9265,"c":"Casamicciola Terme (NA)","ex":"[…] Der Trachyt dieser Anhöhe, wahrscheinlich ein Lavastrom des Rotaro, besitzt hellrothe Farbe, lockeres Gefüge und zeigt in den Hohlräumen allerlei Sublimationsprodukte: Eisenglanz, Sodalithkörnchen, gelblichbraune Augite, stark glänzende Titanite, Szaboit (Hyperstehn) und goldgelbe Glimmerblättchen. An seinem Ende kommt östlich der Punta della Scrofa in der Acqua di Castiglione heisses Wasser zu Tage, und am Meeresufer bei der Punta di Castiglione giebt C. W. C. Fuchs auf seiner geologischen Karte der Insel fossilführende Schichten an. Schliesslich nach Casamicciola oder Porto d’Ischia zurück. Eine dritte Excursion beginnt bei letzterem Orte, den man zu Wagen von Casamicciola erreichen mag. […]","sp":112,"u2":["Prodotti vari di lancio e scorie vitrofiriche","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":74,"k":4,"r":"Insel Ischia","s":103,"t":"V","b":"Punta Cornacchia: mächtiger Trachyterguss (1 × 1,5 km) ohne deutlichen Krater; Trachyt von Marecocco–Zale mit langen Sanidinen","n":"Lavastrom des Monte Zaro mit Punta Cornacchia, Forio","z":"Bewaldetes Vorgebirge, Wanderwege","zg":"frei","sg":"Area Marina Protetta Regno di Nettuno","g":"Zaro-Lava, einer der größten jungen Lavaströme Ischias (ca. 6 000–7 000 Jahre)","l":"genau","la":40.7505,"lo":13.8735,"c":"Forio (NA)","ex":"[…] Noch ein vierter flacher Kegel, Mte. Tabor, ist nichts anderes als der mächtige, kurze, weil zähflüssige, Trachytstrom des Mte. Rotaro. Schliesslich findet sich in der Nordwestecke, in dem Vorgebirge der Punta Cornacchia ein mächtiger, 1 km breiter und 11/, km langer Trachyterguss, welcher keinem deutlichen Krater entflossen ist. Möglicher Weise bezeichnet die von der Strasse nach Forio benutzte Senke an der Nordwestseite des Mte. Marecoco die Eruptionsstelle. […]","sp":103,"u2":["Sabbie pomicee","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":75,"k":4,"r":"Insel Ischia","s":105,"t":"F","b":"Thermen im Süden: Acqua dell'Olmitello, della Cavascura und die fast kochende Acqua Marina delli Maronti im Strandsand","n":"Strand der Maronti mit Olmitello und Cavascura, Barano","z":"Thermalquellen und Fumarolen am Strand; Terme Cavascura in Betrieb","zg":"frei","sg":"Area Marina Protetta Regno di Nettuno","g":"Fumarolen und Thermalwasser am Südrand des Epomeo-Blocks","l":"genau","la":40.6995,"lo":13.9105,"c":"Barano d'Ischia (NA)","ex":"selbst hervor. Sie heissen Acqua dell’ Olmitello, della Cavascura und Acqua Marina delli Maronti, welch letztere beinahe kochend wenige Meter vom Ufer, mit viel Kohlensäure beladen, durch den Sand hervordringt. […]","sp":105},{"id":76,"k":4,"r":"Insel Ischia","s":105,"t":"F","b":"Heiße Quellen von Casamicciola (Gurgitello, Sorgente dei Denti, Bagni Manzi) und die rauschende Acqua del Tamburo","n":"Thermalquellen von Casamicciola (Gurgitello, Bagno Manzi)","z":"Thermalhotels in Betrieb; Ort 2017 von Erdbeben und 2022 von einer Schlammlawine schwer getroffen","zg":"frei","sg":"–","g":"Thermalfeld am Nordrand des Epomeo-Blocks","l":"genau","la":40.7465,"lo":13.91,"c":"Casamicciola Terme (NA)","ex":"[…] Sie heissen Acqua dell’ Olmitello, della Cavascura und Acqua Marina delli Maronti, welch letztere beinahe kochend wenige Meter vom Ufer, mit viel Kohlensäure beladen, durch den Sand hervordringt. An der Nordseite folgen von Osten nach Westen die Mineralbäder von Bagni d’Ischia, die heissen Dampfquellen der Stufe di S. Gerolamo auf der Arsolava, auf der des Mte. Tabor, die heissen Quellen Casamieciola’s, unter denen die Gurgitello genannte eine der wichtigsten ist; andere bei diesem Orte heissen Sorgente dei Denti, delle Sabbie, dei Bagni Manzi u.s. w. Ein eigenthümliches Geräusch kurze Zeit vor dem Austreten von Dampfstrahlen lässt die Acqua del Tamburo hören, welche nach den an Trommelwirbel erinnernden Tönen ihren Namen trägt. […]","sp":105,"u2":["Tufo trachitico","Oberpleistozän","Pyroklastite, Oberpleistozän (jünger als 126 000 J.)","#d67446"]},{"id":77,"k":4,"r":"Insel Ischia","s":105,"t":"F","b":"Thermen von Lacco Ameno am Monte Vico, Hauptquelle Santa Restituta; warme Wasser und Dämpfe im Meer","n":"Lacco Ameno, Fonte di Santa Restituta","z":"Thermalbäder in Betrieb","zg":"frei","sg":"Area Marina Protetta Regno di Nettuno","g":"Thermalwasser am Rand des Epomeo-Blocks","l":"genau","la":40.7558,"lo":13.8868,"c":"Lacco Ameno (NA)","ex":"[…] Berühmte Thermen finden sich im benachbarten Lacco Ameno am Gehinge des Monte Vico-Vorgebirges (121 m). Nach einer geistlichen Anstalt heisst die Hauptquelle Sorgente di Santa Restituta. In der Nähe bemerkt man Dämpfe und warme Wasser im Meere. Ein grosser Theil dieser Thermen ist salzig, andere sind schwefelhaltig; die ersteren können, wenn sie am Strande liegen, durch Dämpfe erhitztes Meerwasser sein. Da ein Theil der Quellen zu Heilzwecken dient, war vor dem grossen Beben von 1883 Ischia und speciell Casamicciola mit seinen kräftigen und mannigfaltigen Wassern ein sehr besuchter Badeort, wohin sich die Neapolitaner in der heissen Sommerzeit zurückzogen. […]","sp":105,"u2":["Spiagge sabbiose e duna litoranea recente","Holozän","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"]},{"id":78,"k":4,"r":"Insel Ischia","s":107,"t":"O","b":"Erdbeben von Casamicciola, 28. Juli 1883 (angeblich 5000 Tote); Trümmerfeld 1901 aufgeräumt und überwachsen; Erdbebenwarte","n":"Casamicciola Terme","z":"Wieder aufgebaut; Beben 2017 (2 Tote) und Schlammlawine vom Epomeo 2022 (12 Tote); Geophysikalisches Observatorium (1885) erhalten","zg":"frei","sg":"–","g":"Flache, starke Beben am Nordrand des gehobenen Epomeo-Blocks","l":"genau","la":40.7465,"lo":13.908,"c":"Casamicciola Terme (NA)","ex":"[…] Von dritter Seite ist darauf hingewiesen, dass die bergmännische Gewinnung der Creta, des oben genannten Töpferthones, den Boden durchlöchert habe, so dass auch bei geringem Anstoss die auf soleh unsicherem Grunde errichteten Gebäude zusammenbrechen müssten. Das mag Alles zur Verwüstung am 28. Juli 1883 beigetragen haben; die eigentliche Ursache der Beben ist aber nur in dem Vulkanismus zu suchen, der dem aufsteigenden Magma an dieser einzigen, noch nicht durch Trachytmassen verstopften Stelle des nördlichen Epomeo-Gehänges einen Austritt zu schaffen strebt. […]","sp":107,"u2":["Tufo trachitico","Oberpleistozän","Pyroklastite, Oberpleistozän (jünger als 126 000 J.)","#d67446"]},{"id":79,"k":4,"r":"Insel Ischia","s":109,"t":"K","b":"Hutförmiger Tufffelsen vor dem Hafen von Lacco Ameno, unten von den Wellen benagt","n":"Il Fungo, Lacco Ameno","z":"Wahrzeichen von Lacco Ameno","zg":"frei","sg":"Area Marina Protetta Regno di Nettuno","g":"Tuffblock mit Brandungshohlkehle","l":"genau","la":40.7553,"lo":13.889,"c":"Lacco Ameno (NA)","ex":"[…] Ein Nachmittagsspaziergang reicht aus, um Casamicciola und Lacco Ameno zu besuchen. Vor dessen Hafen steht ein hutförmiger Tufffelsen, der letzte Rest einer grösseren Klippe, deren untere Theile von den Wellen benagt werden, während oben etwas widerstandsfähigere Schichten den Fuss gegen Regenerosion schützen, wodurch die pilz- oder hutförmige Gestalt hervorgerufen wird. In der Schlucht bei Mezzavia kommen zwischen der Marina di Lacco und Pannella (Pennella) fossilführende marine Schichten, d. h. 20 m über dem Meere Sande mit Trachyttrümmern, Bimssteinen mit Cardium edule, Echinodermen und anderen noch jetzt im Meere lebenden Muscheln vor. […]","sp":109},{"id":80,"k":4,"r":"Insel Ischia","s":109,"t":"A","b":"Schlucht bei Mezzavia zwischen Marina di Lacco und Pannella: marine Sande mit Herzmuscheln 20 m über dem Meer","n":"Hang zwischen Lacco Ameno und Casamicciola (Mezzavia)","z":"Lage geschätzt","zg":"unklar","sg":"–","g":"Gehobene marine Ablagerungen","l":"geschätzt","la":40.7525,"lo":13.8975,"c":"Lacco Ameno (NA)","ex":"[…] Vor dessen Hafen steht ein hutförmiger Tufffelsen, der letzte Rest einer grösseren Klippe, deren untere Theile von den Wellen benagt werden, während oben etwas widerstandsfähigere Schichten den Fuss gegen Regenerosion schützen, wodurch die pilz- oder hutförmige Gestalt hervorgerufen wird. In der Schlucht bei Mezzavia kommen zwischen der Marina di Lacco und Pannella (Pennella) fossilführende marine Schichten, d. h. 20 m über dem Meere Sande mit Trachyttrümmern, Bimssteinen mit Cardium edule, Echinodermen und anderen noch jetzt im Meere lebenden Muscheln vor. Am Mte. di Vico ist die Quelle der Sta. Restituta und oberhalb derselben wieam ganzen Vorgebirge Trachyt zu sehen. […]","sp":109},{"id":81,"k":4,"r":"Insel Ischia","s":110,"t":"S","b":"Besteigung des Epomeo von Casamicciola, Zickzackweg zur Einsiedelei S. Nicola; weiter Blick über Golf, Campi Flegrei und Ponza-Inseln","n":"Weg Casamicciola – Epomeo","z":"Markierte Wanderwege","zg":"frei","sg":"–","g":"Grüner Epomeo-Tuff","l":"geschätzt","la":40.738,"lo":13.901,"c":"Casamicciola Terme (NA)","ex":"[…] Je nach der Zeit kann man auf das Vorgebirge des Mte. Zale (115 m) vordringen oder auf der Strasse gegen Forio einen Blick auf das fruchtbare Gelände um diesen Ort und die westlichen Gehänge des Mte. Epomeo gewinnen. Einen ganzen Tag beansprucht eine Besteigung des Mte. Epomeo oder S. Nicola, wenn man dabei einige geologisch interessante Punkte aufsucht. Wer diese Excursion bequem ausführen will, folge den Angaben im Bädeker und berücksichtige dabei die hier gemachten Angaben. Eine ziemlich steile Wanderung ist der Anstieg von Casamicciola aus, doch kommt man anfangs durch die zerstörten Theile des Ortes und hat hier und da Gelegenheit, Anbrüche in der Creta des Epomeo-Fusses zu sehen. […]","sp":110,"u2":["Tufiti e sabbie di dilavamento","Oberpleistozän","Lockersedimente, Pleistozän","#f6e6a0"]},{"id":82,"k":4,"r":"Insel Ischia","s":113,"t":"K","b":"Südküste unterhalb Le Piane (Pianole) mit Trachytlagern in verschiedenen Tuffen","n":"Südküste bei Barano (Le Piane)","z":"Lage geschätzt","zg":"unklar","sg":"Area Marina Protetta Regno di Nettuno","g":"Wechsellagerung von Laven und Tuffen im Süden","l":"geschätzt","la":40.703,"lo":13.926,"c":"Barano d'Ischia (NA)","ex":"[…] Ueber Zabutti, Starza, Casa Buona in fruchtbarem Bimssteintuffgelinde kommt man rechts abbiegend nach Piejo, wo am Mte. Garofali (231 m) abermals ein hellgrauer krystalliner Trachyt mit grossen Sanidinen und langen braunen Augiten ansteht. Von Barano aus lässt sich bei reichlicher Zeit die Südküste unterhalb Le Piane (Pianole) mit ihren Trachytlagern in verschiedenartigem Tuff besuchen oder von Zabutti zurückkehrend Campagnano erreichen, der an der Südseite des gleichnamigen Berges anstehende Trachyt schlagen und lassen sich die bei Buona oder oberhalb der Punta di Pisciazza zu Tage tretenden Laven sammeln. Schliesslich kommt man auf Feldwegen nach dem Castello d’Ischia. […]","sp":113,"u2":["Tufi incoerenti pozzolanacei","Oberpleistozän","Pyroklastite, Oberpleistozän (jünger als 126 000 J.)","#d67446"]},{"id":83,"k":4,"r":"Insel Ischia","s":116,"t":"V","b":"Submariner Kegel in der Secca della Piana dell'Armaggio, 1 km vor dem Monte Campagnano, im Mittel 18 m tief","n":"Untiefe vor der Südostküste Ischias","z":"Unterwasser, Tauchgebiet","zg":"eingeschränkt","sg":"Area Marina Protetta Regno di Nettuno","g":"Submariner Vulkan zwischen Ischia und Procida","l":"geschätzt","la":40.7115,"lo":13.972,"c":"Ischia (NA)","ex":"dell’ Armaggio der Südostecke der Insel Ischia und speciell dem Monte Campagnano in 1 km Entfernung vorgelagert ist und sich als eine elliptische, im Durchschnitt 18 m unter dem Meeresspiegel befindliche Untiefe von 5 qkm Ausdehnung darstellt. Die Produkte dieses Ausbruchspunktes sind unbekannt; möglich, dass eine genaue Untersuchung von Ischia und Procida uns zugehörige Tuffe kennen lehrt. son den drei campanischen Vulkanen ist der von Roccamonfina der am wenigsten bekannte und am unbequemsten zu besuchende, weil es sowohl in Teano, als auch in Sessa Aurunca für Fremde an passender Unterkunft mangelt. […]","sp":117},{"id":84,"k":4,"r":"Vivara","s":114,"t":"V","b":"Vivara: Rest eines Kraters, dessen Boden der Golfo di Genito einnimmt; mehrere heftige submarine Explosionen; Breccien an Punta Ciraciello und Punta Alaca mit Basalt und Monzonit","n":"Isola di Vivara","z":"Naturreservat, über eine Brücke von Procida erreichbar; nur mit geführten Besuchen in begrenzter Zahl","zg":"eingeschränkt","sg":"Riserva Naturale Statale Isola di Vivara","g":"Halbkreisförmiger Tuffring der Procida-Vulkane (älter als der Gelbtuff)","l":"genau","la":40.7445,"lo":13.9945,"c":"Procida (NA)","ex":"[…] Das Gestein ist dicht, dunkel, reich an Sodalith und Eisenglanz und enthält nach Rosenbusch auch Rinkit und Lävenit und bildet Gänge. Vivara. Ueber diese Insel, welche ebenfalls der Rest eines Kraters ist, haben jüngst De Lorenzo und Riva eine Monographie herausgegeben, der die folgenden Angaben entnommen sind. Dieser in seinen Dimensionen etwa dem Campiglione vergleich- ‘bare Krater ist an der Südseite zerstört, so dass nur der Nordrand erhalten ist, welcher aus der Insel Vivara und der Punta del Perrichio auf Procida besteht. Der beinahe kreisrunde (Golfo di Cenito nimmt den Kraterboden ein. […]","sp":114,"u2":["Prodotti piroclastici indifferenziati","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":85,"k":4,"r":"Procida","s":115,"t":"H","b":"Castello di Procida auf einem steilen Vorsprung, am Fuß obsidianartige Trachytlava","n":"Terra Murata (Palazzo d'Avalos), Procida","z":"Mittelalterliche Oberstadt; ehemaliges Gefängnis bis 1988","zg":"frei","sg":"Area Marina Protetta Regno di Nettuno","g":"Ältester Lavarest der Insel unter Tuffen","l":"genau","la":40.764,"lo":14.0305,"c":"Procida (NA)","ex":"Kratern entsprechen, in die, ähnlich dem Vivaravulkan, das Meer nach Zerstörung der Ostrinder eingedrungen ist. Das Castello di Procida liegt auf einem dem Felsen von Ischia vergleichbaren, unvermittelt aus dem Meere aufsteigenden Vorsprunge, dessen Fuss dunkle, obsidian- oder pechsteinartige Trachytlava mit glänzenden Sanidinen umschliesst. An dem Nordufer, der Marina di Cattolica, in der Nähe der Nordspitze, der Punta di Ricciola oder Chiuppetto, sowie am Nordwestufer, treten an mehreren Stellen trachytische Ergüsse von 1—2 m Dicke zu Tage. Ueber diesen liegen Breccien und Conglomerate sowie verschieden gefärbte Bimssteintuffe. […]","sp":116,"u1":["ðGë","PD","Holozän bis Pleistozän","Procida","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"],"u2":["Prodotti piroclastici indifferenziati","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":86,"k":4,"r":"Procida","s":116,"t":"A","b":"Nordufer bei der Punta Ricciola (Chiuppetto): trachytische Ergüsse, darüber Breccien mit Sanidiniten, Kalken und leucitführenden Blöcken unter Gelbtuff","n":"Nordküste Procidas bei der Punta Pioppeto","z":"Steilküste, Lage geschätzt","zg":"unklar","sg":"Area Marina Protetta Regno di Nettuno","g":"Ältere Procida-Vulkanite unter Gelbtuff","l":"geschätzt","la":40.772,"lo":14.0225,"c":"Procida (NA)","ex":"[…] Das Castello di Procida liegt auf einem dem Felsen von Ischia vergleichbaren, unvermittelt aus dem Meere aufsteigenden Vorsprunge, dessen Fuss dunkle, obsidian- oder pechsteinartige Trachytlava mit glänzenden Sanidinen umschliesst. An dem Nordufer, der Marina di Cattolica, in der Nähe der Nordspitze, der Punta di Ricciola oder Chiuppetto, sowie am Nordwestufer, treten an mehreren Stellen trachytische Ergüsse von 1—2 m Dicke zu Tage. Ueber diesen liegen Breccien und Conglomerate sowie verschieden gefärbte Bimssteintuffe. In den Breccien sind Sanidinite und mannigfaltige Silikatblöcke mit Hornblende, Augit und Magnetit vertreten, neben Kalksteinen und fossilführenden Tuffen. […]","sp":116},{"id":87,"k":4,"r":"Procida","s":115,"t":"V","b":"Procida: niedrige Tuffinsel; die beiden Buchten am Südostufer vielleicht zwei vom Meer geöffnete Krater","n":"Isola di Procida, Südostküste","z":"Dicht besiedelt, Kulturhauptstadt Italiens 2022","zg":"frei","sg":"Area Marina Protetta Regno di Nettuno","g":"Mehrere ineinandergeschachtelte Tuffringe (Procida-Vulkanfeld)","l":"geschätzt","la":40.758,"lo":14.0225,"c":"Procida (NA)","ex":"[…] Procida. Die Insel Procida (4 qkm) ist eine niedrige Tuffinsel, welche ihre höchsten Punkte im Südosten hat und sich langsam gegen Nordwesten abdacht. Ihre Hauptmasse besteht aus gelbem Tuff, über welchem lockerer Bimssteintuff, z. Th. in recht beträchtlicher Dicke ruht. Möglich ist es, dass die beiden eigenthümlichen Buchten des südöstlichen Ufers zwei g* Kratern entsprechen, in die, ähnlich dem Vivaravulkan, das Meer nach Zerstörung der Ostrinder eingedrungen ist. […]","sp":115},{"id":88,"k":5,"r":"Der Vulkan von Roccamonfina","s":119,"t":"A","b":"Schluchten der Quellbäche des Fiume Savone im weichen Tuff zwischen Bahnhof und Stadt Teano; Rutschungen im Bahneinschnitt","n":"Bahnhof Teano und Savone-Schluchten","z":"Bahnlinie Rom–Neapel über Cassino in Betrieb","zg":"frei","sg":"–","g":"Tuffe des Roccamonfina, z. T. Brauner Leucit-Tuff","l":"geschätzt","la":41.244,"lo":14.075,"c":"Teano (CE)","ex":"genügen, um den Gesammtcharakter des Berges und seine Gesteine kennen zu lernen. Wer bei Teano beginnt, hat Gelegenheit, auf dem Wege von der tiefer gelegenen, 2 km von der Stadt entfernten Station die Schluchten kennen zu lernen, welche sich die Quellbäche des Fiume Savone in die vulkanischen Tuffe eingerissen haben. Dieses weiche, in durchnässtem Zustande zum Rutschen neigende Gestein hat wiederholt in den benachbarten langen Bahneinschnitten Schwierigkeiten verursacht und den Verkehr mit Rom Tage lang empfindlich gestört. Südwestlich von der Station ragt durch den Tuff ein Kalkfelsen, Mte. S. Giulianeto, der in Steinbrüchen angeschnitten ist und schon von der Bahn her auffällt. […]","sp":119,"u2":["Banchi di tufiti","Pleistozän","Pyroklastite, Pleistozän (älter oder nicht näher datiert)","#aa5c46"]},{"id":89,"k":5,"r":"Der Vulkan von Roccamonfina","s":119,"t":"A","b":"Kalkfelsen Monte S. Giulianeto südwestlich des Bahnhofs, in Steinbrüchen angeschnitten: Scholle des zerbrochenen Apennins","n":"Kalkrücken südwestlich von Teano","z":"Lage geschätzt","zg":"unklar","sg":"–","g":"Mesozoischer Plattformkalk des Apennins unter den Vulkaniten","l":"geschätzt","la":41.231,"lo":14.061,"c":"Teano (CE)","ex":"[…] Dieses weiche, in durchnässtem Zustande zum Rutschen neigende Gestein hat wiederholt in den benachbarten langen Bahneinschnitten Schwierigkeiten verursacht und den Verkehr mit Rom Tage lang empfindlich gestört. Südwestlich von der Station ragt durch den Tuff ein Kalkfelsen, Mte. S. Giulianeto, der in Steinbrüchen angeschnitten ist und schon von der Bahn her auffällt. Derselbe ist ebenso wie der Mte. Massico und die Berge von Rocca d’Evandro eine im apenninischen Streichen gelegene nach Südwesten einfallende Scholle des zerbrochenen Gebirges. […]","sp":119,"u2":["Tufo grigio campano - ignimbrite","Pleistozän","Kampanischer Ignimbrit (39 800 J.)","#9684a0"]},{"id":90,"k":5,"r":"Der Vulkan von Roccamonfina","s":119,"t":"V","b":"Basaltischer Strom beim Gehöft Svizzeri, 1,5 km nördlich von Teano","n":"Nördlich von Teano","z":"Lage geschätzt","zg":"unklar","sg":"Parco Regionale Roccamonfina – Foce Garigliano","g":"Basaltische Lava des Roccamonfina","l":"geschätzt","la":41.264,"lo":14.066,"c":"Teano (CE)","ex":"[…] Derselbe ist ebenso wie der Mte. Massico und die Berge von Rocca d’Evandro eine im apenninischen Streichen gelegene nach Südwesten einfallende Scholle des zerbrochenen Gebirges. Gerade nördlich von Teano, 11/, km von der Stadt, läuft bei dem Svizzeri genannten Gehöft ein basaltischer Strom aus, der von der Hauptstrasse aus leicht zu finden ist. Von Teano führt eine Fahrstrasse über Tuoro und Casafredda nach Roccamonfina (ca. 10 km). Nach einer Viertelstunde stösst man auf einen mächtigen Strom von Leucitit, der. nach Nordosten herabgeflossen ist und sich unter Tuffen über Tuoro auf- wärts lange verfolgen lässt. […]","sp":119,"u2":["Tufo trachitico","Pleistozän","Pyroklastite, Pleistozän (älter oder nicht näher datiert)","#aa5c46"]},{"id":91,"k":5,"r":"Der Vulkan von Roccamonfina","s":119,"t":"V","b":"Mächtiger Leucititstrom an der Straße Teano–Tuoro–Roccamonfina, darüber bunte Tuffe","n":"Straße Teano – Tuoro","z":"Lage geschätzt","zg":"frei","sg":"Parco Regionale Roccamonfina – Foce Garigliano","g":"Leucitit (kaliumreiche Lava) des Roccamonfina","l":"geschätzt","la":41.2595,"lo":14.047,"c":"Teano (CE)","ex":"[…] Von Teano führt eine Fahrstrasse über Tuoro und Casafredda nach Roccamonfina (ca. 10 km). Nach einer Viertelstunde stösst man auf einen mächtigen Strom von Leucitit, der. nach Nordosten herabgeflossen ist und sich unter Tuffen über Tuoro auf- wärts lange verfolgen lässt. Die ihn bedeckenden Tuffe stammen vom Vulkane selbst und zeichnen sich zum Theil durch die thonige Zersetzung und die lebhaften Farben aus. Oberhalb Tuoro beginnen “die Schluchten sich schärfer auszuprägen, und an ihren Wänden tritt ein grauer Tuff hervor, wahrscheinlich die Unterlage der Leucitite und Basalte bildend. Dieser Tuff gleicht sehr dem campanischen, so dass A. […]","sp":119,"u2":["Banchi di tufiti","Pleistozän","Pyroklastite, Pleistozän (älter oder nicht näher datiert)","#aa5c46"]},{"id":92,"k":5,"r":"Der Vulkan von Roccamonfina","s":120,"t":"A","b":"Grauer Tuff, bei Forano und Casafredda über 40 m mächtig; bei der Mühle von Casafredda graue Trachyte eines Seitenkraters am Monte Atano","n":"Casafredda und Torano, Teano/Roccamonfina","z":"Lage geschätzt","zg":"unklar","sg":"Parco Regionale Roccamonfina – Foce Garigliano","g":"Weißer Trachyt-Tuff des Roccamonfina; Deecke unterschied ihn richtig vom Kampanischen Ignimbrit","l":"geschätzt","la":41.27,"lo":14.03,"c":"Teano (CE)","ex":"[…] Dies Gestein setzt grosse Theile des Centralkegels zusammen und steht wohl zu den leucittrachytischen Eruptionen des Vulkanes in genetischer Beziehung, ist voraussichtlich kein Augit-, sondern ein Leucit-Trachyttuff. Bei Forano und Casafredda besitzt es über 40 m Mächtigkeit, bei Teano, wo es ebenfalls auftritt, nur 2—3 m, nimmt also normal nach aussen hin ab. In diesem Tuffe treten bei der Mühle von Casafredda und oberhalb nach Torano hin graue, compacte Trachyte mit Einsprenglingen von Augit und Sanidin hervor. Es handelt sich um Ergüsse eines am Mte. Atano gelegenen Seitenkraters, von dem aber wenig mehr zu sehen ist. Dicht vor Torano steht unten im Bache wieder ein Leucitgestein an. […]","sp":120,"u2":["Banchi di tufiti","Pleistozän","Pyroklastite, Pleistozän (älter oder nicht näher datiert)","#aa5c46"]},{"id":93,"k":5,"r":"Der Vulkan von Roccamonfina","s":121,"t":"V","b":"Ringförmige Hochebene (610 m, 5,5 × 4 km) von einem niedrigen Bergkranz umschlossen","n":"Caldera von Roccamonfina","z":"Kastanienwälder, Orte Roccamonfina und Garofali","zg":"frei","sg":"Parco Regionale Roccamonfina – Foce Garigliano","g":"Gipfelcaldera des Roccamonfina (Einbruch vor rund 400 000–300 000 Jahren)","l":"genau","la":41.293,"lo":13.993,"c":"Roccamonfina (CE)","ex":"[…] Dicht vor Torano steht unten im Bache wieder ein Leucitgestein an. Allmählich kommt man in der Schlucht zur Hochebene von Roccamonfina hinauf, die ein abflussloser Kessel wäre, wenn sich der F. Savone nicht in der genannten Klamm durch die lockeren Tuffe einen Ausweg geschaffen hätte. Man betritt nunmehr eine ringförmige Hochebene (610 m) von elliptischer Gestalt mit den Achsen von 5!/, und 4 km. Dieselbe wird von mehreren Bächen in Klammen durchfurcht und ist von einem Bergkranze eingefasst, der sich nur wenig über den ebenen Boden erhebt. Dafür aber steigt in der Mitte die kuppenförmige Masse des Mie. […]","sp":121,"u2":["Coni ed ammassi: ceneri, lapilli, pomici e scorie","Pleistozän","Pyroklastite, Pleistozän (älter oder nicht näher datiert)","#aa5c46"]},{"id":94,"k":5,"r":"Der Vulkan von Roccamonfina","s":121,"t":"V","b":"Monte Croce (1003 m) und Monte Lattani (817 m): stockförmiger Erguss aus Biotit-Augitandesit (Biotit-Vulsinit), schöner Überblick","n":"Monte Santa Croce (1005 m) und Monte Lattani","z":"Wanderwege; Gipfelkreuz","zg":"frei","sg":"Parco Regionale Roccamonfina – Foce Garigliano","g":"Latitische Lavadome in der Caldera (ca. 150 000 Jahre), jüngste Phase des Vulkans","l":"genau","la":41.303,"lo":13.988,"c":"Roccamonfina (CE)","ex":"[…] Dieselbe wird von mehreren Bächen in Klammen durchfurcht und ist von einem Bergkranze eingefasst, der sich nur wenig über den ebenen Boden erhebt. Dafür aber steigt in der Mitte die kuppenförmige Masse des Mie. Croce bis zu 1003 m empor, der sich durch eine Senke getrennt im Nordosten die niedrigere des Mte. Lattani (817 m) anschliesst. Diese zusammen sind ein aus dem zugehörigen Aschenkegel herauspräparirter, stockförmiger Erguss, welcher in seiner mineralogischen und chemischen Zusammensetzung von allen anderen Producten des Vulkanes abweicht. Man hat ihn früher als ein Biotit- Augitandesit, neuerdings (Washington) als einen Biotit-Vulsinit bezeichnet. […]","sp":121,"u2":["Vulsinite e trachiandesite - domi","Pleistozän","Lockersedimente, Pleistozän","#f6e6a0"]},{"id":95,"k":5,"r":"Der Vulkan von Roccamonfina","s":122,"t":"A","b":"Basalt in der Schlucht zwischen Roccamonfina und Garofali","n":"Schlucht bei Garofali, Roccamonfina","z":"Lage geschätzt","zg":"unklar","sg":"Parco Regionale Roccamonfina – Foce Garigliano","g":"Basaltische Lava","l":"geschätzt","la":41.286,"lo":13.967,"c":"Roccamonfina (CE)","ex":"[…] Am Mte. Lattani ist er etwas mehr zersetzt. Wer Zeit hat, kann in der Schlucht zwischen Roccamönfina und Garofali einen Basalt schlagen, andere Vorkommen solchen Gesteins stehen in der Ebene am Nordnordwestfusse des Mte. Croce an. Dies sind compacte, schwarze, splittrige Felsarten mit wenigen Augiteinsprenglingen und Olivinkörnern. 1) Sio, 55,69, AI,O, 19,08, Fe,0, 4,07, FeO 3,26, MgO 3,41, CaO 6,87, Na,0 2,89, K,0 4,41, H,O 0,17, Summe 99,85. Von Roccamonfina lässt sich auf zwei Wegen wieder die Bahn erreichen, nämlich entweder nordwärts über den Mte. S. Antonio, Conca, am Mte. Friello vorbei nach Mignano oder südlich über Le Forche nach Sessa Aurunca. […]","sp":122,"u2":["Detrito di falda","Holozän","Hangschutt, Rutschmassen","#ecdeba"]},{"id":96,"k":5,"r":"Der Vulkan von Roccamonfina","s":123,"t":"A","b":"Ringwall zwischen Monte Trascara und Tuororame: Leucitophyre mit walnussgroßen Leuciten; lose Leucite im Wirtshaus zu kaufen","n":"Nördlicher Calderarand des Roccamonfina","z":"Lage geschätzt; Leucitkristalle als Fundstücke bekannt","zg":"frei","sg":"Parco Regionale Roccamonfina – Foce Garigliano","g":"Leucit-Phonolithe und -Tephrite mit großen Leucit-Einsprenglingen","l":"geschätzt","la":41.315,"lo":13.995,"c":"Conca della Campania (CE)","ex":"[…] Auf dem nördlichen Wege, der etwa 15 km lang ist, überschreitet man zuerst am Mte. Lattani den Andesit, steigt dann zwischen Mte. Trascara und Tuororame auf den alten Ringwall hinauf und zwar über Leucitophyre, die theils ein Sanidingestein mit wenigen Leuciten, theils weissliche Felsarten mit zahlreichen grossen Leuciten darstellen. Solche Ergüsse mit walnussgrossen Leuciten kommen am Ringwalle wiederholt vor. Wo sie stärker verwittert sind, pflegen die Leucite in erdigen Kaolin umgewandelt zu sein. Zonarer Bau, regelmässige Anordnung der Einschlüsse, aussergewöhnliche Sprödigkeit u.s.w. sind ihre Hauptmerkmale.! […]","sp":123,"u2":["Coni ed ammassi: ceneri, lapilli, pomici e scorie","Pleistozän","Pyroklastite, Pleistozän (älter oder nicht näher datiert)","#aa5c46"]},{"id":97,"k":5,"r":"Der Vulkan von Roccamonfina","s":123,"t":"A","b":"Grauer Leucittephrit am Monte S. Antonio; bei Conca ein schmaler Strom mit doleritischer Struktur","n":"Conca della Campania","z":"Lage geschätzt","zg":"unklar","sg":"Parco Regionale Roccamonfina – Foce Garigliano","g":"Leucit-Tephrit","l":"geschätzt","la":41.33,"lo":13.992,"c":"Conca della Campania (CE)","ex":"Von Roccamonfina lässt sich auf zwei Wegen wieder die Bahn erreichen, nämlich entweder nordwärts über den Mte. S. Antonio, Conca, am Mte. Friello vorbei nach Mignano oder südlich über Le Forche nach Sessa Aurunca. Auf dem nördlichen Wege, der etwa 15 km lang ist, überschreitet man zuerst am Mte. Lattani den Andesit, steigt dann zwischen Mte. Trascara und Tuororame auf den alten Ringwall hinauf und zwar über Leucitophyre, die theils ein Sanidingestein mit wenigen Leuciten, theils weissliche Felsarten mit zahlreichen grossen Leuciten darstellen. Solche Ergüsse mit walnussgrossen Leuciten kommen am Ringwalle wiederholt vor. […]","sp":123,"u2":["Banchi di tufiti","Pleistozän","Pyroklastite, Pleistozän (älter oder nicht näher datiert)","#aa5c46"]},{"id":98,"k":5,"r":"Der Vulkan von Roccamonfina","s":124,"t":"V","b":"Monte Friello: parasitischer Kegel mit Basalt im Steinbruch an der Straße; bis Mignano ein mächtiger Leucittrachyt","n":"Nordhang Richtung Mignano Monte Lungo","z":"Lage geschätzt","zg":"unklar","sg":"–","g":"Parasitärer Schlackenkegel am Nordhang","l":"geschätzt","la":41.36,"lo":13.985,"c":"Galluccio (CE)","ex":"[…] Die gleichen Felsarten kommen unterhalb Orchi vor, z. B. bei Conca in einem schmalen Strom mit doleritischer Structur und dunkler Farbe. Dort steht ferner der graue Tuff an, einige Kilometer bergabwärts am Mte. Friello Basalt in einem an der Strasse gelegenen Steinbruche Zwischen dem letzteren und Mignano überschreitet die Chaussee einen mächtigen, bis an die Eisenbahn reichenden Leucittrachyt. […]","sp":124,"u2":["Coni di scorie","Pleistozän","Pyroklastite, Pleistozän (älter oder nicht näher datiert)","#aa5c46"]},{"id":99,"k":5,"r":"Der Vulkan von Roccamonfina","s":124,"t":"A","b":"Südweg über Le Forche: Leucitgesteine am Monte Mattone, dann lange Ergüsse von Leucititen und Leucittephriten gegen das Garigliano-Tal","n":"Südflanke Roccamonfina – Sessa Aurunca","z":"Lage geschätzt","zg":"unklar","sg":"Parco Regionale Roccamonfina – Foce Garigliano","g":"Leucitit- und Tephrit-Laven","l":"geschätzt","la":41.266,"lo":13.96,"c":"Sessa Aurunca (CE)","ex":"[…] Dort steht ferner der graue Tuff an, einige Kilometer bergabwärts am Mte. Friello Basalt in einem an der Strasse gelegenen Steinbruche Zwischen dem letzteren und Mignano überschreitet die Chaussee einen mächtigen, bis an die Eisenbahn reichenden Leucittrachyt. Der Mte. Friello ist einer der parasitischen Kegel, welche dem Nord- und Nordostabhange des Hauptberges aufgesetzt erscheinen. | Wer gegen Süden von Roccamonfina nach Sessa wandert (ca. 11 km!), kommt bei Le Forche ebenfalls auf den Ringwall hinauf und findet am Mte. Mattone Leucitgesteine in grösserer Zahl, etwas weiter unten Leucitophyre, dann die reichlichen, gegen das Gariglianothal gewendeten, langen Ergüsse von Leucititen und Leucittephriten. […]","sp":124,"u2":["Coni ed ammassi: ceneri, lapilli, pomici e scorie","Pleistozän","Pyroklastite, Pleistozän (älter oder nicht näher datiert)","#aa5c46"]},{"id":100,"k":5,"r":"Der Vulkan von Roccamonfina","s":124,"t":"F","b":"Bei Sujo alte römische Bäder auf noch vorhandenen warmen Sprudeln","n":"Suio Terme am Garigliano (Castelforte, Latium)","z":"Thermalort in Betrieb","zg":"frei","sg":"–","g":"CO₂-reiche Thermalquellen am Garigliano","l":"geschätzt","la":41.286,"lo":13.852,"c":"Castelforte (LT, Latium)","ex":"[…] Auch nach der Kreuzung mit der Strasse Sessa-Galluccio - Mignano bleibt man im Bereiche solcher Gesteine, bis in der näheren Umgebung von Sessa Tuffe und Aschen vorzuherrschen beginnen. In der Nähe von Sessa sind bei Sujo alte römische Bäder mit mannig- 1) Doch ist bei der Zeiteintheilung zu berücksichtigen, dass die Station Sessa 2 km von dem Ort entfernt ist. fachen Anlagen aufgedeckt, denen warme, noch vorhandene Sprudel als Grundlage dienten. Oestlich von Sessa erhebt sich der Mte. Massico mit Hauptdolomit- und Kreideschichten. Ein Besuch derselben lisst sich am besten von Sessa aus bewerkstelligen. […]","sp":124,"u2":["Argille sabbiose, limi, sabbie","Holozän","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"]},{"id":101,"k":5,"r":"Der Vulkan von Roccamonfina","s":125,"t":"A","b":"Monte Massico östlich von Sessa: Hauptdolomit und Kreide; am Monte Pecoraro bei Cascano treten Triasschichten hervor","n":"Monte Massico","z":"Kalkrücken mit Weinbau (Falerner)","zg":"frei","sg":"–","g":"Mesozoische Karbonatplattform (Trias–Kreide), Horst am Rand der kampanischen Ebene","l":"genau","la":41.17,"lo":13.93,"c":"Falciano del Massico (CE)","ex":"fachen Anlagen aufgedeckt, denen warme, noch vorhandene Sprudel als Grundlage dienten. Oestlich von Sessa erhebt sich der Mte. Massico mit Hauptdolomit- und Kreideschichten. Ein Besuch derselben lisst sich am besten von Sessa aus bewerkstelligen. Am Mte. Pecoraro bei Cascano treten die triadischen Schichten hervor, an denen gegen Südosten die Urgonkalke abgesunken sind. Natürlich kann man von Roccamonfina über den Mte. Mattone auch direct nach Süden auf Maulthierwegen nach Cascano und von dort nach Teano zurückkehren. Dabei trifft man zwischen Giusti und Capelle mehrere Basalte, bei Fontanelle Leucittephrite und 2!/, km vor Teano Leucitophyre. Dieser Weg kann auf 18 km veranschlagt werden. […]","sp":125,"u2":["Calcari a pasta fine","oberes Lias bis unteres Neokom","Rhätium","#e3b9db"]},{"id":102,"k":6,"r":"Monte Somma und Vesuv – Bau und Geschichte","s":127,"t":"A","b":"Bohrung bei Ponticelli (25 m ü. M., 177 m tief): Pozzolane und Meeressande, Leucitbasanit vom Somma-Typ, darunter Tuffe der Phlegräischen Felder; Beleg für einen früheren Meerbusen zwischen beiden Vulkanen","n":"Ponticelli, östliches Neapel","z":"Dicht bebautes Stadtviertel; die Bohrung selbst ist nicht mehr sichtbar","zg":"frei","sg":"–","g":"Die Ebene zwischen Neapel und Vesuv ist mit Ablagerungen beider Vulkangebiete aufgefüllt; der Kampanische Ignimbrit (39 800 Jahre) liegt hier in der Tiefe","l":"geschätzt","la":40.853,"lo":14.343,"c":"Napoli (NA)","ex":"nur auf das Wichtigste in der Entwicklungsgeschichte des Berges und seiner Eruptionen darf aufmerksam gemacht werden. Von den ältesten geologisch - topographischen Verhältnissen der Gegend giebt eine bei Ponticelli 25 m ü.d.M. angestellte, bis 177,25 m hinabgeführte Bohrung Kunde. […]","sp":127,"u1":["Unità di pomigliano","UGL","Holozän","Ercolano","Fluss-, Küsten-, Seesedimente, Holozän","#faf4c8"],"u2":["Lapilli e cineriti","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":103,"k":6,"r":"Monte Somma und Vesuv – Bau und Geschichte","s":138,"t":"H","b":"Die neu entdeckten römischen Villen bei Bosco Tre Case stecken unter einer mächtigeren Tuffdecke als Pompeji","n":"Römische Villen von Boscoreale (Villa Regina, Antiquarium)","z":"Villa Regina mit Weinkeller ausgegraben, Antiquarium von Boscoreale zugänglich; der Silberschatz der Villa della Pisanella (1895) liegt im Louvre","zg":"frei","sg":"Parco Archeologico di Pompei (UNESCO-Welterbe)","g":"Fallablagerungen (Bims) und pyroklastische Ströme der plinianischen Eruption von 79 n. Chr.","l":"geschätzt","la":40.7735,"lo":14.4735,"c":"Boscoreale (NA)","ex":"Stellen sind gar 7—8 m gemessen, und gegen den Vesuv hin mag die Dicke noch mehr zunehmen. Jedenfalls stecken die neuerdings entdeckten römischen Villen bei Bosco Tre Case unter mächtigerer Tuffdecke als Pompeji. Der Ausdehnung dieses Aschenregens über Stabiae in der Nähe von Castellammare, über die Sorrentiner Kette und Capri ist oben (S. 55) gedacht; ja es hat der Wind den feinen Staub über ganz Unteritalien und einen Theil der Balkanhalbinsel weg geführt, genau so wie 1631. Das an der Stelle des heutigen Resina befindliche Herkulanum wurde weniger durch Bimssteinregen als durch Schlammströme begraben, welche aus den Schluchten des Berges hervorbrachen. […]","sp":138,"u1":["Piroclastiti di Pompei","PPM","Holozän","Sorrento","Pyroklastite, Holozän","#f09660"],"u2":["Cono vesuviano - ceneri, lapilli, e scorie di lancio","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":104,"k":6,"r":"Monte Somma und Vesuv – Bau und Geschichte","s":145,"t":"L","b":"Lava von 1631: ein Arm erreichte Resina und Portici und schuf das gerundete Vorgebirge Il Granatello mit prismatisch abgesonderter Lava; der größte historische Ausbruch nach 79","n":"Porto del Granatello, Portici","z":"Hafen und Strand am Ende der Lavazunge; dahinter die Reggia di Portici","zg":"frei","sg":"–","g":"Lavastrom der subplinianischen Eruption vom 16. Dezember 1631 (rund 4000 Tote)","l":"genau","la":40.8105,"lo":14.3345,"c":"Portici (NA)","ex":"[…] Endlich er- | goss sich eine enorme Lavamenge, welche in breiten Armen die Abhänge zwischen Torre del l’Annunziata und Portici überfluthete und im Norden sich bis Madonna dell’Arco erstreckte. Ein Lavaarm zerstörte Bosco und floss bei Torre Annunziata 200 m weit ins Meer, ein anderer vernichtete Torre del Greco und drang 400 m in die See vor, ein dritter erreichte Resina und Portici und schuf dort ein gerundetes Vorgebirge il Granatello genannt, wo man diese theilweise prismatisch abgesonderte Lava leicht beobachten kann. Der vierte Strom wandte sich westlich über S. Giorgio a Cremano nach Barra und S. Giovanni a Teduccio. […]","sp":145,"u1":["Piroclastiti di s. giuseppe vesuviano","PMX","Holozän","Ercolano","Pyroklastite, Holozän","#f09660"]},{"id":105,"k":6,"r":"Monte Somma und Vesuv – Bau und Geschichte","s":148,"t":"V","b":"Ausbruch 1760/61 tief am Südostfuß, 1,75 km nordöstlich des Camaldoli-Hügels: 12 bis 15 kleine parasitische Kegel („Voccoli“), Strom bis fast ans Meer zwischen den beiden Torre","n":"Bocche del 1760 (Contrada Fossamonaca), Torre del Greco","z":"Die Kegelreihe liegt zwischen Gärten und Bebauung, teils noch erkennbar","zg":"eingeschränkt","sg":"Parco Nazionale del Vesuvio (Randbereich)","g":"Seitenspalte von 1760 auf nur rund 300 m Höhe, eine der tiefsten Ausbruchsstellen des Vesuvs","l":"geschätzt","la":40.7895,"lo":14.423,"c":"Torre del Greco (NA)","ex":"[…] Eine viel beschriebene Eruption war die von 1760— 1761, weil nach vorlaufenden Beben der Berg im Südosten tief unten, nur 13/, km nordöstlich von dem Camaldoli- Hügel barst und einen Strom schuf, der zwischen den beiden Torre beinahe die See erreichte. Erst 12, dann 15 kleine parasitische Kegel thürmten sich an dieser Stelle auf, sind z. Th. noch heute deutlich erkennbar und heissen Voccoli. Nachdem vorher die Nordseite Schauplatz von Lavadurchbrüchen gewesen, wurde 1767 die Gegend zwischen Torre del Greco und Resina heimgesucht. Am 19. Oktober riss eine lange Spalte auf, aus der die glühende Masse in Form einer hochsteigenden Fontäne hervorquoll. […]","sp":148,"u1":["Piroclastiti di caduta","LPVc","Holozän","Sorrento","Pyroklastite, Holozän","#f09660"],"u2":["Lave dall'anno 1694 al 1944","Holozän","Lavastrom, historisch datiert","#b01c24"]},{"id":106,"k":6,"r":"Monte Somma und Vesuv – Bau und Geschichte","s":150,"t":"L","b":"Lava von 1834 (und 1850) floss durch eine Lücke des Somma-Walls nach Osten und kam bei Caposecchi zum Stehen; ihre breite Front wird in Steinbrüchen abgebaut","n":"Steinbruch- und Deponiegebiet bei Terzigno","z":"Großflächig abgebaut, später teils als Mülldeponie genutzt (Konflikte um die Deponien 2010)","zg":"eingeschränkt","sg":"Parco Nazionale del Vesuvio","g":"Leucit-tephritische Laven von 1834 und 1850 am Ostfuß","l":"geschätzt","la":40.807,"lo":14.478,"c":"Terzigno (NA)","ex":"des Somma-Walles nach Osten wandte und erst am Fusse des Berges bei Caposecchi Halt machte. Dort wird seine breite Front jetzt durch Steinbrüche abgebaut. Denselben Weg schlug 1850 die Lava ein, die einer den Hauptkegel an der Nordseite durchsetzenden Spalte entströmte, nachdem in den vierziger Jahren der Berg zwar in beständiger Unruhe gewesen war, aber sich doch nur auf kleine Ergüsse am Kraterrand und am obersten Gehänge beschränkt hatten. […]","sp":150,"u1":["Depositi piroclastici di caduta (1944)","LPVe","Holozän","Ercolano","Pyroklastite, Holozän","#f09660"],"u2":["Cono vesuviano - ceneri, lapilli, e scorie di lancio","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":107,"k":6,"r":"Monte Somma und Vesuv – Bau und Geschichte","s":150,"t":"L","b":"Lava von 1855 im Fosso della Vetrana zwischen Somma und Observatorium, über Massa di Somma hinaus bis ½ km vor Cercola; 17 Mio. m³","n":"Fosso della Vetrana mit den Lavaströmen von 1855, 1872 und 1944","z":"Waldbedeckte Lavarinne unterhalb des Observatoriums; Wanderwege des Nationalparks","zg":"frei","sg":"Parco Nazionale del Vesuvio","g":"Hauptabflussrinne der Laven nach Nordwesten; 1944 floss hier der letzte Lavastrom des Vesuvs","l":"geschätzt","la":40.832,"lo":14.404,"c":"Massa di Somma (NA)","ex":"[…] Fünf Jahre später, den 1. Mai 1855, riss westlich der Ausbruchsstelle von 1850 der Aschenmantel abermals entzwei und liess soviel Magma in zwei Perioden austreten, dass dieses binnen einer Woche am Westfusse in das Vorland über Massa di Somma hinaus gelangte. Der Strom bewegte sich zwischen Mte. Somma und dem Observatorium im Fosso della Vetrana, theilte sich an dessen unterem Ende und entsandte einen Arm westwärts bis dicht vor 8. Giorgio a Cremano, die Hauptmasse wälzte sich zwischen S. Sebastiano und Massa di Somma hindurch, stürzte sich in den Entwässerungskanal und blieb endlich 1/, km vor Cercola stehen. Sein Volumen wird auf 17 Mill. Cubikmeter geschätzt. […]","sp":150,"u1":["Colata lavica del 1944","LPVa","Holozän","Ercolano","Lavastrom, historisch datiert","#b01c24"],"u2":["Lave dall'anno 1694 al 1944","Holozän","Lavastrom, historisch datiert","#b01c24"]},{"id":108,"k":6,"r":"Monte Somma und Vesuv – Bau und Geschichte","s":152,"t":"L","b":"Ausbruch ersten Ranges vom 24.–26. April 1872: Lava zu beiden Seiten des Observatoriums bis über Massa di Somma und gegen S. Giorgio; rund 20 Schaulustige starben im Atrio","n":"Massa di Somma und San Sebastiano al Vesuvio","z":"Beide Orte wurden 1944 erneut von Lava getroffen, San Sebastiano weitgehend zerstört und danach neu aufgebaut","zg":"frei","sg":"Rote Zone des Vesuv-Notfallplans","g":"Laven von 1855, 1872 und 1944; Schlackendecke der Lava 1872 oberhalb von Massa noch gut erhalten","l":"genau","la":40.8455,"lo":14.37,"c":"San Sebastiano al Vesuvio (NA)","ex":"des Berges zerriss am 26. der Aschenkegel an der Nordseite unter mächtiger Rauchentwickelung und ergoss so schnell eine enorme Lavafluth, dass gegen 20 Personen, die sich im Atrio die Erscheinungen aus der Nähe ansehen wollten, in den glühenden Massen zu Grunde gingen. Das geschmolzene Gestein floss zu beiden Seiten des Observatoriumhügels in die Tiefe, nördlich in dem Fosso della Vetrana der Lava von 1855 folgend, wiederum bis über Massa di Somma hinaus und mit einem Seitenarme in die Gegend von S. Giorgio; südlich des Observatoriums über die Lava von 1858 und 1767 bis ca 300 m Höhe ü.d. […]","sp":152,"u1":["Colata lavica del 1944","LPVa","Holozän","Ercolano","Lavastrom, historisch datiert","#b01c24"],"u2":["Lave dall'anno 1694 al 1944","Holozän","Lavastrom, historisch datiert","#b01c24"]},{"id":109,"k":6,"r":"Monte Somma und Vesuv – Bau und Geschichte","s":153,"t":"V","b":"Ausbruch 1891–93 auf einer N–S-Spalte: langsamer Lavaaustritt baute im Atrio einen stattlichen Hügel auf","n":"Colle Margherita im Atrio del Cavallo","z":"Lavakuppe im Atrio, teils bewachsen; Pfad über die Kraterwege des Parks","zg":"eingeschränkt","sg":"Parco Nazionale del Vesuvio","g":"Effusive Lavakuppe (Lava-„Tumulus“) von 1891–1894","l":"geschätzt","la":40.831,"lo":14.4185,"c":"Ercolano (NA)","ex":"[…] Die Lava floss . über zwei Jahre, schlug vorübergehend den Weg in den Fosso della Vetrana ein, erstarrte aber in der Höhe des Observatoriums. Der beständige Ausfluss schuf im Atrio einen stattlichen Hügel, der das Profil dieses Thales unterbricht und sein Relief wesentlich umgestaltete (Fig. 18). Schaden ist’ 1891 bis 1893 nicht entstanden, da ja nur die ödesten Partien des Berges Schauplatz der Lavaanhäufung wurden (Fig. 14). […]","sp":153,"u1":["Colata lavica del 1895-99","LPVa","Holozän","Ercolano","Lavastrom, historisch datiert","#b01c24"],"u2":["Lave dall'anno 1694 al 1944","Holozän","Lavastrom, historisch datiert","#b01c24"]},{"id":110,"k":6,"r":"Monte Somma und Vesuv – Bau und Geschichte","s":154,"t":"V","b":"Ausbruch 1895–1900 nahe der unteren Seilbahnstation: zäher Ausfluss türmte einen 100 m hohen kuppelförmigen Hügel auf, die Straße zur Seilbahn mehrfach überflossen","n":"Colle Umberto am Westfuß des Gran Cono","z":"Bewachsene Lavakuppe; die Fahrstraße nach Quota 1000 führt daran vorbei","zg":"frei","sg":"Parco Nazionale del Vesuvio","g":"Effusive Lavakuppe von 1895–1899","l":"geschätzt","la":40.8235,"lo":14.4045,"c":"Ercolano (NA)","ex":"zurückgekehrt, als eine gleiche Eruption an der Südwestseite nahe der unteren Drahtseilbahnstation begann, die von 1895 bis 1900 dauerte und durch beständigen langsamen, zähen Ausfluss auch dort einen kuppelförmigen Hügel von ca. 100 m Höhe aufthürmte. Trotz der dem Volumen nach recht ansehnlichen Förderung haben sich nur einmal kurze Zungen auf dem südlichen Arme der Lava von 1872 über den Abhang des Berges ergossen, indessen oberhalb des bebauten Geländes Halt gemacht. Die Strasse zur Drahtseilbahn freilich ist mehrfach überflossen worden (Fig. 14 u. 15). Als Gesammtresultat ergiebt sich, dass nach d.J. 79 der Vesuv zuerst anscheinend in grossen Pausen. […]","sp":154,"u1":["Colata lavica del 1895-99","LPVa","Holozän","Ercolano","Lavastrom, historisch datiert","#b01c24"],"u2":["Lave dall'anno 1694 al 1944","Holozän","Lavastrom, historisch datiert","#b01c24"]},{"id":111,"k":6,"r":"Monte Somma und Vesuv – Bau und Geschichte","s":157,"t":"L","b":"Strick- oder Girlandenlava an der Fahrstraße zum Observatorium, trefflich an der Lava von 1858 (Fig. 16); 1822er Lava am Fuß des Aschenkegels rau und schlackig","n":"Lava von 1858 an der Straße Ercolano–Vesuvio","z":"Pahoehoe-Oberflächen an der Strada Provinciale und am Parkweg „Il Fiume di Lava“","zg":"frei","sg":"Parco Nazionale del Vesuvio","g":"Pahoehoe-artige Stricklava und Aa-Lava der Ausbrüche von 1858 und 1822","l":"geschätzt","la":40.8195,"lo":14.388,"c":"Ercolano (NA)","ex":"[…] Auch der Strom von 1872 besitzt eine solche Decke, die oberhalb Massa noch jetzt ziemlich intakt ist. Eine andere Form der Oberfläche ist die Strick - oder Guirlandenlava, welche man an der Fahrstrasse zum Observatorium trefflich an der Lava von 1858 beobachtet (Fig. 16). Diese guirlandenähnlichen, concentrisch gebogenen Stricke entstehen dadurch, dass zwischen den bereits erhärteten Schlacken neues flüssiges Material hervortritt und zähen Nachschub erhält. Eine Varietät dieser Form ist die an Kuhfladen erinnernde Fladenlava. In grosse Blöcke zerfallende heisst Blocklava, solche von flachen, ebenen Schollen Schollenlava. […]","sp":157,"u1":["Colata lavica del 1858","LPVa","Holozän","Ercolano","Lavastrom, historisch datiert","#b01c24"],"u2":["Lave dall'anno 1694 al 1944","Holozän","Lavastrom, historisch datiert","#b01c24"]},{"id":112,"k":6,"r":"Resina – Observatorium – Krater – Bosco Tre Case","s":162,"t":"L","b":"Auf dem Rücken des 1631er Stroms steil hinauf zum Platz mit der Kirche S. Maria a Pugliano; dort steht die Lava direkt an","n":"Santuario di Santa Maria a Pugliano, Ercolano","z":"Kirchplatz im Ortskern von Ercolano","zg":"frei","sg":"–","g":"Lavastrom von 1631","l":"genau","la":40.8093,"lo":14.3533,"c":"Ercolano (NA)","ex":"[…] Sie wird durch einen Arm der 1631 ergossenen Lava veranlasst, welcher sich über die jetzigen Gärten des Schlosses in breiter Front in das Meer wälzte und das Vorgebirge il Granatello schuf. Von dem Schlossportal bis zu den Ausgrabungen Herkulanum’s, d. h. in der Hauptstrasse Resina’s, bleibt man ca. 700 m lang auf dessen Höhe und geht dann bei der Strassenkreuzung in Resina rechtwinklig abbiegend auf dem Rücken dieses Stromes in der Seitenstrasse steil hinauf bis zu dem Platze mit der Kirche Sta. Maria a Pugliano. Dort steht die Lava direkt an. Sie lässt sich an der Fahrstrasse unter der Rapilli- und Aschenbedeckung nochmals in 156 m Höhe am zweiten rechtwinkligen Knick beobachten. […]","sp":162,"u1":["Piroclastiti di pompei","PPM","Holozän","Ercolano","Pyroklastite, Holozän","#f09660"],"u2":["Lapilli e cineriti","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":113,"k":6,"r":"Resina – Observatorium – Krater – Bosco Tre Case","s":162,"t":"L","b":"Bei der Kapelle S. Vito (201 m) beginnt der Erguss von 1858, auf dem sich die Straße zum Observatorium hinaufwindet; stark porphyrisch mit erbsengroßen Leuciten","n":"San Vito, Ercolano","z":"Ortsteil an der Straße zum Vesuv","zg":"frei","sg":"–","g":"Leucit-tephritische Lava von 1858","l":"geschätzt","la":40.8135,"lo":14.37,"c":"Ercolano (NA)","ex":"[…] Sie lässt sich an der Fahrstrasse unter der Rapilli- und Aschenbedeckung nochmals in 156 m Höhe am zweiten rechtwinkligen Knick beobachten. Bei der Kapelle S. Vito (201 m) erreicht man den Erguss von 1858, auf dem sich die Strasse mit mancherlei Windungen zum Observatorium hinaufzieht. Diese Lava ist ziemlich stark porphyrisch und durch erbsengrosse Leucite grau gefleckt. In der I Tironi genannten Region (380 m) durchquert man den Strom , der sehr schöne Fluidalerscheinungen aufweist und ziemlich nackt und unbewachsen daliegt. […]","sp":162,"u1":["Lave grigio scure","LVIa","Holozän","Ercolano","Lava, Schlacke, Dom","#7a262e"],"u2":["Lave del 1631","Holozän","Lavastrom, historisch datiert","#b01c24"]},{"id":114,"k":6,"r":"Resina – Observatorium – Krater – Bosco Tre Case","s":163,"t":"L","b":"In der Region I Tironi (380 m) quert man den nackten, unbewachsenen Strom von 1858 mit schönen Fluidalerscheinungen","n":"I Tironi an der Straße Ercolano–Vesuvio","z":"Lava heute teils mit Ginster und Kiefern bewachsen","zg":"frei","sg":"Parco Nazionale del Vesuvio","g":"Lava von 1858","l":"geschätzt","la":40.8195,"lo":14.383,"c":"Ercolano (NA)","ex":"der I Tironi genannten Region (380 m) durchquert man den Strom , der sehr schöne Fluidalerscheinungen aufweist und ziemlich nackt und unbewachsen daliegt. Gleich nachher tritt in scharfem Gegensatze dazu der Abschnitt des Sommakegels, der das Observatorium trägt, mit seinen begrünten Gehängen und tiefen, in die Aschen und Bimssteintuffe eingerissenen Furchen heraus. Nach einigen Serpentinen kehrt die Strasse auf die Lava von 1858 zurück und bleibt bis zum letzten Anstieg auf derselben, um dann wieder das Sommastück zu berühren. Auf diesem letzten Abschnitt fallen die vielen weissen Bimssteine und älteren leucitreichen Lavabomben auf, die überall in dem Sommatuff stecken. […]","sp":163,"u1":["Colata lavica del 1822","LPVa","Holozän","Ercolano","Lavastrom, historisch datiert","#b01c24"],"u2":["Lave dall'anno 1694 al 1944","Holozän","Lavastrom, historisch datiert","#b01c24"]},{"id":115,"k":6,"r":"Resina – Observatorium – Krater – Bosco Tre Case","s":164,"t":"H","b":"Observatorium auf einem Rücken des Somma-Kegels mit Sommatuff und Kalkblöcken; Palmieris Seismograph; Gedenktafel für die Toten von 1872; Blick über die Ströme von 1822 bis 1895","n":"Sede storica dell’Osservatorio Vesuviano (1841), Ercolano","z":"Ältestes Vulkanobservatorium der Welt; heute Museum des INGV, Besuch nach Anmeldung. Die Überwachung läuft vom Sitz in Neapel aus","zg":"eingeschränkt","sg":"Parco Nazionale del Vesuvio","g":"Rücken aus alten Somma-Tuffen, von den jüngeren Laven umflossen","l":"genau","la":40.8273,"lo":14.399,"c":"Ercolano (NA)","ex":"[…] Ein Besuch des Observatoriums selbst ist wenig lohnend, da die Sammlungen schlecht aufgestellt sind. Das einzig Bemerkenswerthe ist der Palmieri’sche ‘Seismograph, dessen Einrichtung derart ist, dass eine Spiralfeder bei Bodenerschütterung in Quecksilber eintaucht, dadurch einen elektrischen Strom schliesst, ein Uhrwerk mit Schreibvorrichtung in Gang setzt: und.ein .Alarınsignal giebt. An der — me on eu cameo Aussenwand des Gebäudes wurde eine Tafel angebracht zur Erinnerung an die 1872 im Atrio di Cavallo durch die hervorbreehende Lava getödteten Neapolitaner. […]","sp":164,"u1":["Colata lavica del 1895-99","LPVa","Holozän","Ercolano","Lavastrom, historisch datiert","#b01c24"],"u2":["Ceneri, lapilli e scorie di lancio con effusioni laviche intercalate: fase vesuvio-somma","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":116,"k":6,"r":"Resina – Observatorium – Krater – Bosco Tre Case","s":165,"t":"H","b":"Station der Drahtseilbahn am Fuß des Aschenkegels; Aufstieg zu Fuß fast eine Stunde in rutschender Asche, Bergstock unentbehrlich","n":"Piazzale Quota 1000, Start des Kraterwegs (Sentiero 5 „Il Gran Cono“)","z":"Die Standseilbahn wurde 1944 zerstört, der spätere Sessellift 1984 stillgelegt. Heute führt ein Fußweg von rund 2 km zum Kraterrand, Eintritt nur mit Online-Zeitfenster; bei Brand oder Unwetter gesperrt","zg":"eingeschränkt","sg":"Parco Nazionale del Vesuvio","g":"Westflanke des Gran Cono aus Lapilli und Asche","l":"geschätzt","la":40.8187,"lo":14.4128,"c":"Ercolano (NA)","ex":"[…] Gerade da, wo dieser Sporn unter den neuen Laven verschwindet, sind am Gehänge alte Tuffe und Laven des Mte. Somma erschlossen. Ueber die verdeckten Laven von 1858 und 1867 gelangt man schliesslich an die Station der Drahtseilbahn. Wer gut zu Fuss ist, mag gleich oberhalb Resina bei dem ersten Strassenknick den geradeaus führenden Weg einschlagen und auf diesem von den Führern und Bahnbeamten benutzten Maulthierwege direkt zur Station hinaufsteigen. […]","sp":165,"u1":["Valanghe ardenti","LPVg","Holozän","Ercolano","Pyroklastite, Holozän","#f09660"],"u2":["Ceneri, lapilli e scorie di lancio con effusioni laviche intercalate: fase vesuvio-somma","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":117,"k":6,"r":"Resina – Observatorium – Krater – Bosco Tre Case","s":166,"t":"V","b":"Kraterrand von 1872, Rundgang empfohlen; im Krater ein ständig wechselnder Eruptionskegel, Fumarolen mit Salzsäure, Augit- und Leucitkristalle; Gipfel 1330 m","n":"Gran Cono del Vesuvio, Krater","z":"Ruhend seit dem Ausbruch vom März 1944; Krater rund 450 m weit und 300 m tief, schwache Fumarolen. Gipfel heute 1281 m (nach den Ausbrüchen von 1906 und 1944)","zg":"eingeschränkt","sg":"Parco Nazionale del Vesuvio; UNESCO-Biosphärenreservat","g":"Jüngster Kegel innerhalb der Somma-Caldera; seit 1944 geschlossenes System, Warnstufe Grün","l":"genau","la":40.8213,"lo":14.4261,"c":"Torre del Greco (NA)","ex":"[…] Vulkanische Rapilli, Bomben und Sande sind dort am besten zu sammeln. Von der oberen Station führt ein bequemerer Zickzackweg nach dem Kraterrande von 1872 hinauf. Aber nach dem anstrengenden Steigen thut man gut, sich ein Tuch umzubinden; denn es pflegt zugig zu sein, ausserdem bleibe man in langsamer Bewegung. Der Blick von der Spitze auf den Golf und die Berghänge ist bei klarem Wetter einzig und, um ihn ganz zu geniessen, ist ein Rundgang um den Krater anzurathen, aber vorsichtig und etwas vom obersten Rande entfernt, weil das lockere Gestein zum Abbrechen neigt. […]","sp":166,"u1":["Detrito di falda","a3","Holozän","Ercolano","Hangschutt, Rutschmassen","#ecdeba"],"u2":["Ceneri, lapilli e scorie di lancio con effusioni laviche intercalate: fase vesuvio-somma","Holozän","Pyroklastite, Holozän","#f09660"]},{"id":118,"k":6,"r":"Resina – Observatorium – Krater – Bosco Tre Case","s":168,"t":"S","b":"Gipfel des Somma-Walls: Monte Primo, Cognoli di Trocchia, Punta Nasone (1137 m), Cognoli d’Ottajano, Cognoli di fuori","n":"Punta Nasone (1132 m), Monte Somma","z":"Erreichbar über Wanderwege von Somma Vesuviana und Ottaviano","zg":"frei","sg":"Parco Nazionale del Vesuvio","g":"Rest der älteren Somma-Caldera, aus Laven und Tuffen mit Gängen","l":"genau","la":40.8335,"lo":14.4325,"c":"Ercolano (NA)","ex":"Vom Kraterrand gegen Norden erblickt man die wilde Kette des Mte. Somma, deren Gipfel von links nach rechts heissen: Mte. Primo (960 m), Cognoli di Trocchia (1000 m), Punta Nasone (1137 m), Cognoli d’ Ottajano (1114 m), Cognoli di fuori (930 — 860 m), so dass der Kranz nach beiden Seiten an Höhe abnimmt und sich in der Mitte in der Punta Nasore ca. 300 m über das 860 m hoch liegende Atrio erhebt. Von oben ist auch der beste Ueberblick über den im Norden hervorgebrochenen, im Thale gestauten Erguss von 1891 —93 zu gewinnen, dessen zugehörige Radialspalte sich am Aschenkegel bemerkbar macht. […]","sp":168,"u1":["Depositi piroclastici di caduta (1944)","LPVe","Holozän","Ercolano","Pyroklastite, Holozän","#f09660"],"u2":["Lave dall'anno 1694 al 1944","Holozän","Lavastrom, historisch datiert","#b01c24"]},{"id":119,"k":6,"r":"Resina – Observatorium – Krater – Bosco Tre Case","s":169,"t":"V","b":"Abstieg nach Bosco: am Fuß des Aschenkegels die Ausbruchskegel von 1754 (800 m), dann die Lava von 1822","n":"Bocche del 1754, Südostflanke des Gran Cono","z":"Verwachsene Schlackenkegel im Wald","zg":"eingeschränkt","sg":"Parco Nazionale del Vesuvio","g":"Seitenausbrüche der Jahre 1751–1754","l":"geschätzt","la":40.8155,"lo":14.436,"c":"Ottaviano (NA)","ex":"Aschenkegels eine Gruppe von Ausbruchskegeln der Eruption von 1754 (800 m), ilberschreitet die Lava von 1822 (600 —500 m) und sieht beim Betreten der bebauten Region aus den Pflanzungen hie und da Reste des Stromes von 1714 (Rione Fruscio, 275 m) hera

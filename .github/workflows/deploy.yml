# Optimiert den Nicepage-Export bei jedem Upload und veröffentlicht ihn auf GitHub Pages.
# Einmalig nötig: Settings → Pages → Build and deployment → Source: "GitHub Actions"
name: Website optimieren und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow und shapely installieren
        run: pip install pillow shapely

      # Umrisse der Übersichtskarte aus geotope/fuehrer/fuehrer.json neu berechnen,
      # damit ein neuer Führer nur dort eingetragen werden muss
      - name: Gebiete der geologischen Führer berechnen
        run: python geotope/fuehrer/gebiete.py

      - name: Website optimieren
        run: python optimize/build.py . _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
